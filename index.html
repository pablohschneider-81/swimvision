/* ============================================================

   ============================================================
   Dirección: premium / científico / minimalista, fondo oscuro con
   glass morphism y acento verde esmeralda — no "gimnasio genérico".

   IMPORTANTE (compatibilidad): en la versión anterior, C.ink cumplía

   las tarjetas "hero"/cámara (32 usos) — porque en un tema claro un
   valor casi negro sirve para ambos. En un tema oscuro eso es
   imposible con un solo token, así que:
     - C.text es el nuevo color de texto principal (antes lo cubría C.ink).
     - C.ink queda EXCLUSIVAMENTE para esos fondos "hero" (ahora un

/* ---------- Traza cinemática (elemento de firma) ---------- */
function KineticTrace({ color = C.teal, height = 40, seed = 1, className = "" }) {
  const pts = [];
  const n = 24;
  for (let i = 0; i <= n; i++) {
    const x = (i / n) * 300;
    const y =
      height / 2 +
      Math.sin(i * 0.6 + seed) * (height * 0.28) +
      Math.sin(i * 0.19 + seed * 2) * (height * 0.14);
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  return (
    <svg viewBox={`0 0 300 ${height}`} className={className} preserveAspectRatio="none" style={{ width: "100%", height }}>
      <polyline points={pts.join(" ")} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" opacity="0.85" />
    </svg>
  );
}

/* ---------- Etiqueta DEMO (obligatoria en todo dato ficticio) ---------- */

/* ---------- Valor numérico con unidad (tratamiento tipográfico propio) ---------- */
function DataValue({ value, unit, size = 28, color = C.text }) {

    </span>
  );
}

function TrendBadge({ delta, positive }) {
  const Icon = delta === 0 ? Minus : positive ? TrendingUp : TrendingDown;
  const color = delta === 0 ? C.inkFaint : positive ? C.teal : C.coral;
  return (
    <span style={{ ...fontMono, color, fontSize: 12 }} className="inline-flex items-center gap-1">
      <Icon size={13} strokeWidth={2.2} />
      {delta > 0 ? "+" : ""}{delta}
    </span>
  );
}

function Dashboard({ setView, assessmentHistory = [], activeAssessment = null, onStartEvaluation }) {

              <div style={{ ...fontBody, color: C.tealDeep, fontSize: 12.5, fontWeight: 600 }}>Evaluación en curso</div>

            </div>

              <span style={{ ...fontBody, color: "#fff", fontSize: 12.5, fontWeight: 600 }}>Continuar</span>
            </button>
          </div>
        )}

        {/* Última evaluación — sin puntuación global hasta definir cómo se calcula */}
        <div className="rounded-2xl p-5" style={{ background: C.ink }}>
          {lastAssessment ? (
            <>
              <div className="flex items-start justify-between">
                <div>
                  <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 12 }}>Última evaluación</div>
                  <div style={{ ...fontDisplay, color: "#fff", fontSize: 18, fontWeight: 600 }} className="mt-1">{lastDate}</div>
                  <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 13 }} className="mt-1">{lastTest?.name || lastAssessment.testId}</div>
                </div>
                <div className="text-right">
                  <DataValue value={lastAssessment.measurements.length} unit="var." size={26} color="#fff" />
                </div>
              </div>
              <KineticTrace color="#2A3540" height={34} seed={2} className="mt-3" />
            </>
          ) : (
            <>
              <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 12 }}>Última evaluación</div>
              <div style={{ ...fontDisplay, color: "#fff", fontSize: 16, fontWeight: 600 }} className="mt-1">
                Aún no has completado ninguna evaluación

              <KineticTrace color="#2A3540" height={28} seed={2} className="mt-3" />
            </>
          )}
          <div className="flex items-center justify-between mt-3">
            <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 12 }}>
              {lastAssessment ? "Repite la prueba cuando quieras" : "Elige una prueba para empezar"}
            </div>
            <button
              onClick={startEvaluation}
              className="flex items-center gap-1.5 rounded-full px-3.5 py-2"
              style={{ background: C.teal }}
            >
              <span style={{ ...fontBody, color: "#fff", fontSize: 13, fontWeight: 600 }}>Nueva evaluación</span>
              <ChevronRight size={15} color="#fff" />
            </button>
          </div>
        </div>

        {/* Tarjetas por dominio — estado real, sin scores inventados */}
        <div>
          <h2 style={{ ...fontDisplay, color: C.text, fontSize: 15, fontWeight: 600 }} className="mb-2.5">Dominios</h2>
          <div className="grid grid-cols-2 gap-3">
            {DOMAINS.map((d) => {
              const Icon = d.icon;
              const testsInDomain = TEST_DEFINITIONS.filter((t) => t.domain === d.id);
              const availableTestIds = testsInDomain.filter((t) => t.status === "available").map((t) => t.id);
              const domainAssessments = assessmentHistory.filter((a) => availableTestIds.includes(a.testId));
              const hasData = domainAssessments.length > 0;
              const isComingSoon = testsInDomain.length > 0 && availableTestIds.length === 0;

              return (
                <button
                  key={d.id}
                  onClick={() => setView("resultados")}
                  className="rounded-xl p-4 text-left"
                  style={{ background: C.surface, border: `1px solid ${C.line}`, opacity: hasData ? 1 : 0.6 }}

                  <div style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }} className="mt-2.5">{d.label}</div>

function SimpleCameraCapture({ test, onDone }) {
  // Captura única genérica — arquitectura previa, se conserva sin cambios

  // usa ahora AssessmentFlow + CameraAssessment (ver más abajo), que es

  const [state, setState] = useState("idle"); // idle | preparing | capturing | processing | completed | error
  const [result, setResult] = useState(null);

  const start = () => {
    setState("preparing");
    setTimeout(() => setState("capturing"), 900);
    setTimeout(() => setState("processing"), 2200);
    setTimeout(() => {
      // Placeholder — aquí se conectará el resultado real de computer vision.
      setResult({ label: "Registro completado", value: "—", unit: "" });

    setResult(null);

    <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      {/* Preview de cámara */}

          }}
        />

        {state !== "idle" && state !== "error" && (
          <>
            {[[50, 22], [38, 40], [62, 40], [50, 55], [42, 78], [58, 78]].map(([x, y], i) => (

                key={i}
                className="absolute rounded-full"
                style={{

                  background: C.teal, transform: "translate(-50%,-50%)",
                  boxShadow: `0 0 0 4px ${C.teal}33`,

        )}

        <div className="relative z-10 flex flex-col items-center gap-2">
          {state === "idle" && (
            <>
              <Camera size={30} color="#5B6670" />
              <span style={{ ...fontBody, color: "#8B959D", fontSize: 12 }}>Vista previa de cámara</span>

              <Check size={16} /> Captura completada

          {state === "error" && (
            <span style={{ ...fontMono, color: C.coral, fontSize: 13 }} className="flex items-center gap-2">
              <AlertCircle size={16} /> Error de captura — reintenta
            </span>
          )}
        </div>

        {/* Estado de captura, esquina */}
        <div className="absolute top-3 left-3">
          <span style={{ ...fontMono, color: "#8B959D", fontSize: 10 }} className="uppercase tracking-wide">
            {state}
          </span>
        </div>
      </div>

      {/* Info + controles */}
      <div className="p-4 space-y-3">
        <div>
          <div style={{ ...fontDisplay, color: C.text, fontSize: 16, fontWeight: 600 }}>{test.name}</div>
          <div style={{ ...fontBody, color: C.inkSoft, fontSize: 13 }} className="mt-1">{test.objective}</div>
        </div>
        <div className="rounded-lg p-3" style={{ background: C.paper }}>
          <div style={{ ...fontBody, color: C.inkFaint, fontSize: 11 }} className="uppercase tracking-wide mb-1">Instrucciones</div>
          <div style={{ ...fontBody, color: C.text, fontSize: 13 }}>{test.instructions}</div>
          <div style={{ ...fontBody, color: C.inkFaint, fontSize: 11 }} className="uppercase tracking-wide mt-2.5 mb-1">Preparación</div>
          <div style={{ ...fontBody, color: C.text, fontSize: 13 }}>{test.preparation}</div>
        </div>

        {state === "completed" && result && (
          <div className="rounded-lg p-3 flex items-center justify-between" style={{ background: C.tealSoft }}>
            <span style={{ ...fontBody, color: C.tealDeep, fontSize: 13 }}>{result.label}</span>
            <div className="flex items-center gap-1.5">
              <DataValue value={result.value} unit={result.unit} size={16} color={C.tealDeep} />
              <DemoTag />
            </div>
          </div>
        )}

        <div className="flex gap-2 pt-1">
          {state === "idle" && (
            <button onClick={start} className="flex-1 flex items-center justify-center gap-2 rounded-xl py-3" style={{ background: C.teal }}>
              <Play size={16} color="#fff" fill="#fff" />
              <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Comenzar</span>
            </button>
          )}
          {(state === "preparing" || state === "capturing" || state === "processing") && (
            <button disabled className="flex-1 flex items-center justify-center gap-2 rounded-xl py-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
              <span style={{ ...fontBody, color: C.inkFaint, fontSize: 14, fontWeight: 600 }}>Registrando…</span>
            </button>
          )}
          {state === "completed" && (
            <>
              <button onClick={repeat} className="flex items-center justify-center gap-2 rounded-xl py-3 px-4" style={{ border: `1px solid ${C.line}` }}>
                <RotateCcw size={15} color={C.inkSoft} />
                <span style={{ ...fontBody, color: C.inkSoft, fontSize: 14, fontWeight: 600 }}>Repetir</span>
              </button>
              <button onClick={() => onDone(result)} className="flex-1 flex items-center justify-center gap-2 rounded-xl py-3" style={{ background: C.ink }}>
                <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Continuar</span>
                <ChevronRight size={16} color="#fff" />
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

   ============================================================
   Assessment → Test → Capture → Measurement → Reference

   UI (CaptureGuide, CameraAssessment, AssessmentFlow, PosturaResultados)
     ↓
   Capture Quality (simulateCaptureQuality)
     ↓
   Computer Vision Service (analyzeTest → analyzePosture, …) — SIMULADO
     ↓

     ↓

     ↓

/* ============================================================
   SCIENTIFIC MEASUREMENT ENGINE — infraestructura, sin integrar
   ============================================================
   Prepara el paso DEMO → RESEARCH → PARTIALLY_VALIDATED → VALIDATED
   sin tocar los 8 analyzeXxx existentes ni sus pantallas de resultados.
   Nada de esto se llama todavía desde el flujo real de evaluación —
   son los "adaptadores" que pide el ticket, listos para cuando haga
   falta enchufarlos.

   CAMERA → POSE ESTIMATION → LANDMARKS → BIOMECHANICAL ANALYSIS →
   RAW MEASUREMENT → CAPTURE QUALITY → UNCERTAINTY →
   SCIENTIFIC MEASUREMENT → VALIDATION PROFILE → USER
   ============================================================ */

/**
 * ScientificMeasurement — superconjunto de Measurement, con
 * incertidumbre y estado de validación explícitos.
 * @typedef {Object} ScientificMeasurement
 * @property {string} id
 * @property {string} assessmentId
 * @property {string} testId
 * @property {string} variable
 * @property {number} value
 * @property {string} unit
 * @property {"left"|"right"|"bilateral"} [side]
 * @property {string} timestamp
 * @property {"camera"|"manual"|"health_data"} source
 * @property {string} method
 * @property {number} [measurementError]       — incertidumbre del MÉTODO, nunca inventada
 * @property {string} [measurementErrorUnit]
 * @property {number} [confidence]              — confianza de ESTA captura, distinta de measurementError
 * @property {number} [captureQuality]
 * @property {"DEMO"|"RESEARCH"|"PARTIALLY_VALIDATED"|"VALIDATED"} validationStatus
 * @property {"LOW"|"MODERATE"|"HIGH"} [evidenceLevel]
 * @property {string[]} [referenceIds]
 * @property {string} [notes]
 *
 * CaptureQuality (versión rica, distinta de la CaptureQuality simple
 * por test que ya usan simulateCaptureQuality/simulateSTSCaptureQuality/
 * simulateBalanceCaptureQuality/etc. — esas se mantienen tal cual).
 * @typedef {Object} CaptureQuality
 * @property {number} overall
 * @property {boolean} bodyDetected
 * @property {boolean} bodyFullyVisible
 * @property {boolean} cameraStable
 * @property {number} [lightingScore]
 * @property {number} [framingScore]
 * @property {number} [landmarkVisibility]
 * @property {number} [perspectiveQuality]
 * @property {number} [confidence]
 * @property {string[]} warnings
 *
 * ScientificReference — evidencia EXTERNA (estudios), nunca la
 * validación propia de Kinesis.
 * @typedef {Object} ScientificReference
 * @property {string} id
 * @property {string} citation
 * @property {string} title
 * @property {string} [authors]
 * @property {number} year
 * @property {string} [doi]
 * @property {string} [url]
 * @property {string} [test]
 * @property {string} [variable]
 * @property {string} [population]
 * @property {string} [device]
 * @property {string} [method]
 * @property {number} [ICC]
 * @property {number} [SEM]
 * @property {number} [MDC]
 * @property {{lower:number, upper:number}} [LOA]
 * @property {number} [MAE]
 * @property {number} [RMSE]
 * @property {string} [notes]
 *
 * ReliabilityMetadata — igual que ScientificReference en cuanto a
 * procedencia: SIEMPRE evidencia de estudios externos. Se guarda como
 * `referenceEvidence`, nunca como `measurementError` de Kinesis.
 * @typedef {Object} ReliabilityMetadata
 * @property {number} [ICC]
 * @property {string} [ICCType]
 * @property {number} [SEM]
 * @property {string} [SEMUnit]
 * @property {number} [MDC]
 * @property {string} [MDCUnit]
 * @property {number} [LOA_Lower]
 * @property {number} [LOA_Upper]
 * @property {number} [MAE]
 * @property {number} [RMSE]
 * @property {string} [source]
 *
 * ValidationProfile — estado de validación por variable, separado de
 * la evidencia externa que lo sustenta.
 * @typedef {Object} ValidationProfile
 * @property {string} variable
 * @property {string} validationStatus
 * @property {string} [referenceMethod]
 * @property {number} [sampleSize]
 * @property {string} [population]
 * @property {number} [ICC]
 * @property {number} [SEM]
 * @property {number} [MDC]
 * @property {{lower:number, upper:number}} [LOA]
 * @property {number} [MAE]
 * @property {number} [RMSE]
 * @property {string} [validationDate]
 * @property {string} [notes]
 */

// Estados de validación centralizados. Ninguna variable usa VALIDATED
// todavía — sería falso: Kinesis no se ha validado frente a ningún
// método de referencia.
const VALIDATION_STATUS = {
  DEMO: "DEMO",
  RESEARCH: "RESEARCH",
  PARTIALLY_VALIDATED: "PARTIALLY_VALIDATED",
  VALIDATED: "VALIDATED",
};

// Fuerza de la evidencia científica disponible — independiente de
// confidence (confianza de una captura) y de validationStatus (estado
// de validación de Kinesis).
const EVIDENCE_LEVEL = {
  LOW: "LOW",
  MODERATE: "MODERATE",
  HIGH: "HIGH",
};

// Representación visual de cada estado científico — deliberadamente
// distinta entre sí, no solo un cambio de matiz. DEMO/RESEARCH/
// PARTIALLY_VALIDATED se muestran como insignia "outline" (color +
// fondo suave del mismo color); VALIDATED usa RELLENO SÓLIDO — un
// tratamiento visual distinto a propósito, para que nunca pueda
// confundirse con "medición experimental" aunque comparta la familia
// de verdes. Ninguna medición usa VALIDATED todavía (ver
// VALIDATION_PROFILES) — esto es la representación preparada, no una
// afirmación de que algo esté validado.
const VALIDATION_STATUS_STYLE = {
  DEMO: { color: C.amber, background: C.amberSoft, solid: false },
  RESEARCH: { color: C.teal, background: C.tealSoft, solid: false },
  PARTIALLY_VALIDATED: { color: C.partial, background: C.partialSoft, solid: false },
  VALIDATED: { color: "#04150D", background: C.teal, solid: true },
};

function getValidationStatusStyle(status) {
  return VALIDATION_STATUS_STYLE[status] || VALIDATION_STATUS_STYLE.DEMO;
}

// Variables científicas prioritarias por prueba — nomenclatura
// canónica de cara a la futura capa de evidencia. Deliberadamente NO
// coincide 1:1 con las claves DEMO internas que ya usan los 8
// analyzeXxx (p.ej. aquí "peak_knee_flexion", en analyzeSquat
// "kneeFlexion") — son registros distintos a propósito, para no tocar
// las pruebas existentes mientras se prepara esta capa.
const PRIORITY_VARIABLES = {
  marcha: ["gait_speed", "cadence", "step_time", "step_length", "stride_length"],
  sit_to_stand: ["sit_to_stand_test_time", "sit_to_stand_mean_cycle_time", "sit_to_stand_cycle_variability"],
  sentadilla: ["peak_knee_flexion", "knee_rom", "peak_hip_flexion", "repetition_consistency"],
  equilibrio_unipodal: ["single_leg_time", "balance_losses"],
  elevacion_brazos: ["left_shoulder_elevation", "right_shoulder_elevation", "shoulder_asymmetry"],
  dorsiflexion: ["knee_to_wall_distance", "heel_contact", "dorsiflexion_asymmetry"],
  rotacion_tronco: ["thorax_rotation", "pelvis_rotation", "thorax_pelvis_separation"],
  postura_estatica: ["postural_sway_ap", "postural_sway_ml"],
};

// Variables experimentales: se preparan pero nunca se presentan como
// resultado clínico.
const EXPERIMENTAL_VARIABLES = [
  "center_of_mass_sway",
  "stability_score",
  "lumbar_compensation",
  "trunk_sway",
  "hip_sway",
];

// Sin referencias inventadas — infraestructura vacía, lista para
// incorporar citas reales una a una.
const SCIENTIFIC_REFERENCES = [];

// Perfil de validación por variable. Todas las variables registradas
// (prioritarias + experimentales) parten en DEMO — es la verdad actual,
// no un valor inventado. Ninguna tiene ICC/SEM/MDC todavía porque no
// existe evidencia real cargada (ver SCIENTIFIC_REFERENCES).
const VALIDATION_PROFILES = Object.fromEntries(
  [...Object.values(PRIORITY_VARIABLES).flat(), ...EXPERIMENTAL_VARIABLES].map((variable) => [
    variable,
    { variable, validationStatus: VALIDATION_STATUS.DEMO },
  ])
);

// Auditoría: punto único para que la UI sepa cómo comportarse ante una
// variable, sin tener que conocer el registro interno.
function getMeasurementScientificStatus(variable) {
  const profile = VALIDATION_PROFILES[variable] || null;
  const references = SCIENTIFIC_REFERENCES.filter((r) => r.variable === variable);
  const validationStatus = profile?.validationStatus || VALIDATION_STATUS.DEMO;
  return {
    validationStatus,
    evidenceLevel: profile?.evidenceLevel || null,
    hasExternalEvidence: references.length > 0,
    hasKinesisValidation: validationStatus === VALIDATION_STATUS.VALIDATED,
    measurementErrorAvailable: profile?.SEM != null || profile?.MAE != null || profile?.RMSE != null,
  };
}

// Adaptador — convierte un Measurement (el que ya producen los 8
// analyzeXxx vía buildMeasurements) en ScientificMeasurement. NO se
// llama todavía desde ningún flujo real; es el puente preparado para
// cuando haga falta enriquecer resultados con incertidumbre/validación
// sin tocar analyzeSitToStand/analyzeSingleLegBalance/
// analyzeArmElevation/analyzeTrunkRotation/analyzeDorsiflexion/
// analyzeGait ni los demás.
function toScientificMeasurement(measurement, { method, captureQuality } = {}) {
  const status = getMeasurementScientificStatus(measurement.variable);
  return {
    id: measurement.id,
    assessmentId: measurement.assessmentId,
    testId: measurement.testId,
    variable: measurement.variable,
    value: measurement.value,
    unit: measurement.unit,
    side: measurement.side ?? undefined,
    timestamp: measurement.timestamp,
    source: measurement.source,
    method: method || "demo_simulation",
    measurementError: null, // sin evidencia validada — nunca se inventa
    measurementErrorUnit: null,
    confidence: measurement.measurementQuality ?? undefined,
    captureQuality: captureQuality?.overall ?? undefined,
    validationStatus: measurement.isDemo ? VALIDATION_STATUS.DEMO : status.validationStatus,
    evidenceLevel: status.evidenceLevel || undefined,
    referenceIds: SCIENTIFIC_REFERENCES.filter((r) => r.variable === measurement.variable).map((r) => r.id),
    notes: undefined,
  };
}

function toScientificMeasurements(measurements, options) {
  return measurements.map((m) => toScientificMeasurement(m, options));
}

// Constructor DEMO de CaptureQuality (versión rica). No implementa
// algoritmos reales — mismo espíritu que simulateCaptureQuality() pero
// con la forma completa que pide este ticket.
function buildDemoCaptureQuality(overrides = {}) {
  return {
    overall: +(0.85 + Math.random() * 0.1).toFixed(2),
    bodyDetected: true,
    bodyFullyVisible: true,
    cameraStable: true,
    lightingScore: +(0.8 + Math.random() * 0.15).toFixed(2),
    framingScore: +(0.8 + Math.random() * 0.15).toFixed(2),
    confidence: +(0.85 + Math.random() * 0.1).toFixed(2),
    warnings: [],
    simulated: true,
    ...overrides,
  };
}

/* ============================================================
   CAPTURA REAL — SIT-TO-STAND (5 repeticiones, cámara/pose real)
   ============================================================
   CAMERA → POSE ESTIMATION (MediaPipe Pose, cargado vía <script> en
   tiempo de ejecución) → LANDMARKS → detectBody / máquina de estados
   SEATED→RISING→STANDING→SITTING→SEATED (una vez por repetición) →
   cronómetro real (performance.now()) →
   createSitToStandScientificMeasurements → ScientificMeasurement[].

   Nada aquí usa Math.random(): toda incertidumbre (confidence,
   captureQuality) procede de landmarks reales devueltos por el
   modelo. Si el modelo o la cámara no están disponibles, el
   orquestador (RealSitToStandFlow, más abajo junto a los demás
   componentes) cae automáticamente al modo DEMO existente — el mismo
   AssessmentFlow + SitToStandResultados de siempre, sin tocarlos. */

// Índices de landmarks de MediaPipe Pose (33 puntos) que necesitamos.
const POSE_LANDMARK_INDEX = {
  leftShoulder: 11, rightShoulder: 12,
  leftHip: 23, rightHip: 24,
  leftKnee: 25, rightKnee: 26,
  leftAnkle: 27, rightAnkle: 28,
};

// Thresholds centralizados y fácilmente modificables — nada de
// "clínicamente preciso" todavía, son heurísticas de encuadre/movimiento.
const SIT_TO_STAND_THRESHOLDS = {
  minLandmarkVisibility: 0.5,   // visibility mínima (0–1) por landmark clave
  minDetectionConfidence: 0.5,  // confianza media mínima para considerar "detectado"
  stabilityFrames: 8,           // ~0.25s a 30fps, para no parar por un frame aislado
  hipRiseRatio: 0.12,           // fracción de la altura de imagen que la cadera debe ascender para RISING
  hipDescendRatio: 0.10,        // fracción que debe descender desde el pico de pie para iniciar SITTING
  stabilityEpsilon: 0.004,      // variación máx. de hip.y entre frames para considerar "estable" (STANDING/SEATED)
  trunkVerticalMaxDeviationDeg: 30, // desviación máx. respecto a vertical para considerar tronco erguido
  // — framing (encuadre), a partir de la caja delimitadora de los landmarks clave —
  framingEdgeMargin: 0.08,      // margen objetivo (fracción del frame) hasta el borde para puntuación 1.0
  framingMinBboxHeight: 0.25,   // por debajo de esto, la persona ocupa muy poco (demasiado lejos)
  framingMaxBboxHeight: 0.95,   // por encima de esto, la persona satura el encuadre (demasiado cerca)
  // — lateralidad de la vista, a partir de la separación x hombro-hombro —
  maxLateralShoulderSeparation: 0.18,
  // — estabilidad de cámara, a partir del jitter del punto medio de hombros en fases previas al movimiento —
  minJitterSamples: 5,
  jitterReferenceMagnitude: 0.02,
  // — pérdida de frames —
  lostFrameWarningRatio: 0.15,  // por encima de esto se añade la advertencia "Movimiento perdido"
  framingWarningThreshold: 0.5, // por debajo de esto se añade "Acércate o aléjate de la cámara"
  // — validez de repetición (5 repeticiones) —
  maxCriticalLostFrames: 10,    // frames consecutivos sin cuerpo válido durante RISING/SITTING → repetición inválida
  maxPhaseDurationMs: 6000,     // si RISING o SITTING se alarga más de esto sin completar → repetición inválida
  repsRequired: 5,              // repeticiones válidas necesarias para terminar la prueba
};

// Carga de MediaPipe Pose (API clásica, no la de tasks-vision) mediante
// un <script> inyectado en el DOM — API del navegador (document.
// createElement), no una sentencia import. El entorno de artifacts
// intercepta y resuelve ESTÁTICAMENTE cualquier import()/import
// dinámico contra su propia lista de librerías permitidas, incluso con
// URL absoluta — nunca llega a intentar la red, así que import() a un
// CDN externo falla siempre aquí con "Module not found" (confirmado en
// pruebas reales). Un <script src="..."> normal no pasa por esa
// resolución de módulos, así que sí llega a intentar la petición de
// red real. Si el sandbox además bloquea eso (CSP script-src, sin
// conexión), la promesa se rechaza igualmente y RealSitToStandFlow cae
// a DEMO — nunca rompe la app.
const MEDIAPIPE_POSE_BASE = "https://cdn.jsdelivr.net/npm/@mediapipe/pose";

function loadScriptOnce(src) {
  return new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[data-kinesis-src="${src}"]`);
    if (existing) {
      if (existing.dataset.loaded === "true") resolve();
      else existing.addEventListener("load", () => resolve(), { once: true });
      existing.addEventListener("error", () => reject(new Error(`No se pudo cargar ${src}`)), { once: true });
      return;
    }
    const script = document.createElement("script");
    script.src = src;
    script.async = true;
    script.crossOrigin = "anonymous";
    script.dataset.kinesisSrc = src;
    script.onload = () => { script.dataset.loaded = "true"; resolve(); };
    script.onerror = () => reject(new Error(`No se pudo cargar ${src}`));
    document.head.appendChild(script);
  });
}

let cachedPoseInstancePromise = null;
function loadPoseModel() {
  if (cachedPoseInstancePromise) return cachedPoseInstancePromise;
  cachedPoseInstancePromise = (async () => {
    await loadScriptOnce(`${MEDIAPIPE_POSE_BASE}/pose.js`);
    if (typeof window.Pose !== "function") {
      throw new Error("El script se cargó pero no expuso window.Pose");
    }
    const pose = new window.Pose({
      locateFile: (file) => `${MEDIAPIPE_POSE_BASE}/${file}`,
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: SIT_TO_STAND_THRESHOLDS.minDetectionConfidence,
      minTrackingConfidence: SIT_TO_STAND_THRESHOLDS.minDetectionConfidence,
    });
    return pose;
  })();
  return cachedPoseInstancePromise;
}

// Punto medio de cadera (y normalizado, 0–1, crece hacia abajo) — base
// de toda la lógica SEATED/RISING/STANDING.
function hipY(landmarks) {
  const l = landmarks[POSE_LANDMARK_INDEX.leftHip], r = landmarks[POSE_LANDMARK_INDEX.rightHip];
  if (!l || !r) return null;
  return (l.y + r.y) / 2;
}

// Punto medio de tobillos — base del despegue/aterrizaje del CMJ (el
// "suelo" de referencia es la posición de tobillo en bipedestación quieta).
function ankleY(landmarks) {
  const l = landmarks[POSE_LANDMARK_INDEX.leftAnkle], r = landmarks[POSE_LANDMARK_INDEX.rightAnkle];
  if (!l || !r) return null;
  return (l.y + r.y) / 2;
}

function shoulderMid(landmarks) {
  const { leftShoulder, rightShoulder } = POSE_LANDMARK_INDEX;
  const ls = landmarks[leftShoulder], rs = landmarks[rightShoulder];
  if (!ls || !rs) return null;
  return { x: (ls.x + rs.x) / 2, y: (ls.y + rs.y) / 2 };
}

// Ángulo del tronco respecto a la vertical (0° = perfectamente erguido).
// Orientación APROXIMADA — no un ángulo clínico.
function trunkAngleDeg(landmarks) {
  const { leftHip, rightHip } = POSE_LANDMARK_INDEX;
  const lh = landmarks[leftHip], rh = landmarks[rightHip];
  const sm = shoulderMid(landmarks);
  if (!sm || !lh || !rh) return null;
  const hipMid = { x: (lh.x + rh.x) / 2, y: (lh.y + rh.y) / 2 };
  const dx = sm.x - hipMid.x;
  const dy = sm.y - hipMid.y;
  return Math.abs(Math.atan2(dx, -dy) * (180 / Math.PI));
}

// framingQuality: a partir de la caja delimitadora real de los landmarks
// clave — margen hasta los bordes (¿está centrado?) y tamaño relativo
// (¿ni demasiado lejos ni demasiado cerca?). Puramente geométrico, sin
// Math.random(). null si no hay landmarks.
function computeFramingQuality(landmarks) {
  const keys = Object.values(POSE_LANDMARK_INDEX);
  const pts = keys.map((i) => landmarks[i]).filter(Boolean);
  if (pts.length < keys.length) return null;
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const margin = Math.min(minX, 1 - maxX, minY, 1 - maxY);
  const marginScore = Math.max(0, Math.min(1, margin / SIT_TO_STAND_THRESHOLDS.framingEdgeMargin));
  const bboxHeight = maxY - minY;
  const { framingMinBboxHeight: minH, framingMaxBboxHeight: maxH } = SIT_TO_STAND_THRESHOLDS;
  let sizeScore;
  if (bboxHeight < minH) sizeScore = bboxHeight / minH;
  else if (bboxHeight > maxH) sizeScore = Math.max(0, 1 - (bboxHeight - maxH) / (1 - maxH));
  else sizeScore = 1;
  return +Math.max(0, Math.min(1, Math.min(marginScore, sizeScore))).toFixed(2);
}

// cameraStability: jitter frame a frame del punto medio de hombros,
// muestreado SOLO en fases en las que la persona debería estar quieta
// (buscando/detectada/lista para empezar) — durante la propia
// repetición el movimiento del usuario domina la señal y no serviría
// como medida de estabilidad de la cámara. null si no hay muestras
// suficientes.
function computeCameraStability(jitterSamples) {
  if (!jitterSamples || jitterSamples.length < SIT_TO_STAND_THRESHOLDS.minJitterSamples) return null;
  const avg = jitterSamples.reduce((a, b) => a + b, 0) / jitterSamples.length;
  return +Math.max(0, Math.min(1, 1 - avg / SIT_TO_STAND_THRESHOLDS.jitterReferenceMagnitude)).toFixed(2);
}

// detectBody(): separa modelConfidence (visibility media real) de
// landmarkVisibilityRatio (fracción de landmarks clave por encima del
// umbral) — dos cosas distintas que antes se mezclaban en un único
// "confidence". Nunca Math.random(); advertencias generadas solo
// cuando la condición real se cumple.
function detectBody(landmarks) {
  if (!landmarks || landmarks.length === 0) {
    return {
      detected: false, landmarksVisible: false, bodyFullyVisible: false,
      modelConfidence: null, landmarkVisibilityRatio: null,
      warnings: ["Persona no detectada"],
    };
  }
  const warnings = [];
  const keys = Object.values(POSE_LANDMARK_INDEX);
  const visibilities = keys.map((i) => landmarks[i]?.visibility ?? 0);
  const modelConfidence = +(visibilities.reduce((a, b) => a + b, 0) / visibilities.length).toFixed(2);
  const visibleCount = visibilities.filter((v) => v >= SIT_TO_STAND_THRESHOLDS.minLandmarkVisibility).length;
  const landmarkVisibilityRatio = +(visibleCount / keys.length).toFixed(2);
  const landmarksVisible = visibleCount === keys.length;
  const withinFrame = keys.every((i) => {
    const p = landmarks[i];
    return p && p.x > 0.02 && p.x < 0.98 && p.y > 0.02 && p.y < 0.98;
  });
  const bodyFullyVisible = landmarksVisible && withinFrame;
  const detected = modelConfidence >= SIT_TO_STAND_THRESHOLDS.minDetectionConfidence;

  if (!detected) warnings.push("Persona no detectada");
  else if (!bodyFullyVisible) warnings.push("Cuerpo parcialmente fuera del encuadre");

  const sm2 = landmarks[POSE_LANDMARK_INDEX.leftShoulder], sm3 = landmarks[POSE_LANDMARK_INDEX.rightShoulder];
  if (sm2 && sm3) {
    const shoulderSeparation = Math.abs(sm2.x - sm3.x);
    if (shoulderSeparation > SIT_TO_STAND_THRESHOLDS.maxLateralShoulderSeparation) {
      warnings.push("Busca una posición lateral");
    }
  }

  return { detected, landmarksVisible, bodyFullyVisible, modelConfidence, landmarkVisibilityRatio, warnings };
}

// SEATED → RISING: la cadera ha ascendido lo suficiente respecto al
// baseline fijado al pulsar "Iniciar".
function detectSitToStandStart(history, thresholds = SIT_TO_STAND_THRESHOLDS) {
  if (!history || history.length < 2) return false;
  const baseline = history[0].hipY;
  const current = history[history.length - 1].hipY;
  if (baseline == null || current == null) return false;
  return baseline - current > thresholds.hipRiseRatio;
}

// RISING → STANDING: cadera estable (sin oscilar) durante N frames Y
// tronco aproximadamente vertical — evita parar por un frame aislado.
function detectStandingPosition(history, thresholds = SIT_TO_STAND_THRESHOLDS) {
  if (!history || history.length < thresholds.stabilityFrames) return false;
  const recent = history.slice(-thresholds.stabilityFrames);
  const ys = recent.map((h) => h.hipY).filter((v) => v != null);
  if (ys.length < thresholds.stabilityFrames) return false;
  const maxDelta = Math.max(...ys) - Math.min(...ys);
  const lastTrunk = recent[recent.length - 1].trunkAngle;
  const trunkOk = lastTrunk != null && lastTrunk <= thresholds.trunkVerticalMaxDeviationDeg;
  return maxDelta <= thresholds.stabilityEpsilon && trunkOk;
}

// STANDING → SITTING: la cadera ha descendido lo suficiente desde el
// pico alcanzado de pie (referencia capturada al confirmar STANDING).
function detectSittingStart(history, standingHipY, thresholds = SIT_TO_STAND_THRESHOLDS) {
  if (!history || history.length < 1 || standingHipY == null) return false;
  const current = history[history.length - 1].hipY;
  if (current == null) return false;
  return current - standingHipY > thresholds.hipDescendRatio;
}

// SITTING → SEATED: cadera estable de nuevo (sin exigir tronco vertical
// — al sentarse el tronco puede relajarse, a diferencia de STANDING).
function detectSeatedReturn(history, thresholds = SIT_TO_STAND_THRESHOLDS) {
  if (!history || history.length < thresholds.stabilityFrames) return false;
  const recent = history.slice(-thresholds.stabilityFrames);
  const ys = recent.map((h) => h.hipY).filter((v) => v != null);
  if (ys.length < thresholds.stabilityFrames) return false;
  const maxDelta = Math.max(...ys) - Math.min(...ys);
  return maxDelta <= thresholds.stabilityEpsilon;
}

// Cronómetro real — performance.now(), nunca Math.random(), nunca simulado.
function calculateSitToStandDuration(startTime, endTime) {
  return +((endTime - startTime) / 1000).toFixed(2);
}

// mean / standardDeviation / coefficientOfVariation del cycleTime (solo
// movimiento, RISING→...→SEATED) de las repeticiones VÁLIDAS.
// Descriptivo — sin "bueno/malo".
function calculateSitToStandConsistency(reps) {
  const durations = (reps || []).map((r) => r.cycleTime).filter((v) => v != null);
  const n = durations.length;
  if (n === 0) return { mean: null, standardDeviation: null, coefficientOfVariation: null };
  const mean = +(durations.reduce((a, b) => a + b, 0) / n).toFixed(2);
  const variance = durations.reduce((s, v) => s + (v - mean) ** 2, 0) / n;
  const standardDeviation = +Math.sqrt(variance).toFixed(3);
  const coefficientOfVariation = mean !== 0 ? +((standardDeviation / mean) * 100).toFixed(1) : null;
  return { mean, standardDeviation, coefficientOfVariation };
}

/* ============================================================
   CMJ — Countermovement Jump (salto con contramovimiento)
   ============================================================
   Método de tiempo de vuelo: jumpHeight = g·t²/8. Es el mismo principio
   que usan apps de referencia como My Jump (validadas frente a
   plataforma de fuerza, Balsalobre-Fernández et al. 2015) — NO requiere
   calibración de distancia/escala, solo tiempo, que es justo lo que
   performance.now() da con precisión real.
   Fases por salto: STANDING (bipedestación quieta, referencia de
   "suelo") → DESCENDING (contramovimiento) → AIRBORNE (tobillos
   despegan del suelo) → LANDED (tobillos vuelven y se estabilizan). */

const CMJ_THRESHOLDS = {
  stabilityFrames: 8,            // reutiliza el mismo criterio de "quieto" que STS
  stabilityEpsilon: 0.004,
  descentRiseRatio: 0.025,       // cuánto debe descender la cadera (fracción de imagen) para considerar iniciado el contramovimiento — bajado tras prueba real (el 0.05 original casi nunca disparaba)
  takeoffAnkleRiseRatio: 0.02,   // cuánto deben "subir" los tobillos (y decrece) respecto al suelo para considerar despegue — mismo motivo
  maxPhaseDurationMs: 4000,      // si DESCENDING o AIRBORNE se alargan más de esto sin completar → salto inválido
  maxCriticalLostFrames: 6,      // frames consecutivos sin cuerpo válido durante DESCENDING/AIRBORNE → salto inválido
  jumpsRequired: 3,
  maxStandingWaitMs: 15000,      // si no se detecta contramovimiento en este tiempo, avisar en vez de esperar en silencio para siempre
};

// STANDING → DESCENDING: la cadera desciende (y aumenta) desde el
// baseline de bipedestación quieta.
function detectCmjDescentStart(history, standingHipY, thresholds = CMJ_THRESHOLDS) {
  if (!history?.length || standingHipY == null) return false;
  const current = history[history.length - 1].hipY;
  if (current == null) return false;
  return current - standingHipY > thresholds.descentRiseRatio;
}

// DESCENDING → AIRBORNE: los tobillos suben (y decrece) respecto al
// suelo de referencia — señal de que los pies han dejado el suelo.
function detectCmjTakeoff(history, standingAnkleY, thresholds = CMJ_THRESHOLDS) {
  if (!history?.length || standingAnkleY == null) return false;
  const current = history[history.length - 1].ankleY;
  if (current == null) return false;
  return standingAnkleY - current > thresholds.takeoffAnkleRiseRatio;
}

// AIRBORNE → LANDED: los tobillos vuelven cerca del suelo de referencia
// y se mantienen estables — mismo criterio de estabilidad que STS,
// aplicado a ankleY en vez de hipY.
function detectCmjLanding(history, standingAnkleY, thresholds = CMJ_THRESHOLDS) {
  if (!history || history.length < thresholds.stabilityFrames || standingAnkleY == null) return false;
  const recent = history.slice(-thresholds.stabilityFrames);
  const ys = recent.map((h) => h.ankleY).filter((v) => v != null);
  if (ys.length < thresholds.stabilityFrames) return false;
  const maxDelta = Math.max(...ys) - Math.min(...ys);
  const nearFloor = Math.abs(ys[ys.length - 1] - standingAnkleY) < CMJ_THRESHOLDS.descentRiseRatio;
  return maxDelta <= thresholds.stabilityEpsilon && nearFloor;
}

// jumpHeight (cm) a partir del tiempo de vuelo real — g=9.81 m/s².
// Único dato de entrada: tiempo. Sin calibración de distancia.
function calculateCmjJumpHeight(flightTimeSeconds) {
  if (flightTimeSeconds == null || flightTimeSeconds <= 0) return null;
  const heightMeters = (9.81 * flightTimeSeconds ** 2) / 8;
  return +(heightMeters * 100).toFixed(1);
}

// mean / standardDeviation / coefficientOfVariation de jumpHeight entre
// los saltos VÁLIDOS — mismo patrón que calculateSitToStandConsistency,
// aplicado a altura de salto en vez de cycleTime.
function calculateCmjConsistency(jumps) {
  const heights = (jumps || []).map((j) => j.jumpHeight).filter((v) => v != null);
  const n = heights.length;
  if (n === 0) return { mean: null, standardDeviation: null, coefficientOfVariation: null };
  const mean = +(heights.reduce((a, b) => a + b, 0) / n).toFixed(2);
  const variance = heights.reduce((s, v) => s + (v - mean) ** 2, 0) / n;
  const standardDeviation = +Math.sqrt(variance).toFixed(3);
  const coefficientOfVariation = mean !== 0 ? +((standardDeviation / mean) * 100).toFixed(1) : null;
  return { mean, standardDeviation, coefficientOfVariation };
}

/* ============================================================
   SALTO UNIPODAL — comparación de altura entre piernas
   ============================================================
   Reutiliza la máquina de detección del CMJ (detectCmjDescentStart/
   detectCmjTakeoff/detectCmjLanding, calculateCmjJumpHeight) sin
   duplicarla: la única diferencia real es que, en vez de promediar
   ambos tobillos, se seguía el tobillo de la pierna de apoyo. */

// Determina qué tobillo es el de apoyo (el más bajo = más cerca del
// suelo) en el instante en que se confirma la postura unipodal — NO
// depende de la etiqueta izquierda/derecha de MediaPipe, que no es
// fiable para esto en vista lateral (ambas piernas se solapan en la
// proyección 2D). Funciona igual sea cual sea la pierna elevada.
function detectStanceAnkleIndex(landmarks) {
  const l = landmarks[POSE_LANDMARK_INDEX.leftAnkle];
  const r = landmarks[POSE_LANDMARK_INDEX.rightAnkle];
  if (!l || !r) return null;
  return l.y > r.y ? POSE_LANDMARK_INDEX.leftAnkle : POSE_LANDMARK_INDEX.rightAnkle;
}

function stanceAnkleY(landmarks, ankleIndex) {
  if (ankleIndex == null) return null;
  const p = landmarks[ankleIndex];
  return p ? p.y : null;
}

// Índice de asimetría entre piernas — |dcha - izda| / max(dcha, izda) ×
// 100. 0% = simétrico; cuanto mayor, mayor el déficit del lado más
// débil respecto al más fuerte. Mismo concepto que un Limb Symmetry
// Index invertido (déficit en vez de simetría), habitual en literatura
// de retorno al deporte.
function calculateLimbAsymmetryIndex(heightRight, heightLeft) {
  if (heightRight == null || heightLeft == null) return null;
  const max = Math.max(heightRight, heightLeft);
  if (max === 0) return 0;
  return +((Math.abs(heightRight - heightLeft) / max) * 100).toFixed(1);
}

// overallCaptureQuality: media ponderada explícita de las variables
// disponibles (las que sean null quedan fuera del promedio, no se
// sustituyen por un valor inventado), penalizada por la proporción de
// frames perdidos durante la repetición.
function computeOverallCaptureQuality({ modelConfidence, framingQuality, landmarkVisibility, cameraStability, lostFrameRatio }) {
  const weights = { modelConfidence: 0.35, framingQuality: 0.25, landmarkVisibility: 0.25, cameraStability: 0.15 };
  const parts = [];
  if (modelConfidence != null) parts.push([modelConfidence, weights.modelConfidence]);
  if (framingQuality != null) parts.push([framingQuality, weights.framingQuality]);
  if (landmarkVisibility != null) parts.push([landmarkVisibility, weights.landmarkVisibility]);
  if (cameraStability != null) parts.push([cameraStability, weights.cameraStability]);
  if (parts.length === 0) return null;
  const totalWeight = parts.reduce((s, [, w]) => s + w, 0);
  const weighted = parts.reduce((s, [v, w]) => s + v * w, 0) / totalWeight;
  const penalty = 1 - Math.min(0.5, lostFrameRatio ?? 0); // hasta 50% de penalización por pérdida de frames
  return +Math.max(0, Math.min(1, weighted * penalty)).toFixed(2);
}

// Advertencias del CaptureQuality agregado — derivadas de los datos
// reales de la repetición, nunca aleatorias.
function collectAggregateWarnings({ samples, framingQuality, lostFrameRatio }) {
  const warnings = [];
  if (samples.some((s) => !s.detected)) warnings.push("Persona no detectada");
  if (samples.some((s) => s.detected && !s.bodyFullyVisible)) warnings.push("Cuerpo parcialmente fuera del encuadre");
  if (framingQuality != null && framingQuality < SIT_TO_STAND_THRESHOLDS.framingWarningThreshold) {
    warnings.push("Acércate o aléjate de la cámara");
  }
  if (samples.some((s) => s.warnings?.includes("Busca una posición lateral"))) warnings.push("Busca una posición lateral");
  if (lostFrameRatio != null && lostFrameRatio > SIT_TO_STAND_THRESHOLDS.lostFrameWarningRatio) warnings.push("Movimiento perdido");
  return [...new Set(warnings)];
}

// CaptureQuality — reemplaza a la antigua aggregateCaptureQuality().
// Recibe las muestras por frame (con framing ya calculado), los
// contadores de frames de la repetición y las muestras de jitter de
// cámara recogidas en fases previas al movimiento.
function buildCaptureQuality({ samples, frameCounters, cameraJitter }) {
  const totalFrames = frameCounters.total;
  const validFrames = frameCounters.valid;
  const lostFrames = frameCounters.lost;
  const lostFrameRatio = totalFrames > 0 ? +(lostFrames / totalFrames).toFixed(2) : null;

  const detectedSamples = samples.filter((s) => s.detected);
  const modelConfidence = detectedSamples.length
    ? +(detectedSamples.reduce((a, s) => a + s.modelConfidence, 0) / detectedSamples.length).toFixed(2)
    : null;
  const landmarkVisibility = detectedSamples.length
    ? +(detectedSamples.reduce((a, s) => a + s.landmarkVisibilityRatio, 0) / detectedSamples.length).toFixed(2)
    : null;
  const framingSamples = samples.map((s) => s.framing).filter((v) => v != null);
  const framingQuality = framingSamples.length
    ? +(framingSamples.reduce((a, b) => a + b, 0) / framingSamples.length).toFixed(2)
    : null;
  const cameraStability = computeCameraStability(cameraJitter);

  const overall = computeOverallCaptureQuality({ modelConfidence, framingQuality, landmarkVisibility, cameraStability, lostFrameRatio });
  const warnings = collectAggregateWarnings({ samples, framingQuality, lostFrameRatio });

  return {
    overall, modelConfidence, framingQuality, landmarkVisibility, cameraStability,
    totalFrames, validFrames, lostFrames, lostFrameRatio,
    warnings,
  };
}

// Agrega los CaptureQuality de las N repeticiones válidas en uno solo
// para el Assessment completo — reutiliza computeOverallCaptureQuality,
// no inventa una fórmula nueva.
function aggregateRepCaptureQualities(validReps) {
  const qualities = (validReps || []).map((r) => r.captureQuality).filter(Boolean);
  if (qualities.length === 0) {
    return { overall: null, modelConfidence: null, framingQuality: null, landmarkVisibility: null, cameraStability: null, totalFrames: 0, validFrames: 0, lostFrames: 0, lostFrameRatio: null, warnings: [] };
  }
  const totalFrames = qualities.reduce((s, q) => s + (q.totalFrames || 0), 0);
  const validFrames = qualities.reduce((s, q) => s + (q.validFrames || 0), 0);
  const lostFrames = qualities.reduce((s, q) => s + (q.lostFrames || 0), 0);
  const lostFrameRatio = totalFrames > 0 ? +(lostFrames / totalFrames).toFixed(2) : null;
  const avgOf = (key) => {
    const vals = qualities.map((q) => q[key]).filter((v) => v != null);
    return vals.length ? +(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2) : null;
  };
  const modelConfidence = avgOf("modelConfidence");
  const framingQuality = avgOf("framingQuality");
  const landmarkVisibility = avgOf("landmarkVisibility");
  const cameraStability = avgOf("cameraStability");
  const overall = computeOverallCaptureQuality({ modelConfidence, framingQuality, landmarkVisibility, cameraStability, lostFrameRatio });
  const warnings = [...new Set(qualities.flatMap((q) => q.warnings || []))];
  return { overall, modelConfidence, framingQuality, landmarkVisibility, cameraStability, totalFrames, validFrames, lostFrames, lostFrameRatio, warnings };
}

// Un único ScientificMeasurement — misma forma que antes, ahora
// parametrizada por variable/valor/unidad para poder construir las 3
// mediciones que pide este ticket sin repetir el objeto entero.
function buildSitToStandMeasurement({ assessmentId, testId, key, variable, value, unit, quality, side = "bilateral" }) {
  return {
    id: `${assessmentId}_${key}`,
    assessmentId,
    testId,
    variable,
    value,
    unit,
    side,
    timestamp: new Date().toISOString(),
    source: "camera",
    method: "markerless_pose_estimation",
    measurementError: null, // NO se asigna — sin protocolo de validación propio todavía
    measurementErrorUnit: unit === "s" ? "s" : null,
    confidence: quality.modelConfidence,
    captureQuality: quality.overall,
    qualityMetadata: quality,
    validationStatus: VALIDATION_STATUS.RESEARCH, // nunca VALIDATED
    evidenceLevel: EVIDENCE_LEVEL.HIGH,
    referenceIds: SCIENTIFIC_REFERENCES.filter((r) => r.variable === variable).map((r) => r.id),
    // — compatibilidad con el modelo Measurement genérico (Resultados/Perfil/Dashboard/Historial) —
    measurementQuality: quality.modelConfidence,
    isDemo: false,
  };
}

// Las 3 ScientificMeasurement de la prueba completa de 5 repeticiones.
// sit_to_stand_test_time = reloj de pared de la prueba entera (incluye
// el tiempo sentado entre repeticiones); sit_to_stand_mean_cycle_time /
// sit_to_stand_cycle_variability se calculan sobre cycleTime (solo
// movimiento, sin el tiempo sentado antes de cada RISING).
function createSitToStandScientificMeasurements({ assessmentId, testId, testTotalTime, consistency, aggQuality }) {
  return [
    buildSitToStandMeasurement({ assessmentId, testId, key: "sit_to_stand_test_time", variable: "sit_to_stand_test_time", value: testTotalTime, unit: "s", quality: aggQuality }),
    buildSitToStandMeasurement({ assessmentId, testId, key: "sit_to_stand_mean_cycle_time", variable: "sit_to_stand_mean_cycle_time", value: consistency.mean, unit: "s", quality: aggQuality }),
    buildSitToStandMeasurement({ assessmentId, testId, key: "sit_to_stand_cycle_variability", variable: "sit_to_stand_cycle_variability", value: consistency.coefficientOfVariation, unit: "%", quality: aggQuality }),
  ];
}

// Las 3 ScientificMeasurement del CMJ — reutiliza buildSitToStandMeasurement
// (genérico pese al nombre: solo construye un ScientificMeasurement a
// partir de assessmentId/testId/variable/value/unit/quality) para no
// duplicar esa lógica.
function createCmjScientificMeasurements({ assessmentId, testId, best, mean, consistency, aggQuality }) {
  return [
    buildSitToStandMeasurement({ assessmentId, testId, key: "cmj_jump_height_best", variable: "cmj_jump_height_best", value: best, unit: "cm", quality: aggQuality }),
    buildSitToStandMeasurement({ assessmentId, testId, key: "cmj_jump_height_mean", variable: "cmj_jump_height_mean", value: mean, unit: "cm", quality: aggQuality }),
    buildSitToStandMeasurement({ assessmentId, testId, key: "cmj_height_consistency", variable: "cmj_height_consistency", value: consistency.coefficientOfVariation, unit: "%", quality: aggQuality }),
  ];
}

// Respaldo DEMO si la cámara/el modelo de pose fallan (mismo criterio
// que Sit-to-Stand): 3 saltos simulados con tiempos de vuelo plausibles,
// pasados por la MISMA fórmula real (calculateCmjJumpHeight) — no se
// inventa la altura directamente, solo el tiempo de vuelo de entrada.
function analyzeDemoCmj() {
  const jitter = (base, spread) => +(base + (Math.random() - 0.5) * spread).toFixed(3);
  const jumps = Array.from({ length: CMJ_THRESHOLDS.jumpsRequired }, (_, i) => {
    const flightTime = jitter(0.5, 0.08); // ~0.46–0.54s — salto recreacional/entrenado
    return { jumpNumber: i + 1, flightTime, jumpHeight: calculateCmjJumpHeight(flightTime) };
  });
  const heights = jumps.map((j) => j.jumpHeight);
  const best = Math.max(...heights);
  const mean = +(heights.reduce((a, b) => a + b, 0) / heights.length).toFixed(1);
  const consistency = calculateCmjConsistency(jumps);
  return {
    cmjJumpHeightBest: { variable: "cmj_jump_height_best", value: best, unit: "cm", quality: null },
    cmjJumpHeightMean: { variable: "cmj_jump_height_mean", value: mean, unit: "cm", quality: null },
    cmjHeightConsistency: { variable: "cmj_height_consistency", value: consistency.coefficientOfVariation, unit: "%", quality: null },
  };
}

// Las 3 ScientificMeasurement del salto unipodal — reutiliza
// buildSitToStandMeasurement (genérico), ahora con `side` para
// distinguir la pierna derecha de la izquierda.
function createSingleLegJumpScientificMeasurements({ assessmentId, testId, heightRight, heightLeft, aggQuality }) {
  const asymmetry = calculateLimbAsymmetryIndex(heightRight, heightLeft);
  return [
    buildSitToStandMeasurement({ assessmentId, testId, key: "single_leg_jump_height_right", variable: "single_leg_jump_height_right", value: heightRight, unit: "cm", quality: aggQuality, side: "right" }),
    buildSitToStandMeasurement({ assessmentId, testId, key: "single_leg_jump_height_left", variable: "single_leg_jump_height_left", value: heightLeft, unit: "cm", quality: aggQuality, side: "left" }),
    buildSitToStandMeasurement({ assessmentId, testId, key: "single_leg_asymmetry_index", variable: "single_leg_asymmetry_index", value: asymmetry, unit: "%", quality: aggQuality, side: "bilateral" }),
  ];
}

// Respaldo DEMO si la cámara falla — mismo criterio que CMJ: tiempos de
// vuelo plausibles por la fórmula real, con una asimetría simulada
// pequeña entre piernas (más realista que dos valores idénticos).
function analyzeDemoSingleLegJump() {
  const jitter = (base, spread) => +(base + (Math.random() - 0.5) * spread).toFixed(3);
  const flightTimeRight = jitter(0.38, 0.05);
  const flightTimeLeft = jitter(0.36, 0.05); // ligera asimetría deliberada, no un espejo exacto del derecho
  const heightRight = calculateCmjJumpHeight(flightTimeRight);
  const heightLeft = calculateCmjJumpHeight(flightTimeLeft);
  const asymmetry = calculateLimbAsymmetryIndex(heightRight, heightLeft);
  return {
    heightRight: { variable: "single_leg_jump_height_right", value: heightRight, unit: "cm", side: "right", quality: null },
    heightLeft: { variable: "single_leg_jump_height_left", value: heightLeft, unit: "cm", side: "left", quality: null },
    asymmetry: { variable: "single_leg_asymmetry_index", value: asymmetry, unit: "%", side: "bilateral", quality: null },
  };
}

function generateDemoSquatRep(rep) {

  return {
    rep,
    kneeFlexion: jitter(96, 8),

}

// Utilidad compartida entre tests con repeticiones (sentadilla,
// sit-to-stand): "consistencia" = 100 - coeficiente de variación de la
// variable indicada entre las N repeticiones. Descriptiva, no un juicio
// de bueno/malo.
function repConsistency(reps, key) {
  const vals = reps.map((r) => r[key]);
  const mean = vals.reduce((s, v) => s + v, 0) / vals.length;
  if (mean === 0) return 100;
  const variance = vals.reduce((s, v) => s + (v - mean) ** 2, 0) / vals.length;
  const cv = (Math.sqrt(variance) / Math.abs(mean)) * 100;
  return +Math.max(0, 100 - cv).toFixed(1);
}

function analyzeSquat(captures) {
  const byView = (view) => captures.find((c) => c.view === view)?.quality?.confidence ?? 0.9;
  const reps = Array.from({ length: 5 }, (_, i) => generateDemoSquatRep(i + 1));
  const avg = (key) => +(reps.reduce((s, r) => s + r[key], 0) / reps.length).toFixed(1);

  return {
    simulated: true,
    captureQuality: { lateral: byView("lateral"), frontal: byView("frontal") },
    reps,
    measurements: {
      depth: { value: avg("depth"), unit: "%", side: null, quality: 0.9 },
      kneeFlexion: { value: avg("kneeFlexion"), unit: "°", side: null, quality: 0.9 },
      hipFlexion: { value: avg("hipFlexion"), unit: "°", side: null, quality: 0.88 },
      ankleDorsiflexion: { value: avg("ankleDorsiflexion"), unit: "°", side: null, quality: 0.87 },
      trunkLean: { value: avg("trunkLean"), unit: "°", side: null, quality: 0.89 },
      symmetry: { value: avg("symmetry"), unit: "%", side: null, quality: 0.9 },

    },
  };
}

    confidence: 0.9 + Math.random() * 0.08,
    simulated: true,
  };
}

function analyzeSingleLegBalance(capture, side) {
  const jitter = (base, spread) => +(base + (Math.random() - 0.5) * spread).toFixed(1);
  const targetDuration = EQUILIBRIO_TEST.targetDurationSeconds || 30;
  const duration = capture?.elapsedSeconds ?? targetDuration;
  return {
    side,
    duration,
    completedTarget: capture?.completedTarget ?? duration >= targetDuration,
    balanceLosses: Math.floor(Math.random() * 3), // 0–2, DEMO
    trunkSway: jitter(3.5, 2),
    hipSway: jitter(2.8, 1.6),
    kneeStability: jitter(90, 8),
    centerOfMassSway: jitter(1.4, 0.8),
    stabilityScore: jitter(78, 12), // indicador técnico DEMO — no se muestra como puntuación de salud
    quality: +(0.85 + Math.random() * 0.12).toFixed(2),

}

function analyzeBalance(captures) {
  const rightCapture = captures.find((c) => c.view === "right");

  const right = analyzeSingleLegBalance(rightCapture, "right");

      balanceLossesRight: { variable: "balance_losses", value: right.balanceLosses, unit: "count", side: "right", quality: right.quality },
      balanceLossesLeft: { variable: "balance_losses", value: left.balanceLosses, unit: "count", side: "left", quality: left.quality },

      balanceAsymmetry: { variable: "balance_asymmetry", value: +Math.abs(right.duration - left.duration).toFixed(1), unit: "seconds", side: null, quality: 0.9 },
    },

}

// ---------- analyzeArmElevation: quinta función de análisis, aislada ----------
// Genera un ArmElevationRepResult DEMO por repetición (3 en total) y

// de React/UI. Vista frontal: simetría, trayectoria de manos. Vista
// lateral: ángulo de elevación, inclinación de tronco/lumbar — ambas
// hoy simuladas por igual, sin diferenciar cálculo por vista todavía.
function generateDemoArmRep(rep) {
  const jitter = (base, spread) => +(base + (Math.random() - 0.5) * spread).toFixed(1);
  const leftElevation = jitter(162, 14);
  const rightElevation = jitter(160, 14);
  return {
    rep,
    leftElevation,
    rightElevation,
    leftHandHeight: jitter(198, 8),
    rightHandHeight: jitter(196, 8),
    elevationAsymmetry: +Math.abs(leftElevation - rightElevation).toFixed(1),

}

function analyzeArmElevation(captures) {
  const byView = (view) => captures.find((c) => c.view === view)?.quality?.confidence ?? 0.9;

// ---------- analyzeGait: octava y última función de análisis, aislada ----------
// Los datos simulados se generan en generateDemoGaitData() — separada de
// analyzeGait() y, sobre todo, de cualquier componente de UI, tal como
// pide el ticket ("NO utilizar Math.random() directamente en los
// componentes de interfaz"). En este archivo, igual que en las 7
// funciones analyzeXxx anteriores, todo Math.random() vive aquí, en la
// capa de servicio — nunca en un componente React.

function generateDemoGaitData() {
  const jitter = (base, spread) => +(base + (Math.random() - 0.5) * spread).toFixed(2);
  const numCycles = 6 + Math.floor(Math.random() * 5); // 6–10 ciclos
  return Array.from({ length: numCycles }, (_, i) => {
    const stanceTime = Math.max(0.3, jitter(0.62, 0.08));
    const swingTime = Math.max(0.2, jitter(0.4, 0.06));
    return {
      cycle: i + 1,
      duration: +(stanceTime + swingTime).toFixed(2),
      stanceTime,
      swingTime,
      stepLength: Math.max(30, jitter(62, 8)),
      strideLength: Math.max(60, jitter(124, 14)),
      cadence: Math.max(60, jitter(112, 10)),
      speed: Math.max(0.4, jitter(1.15, 0.2)),
      leftRightSymmetry: jitter(93, 6),
      quality: +(0.82 + Math.random() * 0.14).toFixed(2),
      isDemo: true,
    };
  });
}

function simulateGaitCaptureQuality() {
  return {
    lateral: {
      bodyDetected: true, bodyFullyVisible: true, legsVisible: true, feetVisible: true,
      cameraStable: true, walkingDirectionValid: true, lighting: true, framing: true,
      confidence: 0.88 + Math.random() * 0.1, simulated: true,
    },
    frontal: {
      bodyDetected: true, bodyFullyVisible: true, leftFootVisible: true, rightFootVisible: true,
      bodyCentered: true, cameraStable: true, lighting: true, framing: true,
      confidence: 0.86 + Math.random() * 0.1, simulated: true,
    },
  };
}

function analyzeGait(captures) {
  const cycles = generateDemoGaitData();
  const avg = (key) => +(cycles.reduce((s, c) => s + c[key], 0) / cycles.length).toFixed(2);
  const cycleTimeAvg = avg("duration");
  const stancePct = +((avg("stanceTime") / cycleTimeAvg) * 100).toFixed(1);
  const swingPct = +((avg("swingTime") / cycleTimeAvg) * 100).toFixed(1);

  return {
    simulated: true,
    captureQuality: simulateGaitCaptureQuality(),
    reps: cycles, // GaitCycleResult[] — fluye por el mismo campo genérico que usan sentadilla/STS/brazos
    measurements: {
      gaitSpeed: { variable: "gait_speed", value: avg("speed"), unit: "m/s", side: null, quality: 0.82 },
      cadence: { variable: "cadence", value: avg("cadence"), unit: "steps/min", side: null, quality: 0.82 },
      cycleTime: { variable: "cycle_time", value: cycleTimeAvg, unit: "seconds", side: null, quality: 0.83 },
      stanceTime: { variable: "stance_time", value: stancePct, unit: "%", side: null, quality: 0.78 },
      swingTime: { variable: "swing_time", value: swingPct, unit: "%", side: null, quality: 0.78 },
      stepLength: { variable: "step_length", value: avg("stepLength"), unit: "cm", side: null, quality: 0.8 },
      strideLength: { variable: "stride_length", value: avg("strideLength"), unit: "cm", side: null, quality: 0.8 },
      gaitSymmetry: { variable: "gait_symmetry", value: avg("leftRightSymmetry"), unit: "%", side: null, quality: 0.76 },
      cycleVariability: { variable: "cycle_variability", value: +(100 - repConsistency(cycles, "duration")).toFixed(1), unit: "%", side: null, quality: 0.75 },
    },
  };
}

// Punto único de entrada al análisis por computer vision desde la UI.
// Las 8 pruebas del sistema ya tienen aquí su analizador (DEMO).
function analyzeTest(testId, captures) {
  switch (testId) {
    case "postura_estatica":
      return analyzePosture(captures);
    case "sentadilla":
      return analyzeSquat(captures);
    case "sit_to_stand":
      return analyzeSitToStand(captures);
    case "equilibrio_unipodal":
      return analyzeBalance(captures);
    case "elevacion_brazos":
      return analyzeArmElevation(captures);
    case "rotacion_tronco":
      return analyzeTrunkRotation(captures);
    case "dorsiflexion":
      return analyzeDorsiflexion(captures);
    case "marcha":
      return analyzeGait(captures);
    default:
      throw new Error(`Sin analizador todavía para "${testId}".`);
  }
}

// Convierte la salida "cruda" del servicio de análisis en Measurement[]
// con la forma definitiva del modelo de datos (incluye isDemo/source).
function buildMeasurements({ assessmentId, testId, raw, source, isDemo }) {
  const timestamp = new Date().toISOString();
  return Object.entries(raw).map(([key, m]) => ({
    id: `${assessmentId}_${key}`,
    assessmentId,
    testId,
    variable: m.variable || key,
    value: m.value ?? null,
    unit: m.unit,
    side: m.side ?? null,
    timestamp,
    measurementQuality: m.quality ?? null,
    source,
    isDemo,
  }));
}

/* ---------- Guía de una captura individual: ready→countdown→capturing→captured→review ----------
   mode="photo" (por defecto): comportamiento original, sin cambios — lo
     usa Postura estática.
   mode="video_reps": simula una grabación con contador de repeticiones
     (0→reps) durante la fase "capturing" — lo usa Sentadilla y Sit-to-Stand.
     Añade un botón "Cancelar" mientras graba.
   mode="timed_hold": cronómetro que sube segundo a segundo hasta
     targetSeconds durante "capturing" — lo usa Equilibrio unipodal.
     Añade un botón "Detener" que finaliza el mantenimiento antes de
     tiempo (completedTarget: false); si llega a targetSeconds termina
     solo (completedTarget: true). */

function CaptureGuide({ view, index, total, onAccept, mode = "photo", reps = 5, targetSeconds = 30 }) {
  const [state, setState] = useState("ready");
  const [count, setCount] = useState(3);
  const [repCount, setRepCount] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [completedTarget, setCompletedTarget] = useState(false);
  const [quality, setQuality] = useState(null);
  const isVideo = mode === "video_reps";
  const isTimed = mode === "timed_hold";

  // Cuenta atrás de 3s, común a los tres modos.
  useEffect(() => {
    if (state !== "countdown") return;
    if (count === 0) {
      setState("capturing");
      if (isVideo || isTimed) return; // el conteo lo llevan los efectos siguientes
      const t = setTimeout(() => {
        setQuality(simulateCaptureQuality());
        setState("captured");
        setTimeout(() => setState("review"), 350);
      }, 700);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setCount((c) => c - 1), 800);
    return () => clearTimeout(t);
  }, [state, count, isVideo, isTimed]);

  // Conteo de repeticiones simulado (solo mode="video_reps").
  useEffect(() => {
    if (!isVideo || state !== "capturing") return;
    if (repCount >= reps) {
      setQuality(simulateCaptureQuality());
      setState("captured");
      const t = setTimeout(() => setState("review"), 350);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setRepCount((c) => c + 1), 650);
    return () => clearTimeout(t);
  }, [isVideo, state, repCount, reps]);

  // Cronómetro de mantenimiento en tiempo real, segundo a segundo (solo
  // mode="timed_hold"). Se detiene solo al llegar a targetSeconds.
  useEffect(() => {
    if (!isTimed || state !== "capturing") return;
    if (elapsed >= targetSeconds) {
      setCompletedTarget(true);
      setQuality(simulateCaptureQuality());
      setState("captured");
      const t = setTimeout(() => setState("review"), 350);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setElapsed((s) => s + 1), 1000);
    return () => clearTimeout(t);
  }, [isTimed, state, elapsed, targetSeconds]);

  const startCountdown = () => { setState("countdown"); setCount(3); setRepCount(0); setElapsed(0); setCompletedTarget(false); };
  const repeat = () => { setState("ready"); setQuality(null); setCount(3); setRepCount(0); setElapsed(0); setCompletedTarget(false); };
  const cancelRecording = () => { setState("ready"); setQuality(null); setCount(3); setRepCount(0); };
  const stopHold = () => {
    setCompletedTarget(elapsed >= targetSeconds);
    setQuality(simulateCaptureQuality());
    setState("captured");
    setTimeout(() => setState("review"), 350);
  };
  const accept = () =>
    onAccept({
      view: view.id,
      timestamp: new Date().toISOString(),
      quality,
      ...(isTimed ? { elapsedSeconds: elapsed, completedTarget } : {}),
    });

  return (
    <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      <div className="relative flex items-center justify-center" style={{ aspectRatio: "4/5", background: C.ink }}>
        {/* Guía visual de posición */}
        <div
          className="absolute"
          style={{
            inset: "9% 30% 6% 30%",
            borderRadius: "40% 40% 20% 20%",
            border: `2px dashed ${state === "capturing" ? C.teal : "#3A4650"}`,
            transition: "border-color .3s",
          }}
        />
        <div className="relative z-10 flex flex-col items-center gap-2">
          {state === "ready" && (
            <>
              <Camera size={28} color="#5B6670" />
              <span style={{ ...fontBody, color: "#8B959D", fontSize: 12 }} className="text-center px-6">
                {isTimed ? `Prepárate: apoyo en ${view.label.toLowerCase()}` : `Colócate en posición ${view.label.toLowerCase()}`}
              </span>
            </>
          )}
          {state === "countdown" && (
            <span style={{ ...fontMono, color: "#fff", fontSize: 36, fontWeight: 600 }}>{count === 0 ? "•" : count}</span>
          )}
          {state === "capturing" && !isVideo && !isTimed && (

            <span style={{ ...fontMono, color: C.teal, fontSize: 14, fontWeight: 600 }} className="flex items-center gap-2">

            <div className="flex flex-col items-center gap-1.5">
              <span style={{ ...fontMono, color: "#fff", fontSize: 12, fontWeight: 600 }} className="uppercase tracking-wide">

              <span style={{ ...fontMono, color: "#8B959D", fontSize: 11 }}>de {targetSeconds}s</span>
            </div>
          )}
          {(state === "captured" || state === "review") && (
            <span style={{ ...fontMono, color: C.teal, fontSize: 13 }} className="flex items-center gap-2">
              <Check size={16} /> Captura {index + 1} de {total}
            </span>
          )}
        </div>
        <div className="absolute top-3 left-3">
          <span style={{ ...fontMono, color: "#8B959D", fontSize: 10 }} className="uppercase tracking-wide">{state}</span>
        </div>
        <div className="absolute top-3 right-3">
          <span style={{ ...fontMono, color: "#8B959D", fontSize: 10 }}>{index + 1}/{total}</span>
        </div>
        {isVideo && state === "capturing" && (
          <button
            onClick={cancelRecording}
            className="absolute bottom-3 right-3 rounded-full px-3 py-1.5"
            style={{ background: "rgba(0,0,0,0.45)" }}
          >
            <span style={{ ...fontBody, color: "#fff", fontSize: 11, fontWeight: 600 }}>Cancelar</span>
          </button>
        )}
        {isTimed && state === "capturing" && (
          <button
            onClick={stopHold}
            className="absolute bottom-3 right-3 rounded-full px-3 py-1.5"
            style={{ background: "rgba(196,87,63,0.85)" }}
          >
            <span style={{ ...fontBody, color: "#fff", fontSize: 11, fontWeight: 600 }}>Detener</span>
          </button>
        )}
      </div>

      <div className="p-4 space-y-3">
        <div style={{ ...fontDisplay, color: C.text, fontSize: 15, fontWeight: 600 }}>{view.label}</div>

          <div style={{ ...fontBody, color: C.inkFaint, fontSize: 12 }}>

          <div style={{ ...fontBody, color: C.inkFaint, fontSize: 12 }}>

            <span style={{ ...fontBody, color: C.tealDeep, fontSize: 13 }}>

            <button onClick={startCountdown} className="flex-1 flex items-center justify-center gap-2 rounded-xl py-3" style={{ background: C.teal }}>
              <Play size={16} color="#fff" fill="#fff" />
              <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>
                {isTimed ? "Iniciar equilibrio" : isVideo ? "Iniciar grabación" : "Iniciar captura"}

            </button>

          {(state === "countdown" || state === "capturing") && (
            <button disabled className="flex-1 rounded-xl py-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
              <span style={{ ...fontBody, color: C.inkFaint, fontSize: 14, fontWeight: 600 }}>

                <RotateCcw size={15} color={C.inkSoft} />

                <ChevronRight size={16} color="#fff" />

            </>
          )}
        </div>
      </div>
    </div>
  );

   Tiempo de apoyo por lado + diferencia, pérdidas de equilibrio por
   lado, control postural (variables bilaterales DEMO), comparativa
   derecha/izquierda con barras simples (sin recharts, sin dependencia
   nueva) y una segunda gráfica opcional de oscilación durante la
   prueba, preparada para datos temporales reales. "stabilityScore" no
   se muestra — es un indicador técnico interno, no una puntuación de
   salud. Sin verde/amarillo/rojo, sin riesgo de caída. */

function CompareBar({ label, right, left, unit, maxHint }) {
  const max = maxHint || Math.max(right, left, 1);
  const pct = (v) => Math.max(4, Math.round((v / max) * 100));
  return (
    <div className="space-y-1.5">
      <div style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>{label}</div>
      <div className="flex items-center gap-2">
        <span style={{ ...fontMono, color: C.inkFaint, fontSize: 10, width: 14 }}>D</span>
        <div className="flex-1 rounded-full overflow-hidden" style={{ background: C.paper, height: 8 }}>
          <div style={{ width: `${pct(right)}%`, height: "100%", background: C.teal, borderRadius: 999 }} />
        </div>
        <DataValue value={right} unit={unit} size={13} />
      </div>
      <div className="flex items-center gap-2">
        <span style={{ ...fontMono, color: C.inkFaint, fontSize: 10, width: 14 }}>I</span>
        <div className="flex-1 rounded-full overflow-hidden" style={{ background: C.paper, height: 8 }}>
          <div style={{ width: `${pct(left)}%`, height: "100%", background: C.tealDeep, borderRadius: 999 }} />
        </div>
        <DataValue value={left} unit={unit} size={13} />
      </div>
    </div>
  );
}

// Gráfica opcional de "oscilación durante la prueba" — usa puntos DEMO
// muestreados a lo largo de la duración de cada lado; el día que haya
// datos temporales reales de pose estimation, esta función se sustituye
// por la trayectoria real de oscilación, sin tocar el componente.
function buildSwayTimeline(sideResult) {
  const points = 8;
  return Array.from({ length: points }, (_, i) => ({
    t: `${Math.round((sideResult.duration / (points - 1)) * i)}s`,
    valor: +(sideResult.trunkSway + (Math.random() - 0.5) * 1.5).toFixed(1),
  }));
}

function BalanceSwayChart({ right, left }) {
  const rightData = buildSwayTimeline(right);
  const leftData = buildSwayTimeline(left);
  const merged = rightData.map((p, i) => ({ t: p.t, derecha: p.valor, izquierda: leftData[i]?.valor }));
  return (
    <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      <div className="flex items-center justify-between mb-3">
        <span style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }}>Oscilación durante la prueba</span>
        <DemoTag />
      </div>
      <div style={{ height: 130 }}>
        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={merged} margin={{ top: 8, right: 4, left: -24, bottom: 0 }}>
            <CartesianGrid stroke={C.line} vertical={false} />
            <XAxis dataKey="t" tick={{ fontSize: 10, fill: C.inkFaint }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fontSize: 10, fill: C.inkFaint }} axisLine={false} tickLine={false} width={30} />
            <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8, border: `1px solid ${C.line}` }} />
            <Line type="monotone" dataKey="derecha" stroke={C.teal} strokeWidth={2} dot={false} />
            <Line type="monotone" dataKey="izquierda" stroke={C.tealDeep} strokeWidth={2} dot={false} strokeDasharray="4 3" />
          </LineChart>
        </ResponsiveContainer>
      </div>
      <div className="flex items-center gap-4 mt-2">
        <span style={{ ...fontBody, color: C.teal, fontSize: 11 }}>— Derecha</span>
        <span style={{ ...fontBody, color: C.tealDeep, fontSize: 11 }}>┄ Izquierda</span>
      </div>
    </div>
  );
}

// Trayectoria de elevación — opcional, DEMO. El día que haya pose
// estimation real, esta función se sustituye por la trayectoria real
// hombro→mano a lo largo del movimiento, sin tocar el componente.
function buildElevationTrajectory(rep) {
  const points = 8;
  return Array.from({ length: points }, (_, i) => {
    const t = i / (points - 1);
    return {
      t: `${Math.round(t * (rep.movementTime || 2) * 10) / 10}s`,
      izquierdo: +(t * rep.leftElevation).toFixed(0),
      derecho: +(t * rep.rightElevation).toFixed(0),
    };
  });
}

function ArmTrajectoryChart({ reps }) {
  const data = buildElevationTrajectory(reps[0]);
  return (
    <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      <div className="flex items-center justify-between mb-3">

  );

/* ---------- Pantalla de resultados: DORSIFLEXIÓN DE TOBILLO ----------
   Dos métodos de medición independientes (ángulo y distancia
   rodilla-pared) sin mezclarlos, estado del talón por lado, gráfica
   por repetición y calidad de captura con wallDetected incluido. Igual
   que en rotación de tronco: quality bajo y sin interpretar "bueno" o
   "malo". */

function DorsiRepChart({ reps }) {
  const byRep = Array.from({ length: 3 }, (_, i) => {
    const rep = i + 1;
    const right = reps.find((r) => r.rep === rep && r.side === "right");
    const left = reps.find((r) => r.rep === rep && r.side === "left");
    return { rep: `Rep ${rep}`, derecha: right?.dorsiflexionAngle, izquierda: left?.dorsiflexionAngle };
  });
  return (
    <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      <div className="flex items-center justify-between mb-3">
        <span style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }}>Dorsiflexión por repetición</span>
        <DemoTag label="Estimación DEMO" />
      </div>
      <div style={{ height: 130 }}>
        <ResponsiveContainer width="100%" height="100%">
          <LineChart data={byRep} margin={{ top: 8, right: 4, left: -24, bottom: 0 }}>
            <CartesianGrid stroke={C.line} vertical={false} />
            <XAxis dataKey="rep" tick={{ fontSize: 10, fill: C.inkFaint }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fontSize: 10, fill: C.inkFaint }} axisLine={false} tickLine={false} width={30} />
            <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8, border: `1px solid ${C.line}` }} />
            <Line type="monotone" dataKey="derecha" stroke={C.teal} strokeWidth={2} dot={{ r: 3 }} />
            <Line type="monotone" dataKey="izquierda" stroke={C.tealDeep} strokeWidth={2} dot={{ r: 3 }} strokeDasharray="4 3" />
          </LineChart>
        </ResponsiveContainer>
      </div>
      <div className="flex items-center gap-4 mt-2">
        <span style={{ ...fontBody, color: C.teal, fontSize: 11 }}>— Derecha</span>
        <span style={{ ...fontBody, color: C.tealDeep, fontSize: 11 }}>┄ Izquierda</span>
      </div>
    </div>
  );
}
