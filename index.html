// Orquestador: instructions → camera_permission → camera_ready →
// body_searching → body_detected → ready_to_start → recording →
// completed | error. Ante cualquier fallo (permiso denegado, modelo de
// pose no disponible, navegador incompatible) cae a `useDemoFallback`,
// que renderiza el AssessmentFlow + SitToStandResultados de siempre,
// SIN TOCARLOS — el modo DEMO se conserva íntegro.
const STS_STAGE_LABELS = { SEATED: "Sentado", RISING: "Levantándote", STANDING: "De pie", SITTING: "Sentándote" };

function RealSitToStandFlow({ onSave, onContinue, onAbort }) {
  const [useDemoFallback, setUseDemoFallback] = useState(false);
  const [phase, setPhase] = useState("instructions");
  const [errorMessage, setErrorMessage] = useState("");
  const [bodyStatus, setBodyStatus] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [result, setResult] = useState(null);
  const [saved, setSaved] = useState(false);
  const [repProgress, setRepProgress] = useState({ index: 1, total: SIT_TO_STAND_THRESHOLDS.repsRequired, stage: "SEATED", invalid: false, reason: null });
  const [completedReps, setCompletedReps] = useState([]);
  // Preparado para un futuro selector de cámara ("user" | "environment").
  // Por defecto, la que ya funciona hoy — no se cambia automáticamente.
  const [cameraFacingMode] = useState("user");

  const videoRef = useRef(null);
  const landmarksRef = useRef(null);
  const landmarkerRef = useRef(null);
  const rafRef = useRef(null);
  const phaseRef = useRef(phase);
  const historyRef = useRef([]);
  const qualitySamplesRef = useRef([]);
  const frameCountersRef = useRef({ total: 0, valid: 0, lost: 0 });
  const cameraJitterRef = useRef([]);
  const prevShoulderMidRef = useRef(null);
  const sendingRef = useRef(false);
  const stageRef = useRef("SEATED");
  const stableSearchCountRef = useRef(0);
  const lastUiUpdateRef = useRef(0);
  // — ciclo de 5 repeticiones —
  const repIndexRef = useRef(1);
  const validRepsRef = useRef([]);
  // movementStartTime se fija en SEATED→RISING (no al empezar sentado) —
  // así el tiempo del ciclo nunca incluye la espera sentado.
  const currentRepRef = useRef({ repetition: 1, movementStartTime: null, standReachedTime: null, sitStartTime: null, movementEndTime: null });
  const standingHipYRef = useRef(null);
  const criticalLostStreakRef = useRef(0);
  const phaseStartRef = useRef(null); // para el timeout de fase (RISING/SITTING)
  const transitionsRef = useRef([]); // [{stage, t}] de la repetición en curso
  const testStartTimeRef = useRef(null); // al pulsar "Iniciar" — reloj de pared de toda la prueba
  const testEndTimeRef = useRef(null);   // al completar la 5ª repetición válida
  const readyTimeoutRef = useRef(null);  // setTimeout de onCameraReady — debe poder cancelarse
  const unmountedRef = useRef(false);    // evita reprogramar nada (rAF, timeouts) tras desmontar

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const cleanupLoop = () => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = null;
  };
  useEffect(() => () => {
    unmountedRef.current = true;
    cleanupLoop();
    clearTimeout(readyTimeoutRef.current);
  }, []);

  const goToDemo = (message) => {
    cleanupLoop();
    if (message) setErrorMessage(message);
    setPhase("error");
  };

  // Prepara el estado para una repetición (nueva o reintento): baseline
  // de cadera, contadores de frames/calidad y transiciones — todo
  // acotado a ESTA repetición, para que su CaptureQuality no mezcle
  // datos de otras. `startTimestamp` es solo el punto de referencia
  // SEATED para detectar el ascenso — NO es movementStartTime: eso se
  // fija más abajo, exactamente cuando se confirma SEATED→RISING, para
  // que el tiempo medido nunca incluya la espera sentado.
  const resetRepAttempt = (startTimestamp) => {
    const lm = landmarksRef.current;
    stageRef.current = "SEATED";
    currentRepRef.current = { repetition: repIndexRef.current, movementStartTime: null, standReachedTime: null, sitStartTime: null, movementEndTime: null };
    historyRef.current = [{ t: startTimestamp, hipY: lm ? hipY(lm) : null, trunkAngle: lm ? trunkAngleDeg(lm) : null }];
    qualitySamplesRef.current = [];
    frameCountersRef.current = { total: 0, valid: 0, lost: 0 };
    criticalLostStreakRef.current = 0;
    standingHipYRef.current = null;
    phaseStartRef.current = startTimestamp;
    transitionsRef.current = [];
    setRepProgress({ index: repIndexRef.current, total: SIT_TO_STAND_THRESHOLDS.repsRequired, stage: "SEATED", invalid: false, reason: null });
  };

  // Repetición inválida: se pausa la detección (stage "INVALID") y se
  // ofrece reintentar SOLO esta repetición — las anteriores ya
  // validadas se conservan en validRepsRef.
  const failRep = (reason) => {
    stageRef.current = "INVALID";
    setRepProgress((p) => ({ ...p, invalid: true, reason }));
  };

  const retryCurrentRep = () => {
    resetRepAttempt(performance.now());
  };

  // Repetición completada y válida: se guarda, y se encadena la
  // siguiente reutilizando el punto SEATED actual como referencia para
  // detectar el próximo RISING — o se termina la prueba si ya son 5.
  const finalizeRep = (movementEndTime) => {
    const ev = currentRepRef.current;
    const captureQuality = buildCaptureQuality({
      samples: qualitySamplesRef.current,
      frameCounters: frameCountersRef.current,
      cameraJitter: cameraJitterRef.current,
    });
    const rep = {
      repetition: ev.repetition,
      movementStartTime: ev.movementStartTime,
      standReachedTime: ev.standReachedTime,
      sitStartTime: ev.sitStartTime,
      movementEndTime,
      cycleTime: calculateSitToStandDuration(ev.movementStartTime, movementEndTime), // solo movimiento, sin espera sentado
      riseTime: calculateSitToStandDuration(ev.movementStartTime, ev.standReachedTime),
      standDuration: calculateSitToStandDuration(ev.standReachedTime, ev.sitStartTime),
      sitTime: calculateSitToStandDuration(ev.sitStartTime, movementEndTime),
      quality: captureQuality.overall,
      valid: true,
      invalidReason: null,
      captureQuality,
      measurementQuality: captureQuality.modelConfidence,
      stateTransitions: transitionsRef.current,
    };
    validRepsRef.current = [...validRepsRef.current, rep];
    setCompletedReps(validRepsRef.current);

    if (validRepsRef.current.length >= SIT_TO_STAND_THRESHOLDS.repsRequired) {
      cleanupLoop();
      testEndTimeRef.current = movementEndTime;
      const reps = validRepsRef.current;
      const testTotalTime = calculateSitToStandDuration(testStartTimeRef.current, testEndTimeRef.current); // reloj de pared de toda la prueba
      const consistency = calculateSitToStandConsistency(reps); // sobre cycleTime
      const aggQuality = aggregateRepCaptureQualities(reps);
      const assessmentId = `assessment_${Date.now()}`;
      const measurements = createSitToStandScientificMeasurements({ assessmentId, testId: STS_TEST.id, testTotalTime, consistency, aggQuality });
      const assessment = {
        id: assessmentId, testId: STS_TEST.id, timestamp: new Date().toISOString(), status: "completed",
        captures: [], reps, captureQuality: aggQuality, measurements,
      };
      setResult(assessment);
      setPhase("completed");
      return;
    }

    repIndexRef.current += 1;
    resetRepAttempt(movementEndTime); // baseline SEATED de la siguiente repetición
  };

  const STILL_PHASES = ["body_searching", "body_detected", "ready_to_start"];
  const CRITICAL_STAGES = ["RISING", "SITTING"];

  // Procesa un frame ya resuelto (landmarks o null) — misma lógica que
  // antes, ahora invocada desde el callback onResults en vez de en
  // línea dentro del bucle, porque send()/onResults() es asíncrono
  // (a diferencia del detectForVideo() síncrono de tasks-vision).
  const processFrame = (lm) => {
    const currentPhase = phaseRef.current;
    const now = performance.now();
    landmarksRef.current = lm;

    const status = detectBody(lm); // maneja lm === null devolviendo detected:false
    const framing = lm ? computeFramingQuality(lm) : null;
    const stage = stageRef.current;

    if (currentPhase === "recording" && stage !== "INVALID") {
      frameCountersRef.current.total += 1;
      const isValidFrame = status.detected && status.bodyFullyVisible;
      if (isValidFrame) {
        frameCountersRef.current.valid += 1;
        criticalLostStreakRef.current = 0;
      } else {
        frameCountersRef.current.lost += 1;
        if (CRITICAL_STAGES.includes(stage)) {
          criticalLostStreakRef.current += 1;
          if (criticalLostStreakRef.current >= SIT_TO_STAND_THRESHOLDS.maxCriticalLostFrames) {
            failRep("Cuerpo no detectado durante el movimiento");
          }
        }
      }

      qualitySamplesRef.current.push({ ...status, framing });
      if (qualitySamplesRef.current.length > 600) qualitySamplesRef.current.shift();

      if (lm) {
        const hy = hipY(lm);
        const ta = trunkAngleDeg(lm);
        historyRef.current.push({ t: now, hipY: hy, trunkAngle: ta });
        if (historyRef.current.length > 300) historyRef.current.shift();
      }
    }

    // Jitter de cámara: solo en fases en las que la persona debería
    // estar quieta — durante la propia repetición el movimiento del
    // usuario domina la señal y no serviría para medir la cámara.
    if (lm && STILL_PHASES.includes(currentPhase)) {
      const mid = shoulderMid(lm);
      const prevMid = prevShoulderMidRef.current;
      if (mid && prevMid) {
        const dx = mid.x - prevMid.x, dy = mid.y - prevMid.y;
        cameraJitterRef.current.push(Math.sqrt(dx * dx + dy * dy));
        if (cameraJitterRef.current.length > 90) cameraJitterRef.current.shift();
      }
      prevShoulderMidRef.current = mid;
    } else if (!lm) {
      prevShoulderMidRef.current = null;
    }

    if (now - lastUiUpdateRef.current > 200) {
      lastUiUpdateRef.current = now;
      setBodyStatus({ ...status, framing });
      if (currentPhase === "recording" && currentRepRef.current.movementStartTime != null) {
        setElapsed(+((now - currentRepRef.current.movementStartTime) / 1000).toFixed(1));
      } else if (currentPhase === "recording") {
        setElapsed(0); // todavía sentado, esperando el inicio real del movimiento
      }
    }

    if (currentPhase === "body_searching") {
      stableSearchCountRef.current = status.bodyFullyVisible && status.detected ? stableSearchCountRef.current + 1 : 0;
      if (stableSearchCountRef.current >= SIT_TO_STAND_THRESHOLDS.stabilityFrames) {
        setPhase("body_detected");
      }
      return;
    }

    if (currentPhase !== "recording" || stage === "INVALID" || !lm) return;

    // Máquina de 4 fases: SEATED → RISING → STANDING → SITTING → SEATED.
    // Cada transición se registra en transitionsRef (state transitions).
    // movementStartTime se fija AQUÍ, al confirmar SEATED→RISING — nunca
    // al empezar sentado — así el tiempo medido excluye la espera previa.
    if (stage === "SEATED") {
      if (detectSitToStandStart(historyRef.current)) {
        stageRef.current = "RISING";
        currentRepRef.current.movementStartTime = now;
        phaseStartRef.current = now;
        transitionsRef.current.push({ stage: "RISING", t: now });
        setRepProgress((p) => ({ ...p, stage: "RISING" }));
      }
    } else if (stage === "RISING") {
      if (detectStandingPosition(historyRef.current)) {
        stageRef.current = "STANDING";
        currentRepRef.current.standReachedTime = now;
        standingHipYRef.current = hipY(lm);
        phaseStartRef.current = now;
        transitionsRef.current.push({ stage: "STANDING", t: now });
        setRepProgress((p) => ({ ...p, stage: "STANDING" }));
      } else if (now - phaseStartRef.current > SIT_TO_STAND_THRESHOLDS.maxPhaseDurationMs) {
        failRep("Posición de pie no detectada");
      }
    } else if (stage === "STANDING") {
      const hy = hipY(lm);
      if (hy != null && (standingHipYRef.current == null || hy < standingHipYRef.current)) {
        standingHipYRef.current = hy; // por si hay un pequeño balanceo antes de bajar
      }
      if (detectSittingStart(historyRef.current, standingHipYRef.current)) {
        stageRef.current = "SITTING";
        currentRepRef.current.sitStartTime = now;
        phaseStartRef.current = now;
        transitionsRef.current.push({ stage: "SITTING", t: now });
        setRepProgress((p) => ({ ...p, stage: "SITTING" }));
      }
      // Sin timeout aquí: el usuario puede permanecer de pie el tiempo que quiera.
    } else if (stage === "SITTING") {
      if (detectSeatedReturn(historyRef.current)) {
        stageRef.current = "SEATED";
        transitionsRef.current.push({ stage: "SEATED", t: now });
        finalizeRep(now); // movementEndTime = este instante
      } else if (now - phaseStartRef.current > SIT_TO_STAND_THRESHOLDS.maxPhaseDurationMs) {
        failRep("Retorno a sentado no detectado");
      }
    }
  };

  // Bucle "empujador": pide un frame nuevo al modelo cada rAF, sin
  // solapar envíos (send() es asíncrono; con sendingRef evitamos pedir
  // el siguiente antes de que el anterior termine de procesarse).
  const runDetectionLoop = () => {
    const pose = landmarkerRef.current;
    if (!pose) return;
    pose.onResults((results) => processFrame(results?.poseLandmarks || null));

    const pushFrame = async () => {
      if (rafRef.current === null) return; // cleanupLoop() ya canceló
      const video = videoRef.current;
      const currentPhase = phaseRef.current;
      if (video && video.readyState >= 2 && currentPhase !== "completed" && currentPhase !== "error" && !sendingRef.current) {
        sendingRef.current = true;
        try {
          await pose.send({ image: video });
        } catch {
          // pose.send() falló: este frame no generó onResults, así que
          // processFrame() nunca se habría llamado para él. Lo forzamos
          // aquí con lm=null — misma ruta que cualquier frame sin
          // landmarks (detectBody(null) → se contabiliza como perdido).
          // No se inventa ningún landmark.
          processFrame(null);
        } finally {
          sendingRef.current = false;
        }
      }
      if (rafRef.current !== null) rafRef.current = requestAnimationFrame(pushFrame);
    };
    rafRef.current = requestAnimationFrame(pushFrame);
  };

  const beginCapture = async () => {
    setPhase("camera_permission");
    try {
      const pose = await loadPoseModel();
      landmarkerRef.current = pose;
    } catch (err) {
      console.error("Fallo al cargar el motor de pose:", err);
      const detail = err?.message ? ` (${err.message})` : "";
      goToDemo(`No se pudo cargar el motor de detección de pose${detail}. Puedes usar la demostración.`);
    }
  };

  const onCameraReady = () => {
    if (phaseRef.current === "error" || unmountedRef.current) return;
    setPhase("camera_ready");
    readyTimeoutRef.current = setTimeout(() => {
      if (unmountedRef.current || phaseRef.current === "error") return;
      setPhase("body_searching");
      stableSearchCountRef.current = 0;
      runDetectionLoop();
    }, 200);
  };

  const onCameraError = (err) => {
    const detail = err?.message ? ` (${err.message})` : "";
    goToDemo(`No se pudo acceder a la cámara${detail}. Comprueba los permisos o usa la demostración.`);
  };

  useEffect(() => {
    if (phase !== "body_detected") return undefined;
    const t = setTimeout(() => setPhase("ready_to_start"), 500);
    return () => clearTimeout(t);
  }, [phase]);

  const handleStart = () => {
    const now = performance.now();
    testStartTimeRef.current = now;
    testEndTimeRef.current = null;
    repIndexRef.current = 1;
    validRepsRef.current = [];
    setCompletedReps([]);
    resetRepAttempt(now);
    setElapsed(0);
    setPhase("recording");
  };

  const handleSave = () => {
    onSave(result);
    setSaved(true);
  };

  if (useDemoFallback) {
    return <AssessmentFlow test={STS_TEST} ResultsComponent={SitToStandResultados} onSave={onSave} onContinue={onContinue} onAbort={onAbort} />;
  }

  const showCamera = ["camera_ready", "body_searching", "body_detected", "ready_to_start", "recording"].includes(phase);

  return (
    <div className="space-y-4">
      {phase !== "completed" && (
        <div className="flex items-center justify-between">
          <button onClick={onAbort} className="flex items-center gap-1.5 rounded-full px-3 py-1.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <ChevronLeft size={15} color={C.inkSoft} />
            <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Abandonar</span>
          </button>
          <button onClick={() => setUseDemoFallback(true)} className="rounded-full px-3 py-1.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5, fontWeight: 600 }}>Usar demostración</span>
          </button>
        </div>
      )}

      {phase === "instructions" && (
        <div className="space-y-3">
          <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div style={{ ...fontDisplay, color: C.text, fontSize: 16, fontWeight: 600 }}>{STS_TEST.name} — captura real</div>
            <div className="rounded-lg p-3 mt-3 flex items-start gap-2" style={{ background: C.paper }}>
              <Info size={15} color={C.inkSoft} className="mt-0.5 shrink-0" />
              <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5, lineHeight: 1.5 }}>
                Realiza 5 levantamientos mediante estimación de pose en tu dispositivo — no se graba ni
                se sube ningún vídeo.
              </span>
            </div>
            <ul className="space-y-2 mt-3">
              {["Comienza sentado en una silla estable.", "Coloca los pies apoyados en el suelo.", "Mantén los brazos cruzados sobre el pecho.", "Levántate completamente y vuelve a sentarte.", "Realiza los 5 movimientos a un ritmo natural.", "Cuando estés preparado, pulsa Iniciar."].map((t) => (
                <li key={t} className="flex items-start gap-2">
                  <Check size={14} color={C.teal} className="mt-0.5 shrink-0" />
                  <span style={{ ...fontBody, color: C.inkSoft, fontSize: 13.5 }}>{t}</span>
                </li>
              ))}
            </ul>
          </div>
          <button onClick={beginCapture} className="w-full flex items-center justify-center gap-2 rounded-xl py-3.5" style={{ background: C.teal }}>
            <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Activar cámara</span>
            <ChevronRight size={16} color="#fff" />
          </button>
        </div>
      )}

      {phase === "camera_permission" && !showCamera && (
        <div className="rounded-2xl p-8 flex flex-col items-center gap-3" style={{ background: C.ink }}>
          <Loader2 size={24} className="animate-spin" color={C.teal} />
          <span style={{ ...fontBody, color: "#fff", fontSize: 14 }}>Solicitando acceso a la cámara…</span>
        </div>
      )}

      {(phase === "camera_permission" || showCamera) && (
        <div
          className="relative rounded-2xl overflow-hidden"
          style={{ aspectRatio: "4/5", background: C.ink, display: phase === "camera_permission" && !showCamera ? "none" : "block" }}
        >
          <RealCameraCapture videoRef={videoRef} active={true} onReady={onCameraReady} onError={onCameraError} facingMode={cameraFacingMode} />
          <PoseDetectionOverlay landmarksRef={landmarksRef} />

          <div className="absolute inset-x-0 top-0 p-3 flex justify-between items-start">
            <span style={{ ...fontMono, color: "#fff", fontSize: 10, background: "rgba(0,0,0,0.4)" }} className="px-2 py-1 rounded uppercase tracking-wide">
              {phase.replace(/_/g, " ")}
            </span>
          </div>

          <div className="absolute inset-x-0 bottom-0 p-4 flex flex-col items-center gap-2" style={{ background: "linear-gradient(transparent, rgba(0,0,0,0.55))" }}>
            {phase === "camera_ready" && (
              <span style={{ ...fontBody, color: "#fff", fontSize: 13 }}>Colócate de perfil</span>
            )}
            {phase === "body_searching" && (
              <span style={{ ...fontBody, color: "#fff", fontSize: 13 }} className="flex items-center gap-2">
                <Loader2 size={14} className="animate-spin" /> Buscando persona…
              </span>
            )}
            {phase === "body_detected" && (
              <span style={{ ...fontMono, color: C.teal, fontSize: 13, fontWeight: 600 }} className="flex items-center gap-2">
                <Check size={16} /> Persona detectada
              </span>
            )}
            {phase === "ready_to_start" && (
              <button onClick={handleStart} className="rounded-full px-6 py-3" style={{ background: C.teal }}>
                <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 700 }}>INICIAR</span>
              </button>
            )}
            {phase === "recording" && !repProgress.invalid && (
              <div className="flex flex-col items-center gap-1.5">
                <span style={{ ...fontMono, color: "#fff", fontSize: 12, fontWeight: 600 }} className="uppercase tracking-wide">
                  Repetición {repProgress.index}/{repProgress.total} · {STS_STAGE_LABELS[repProgress.stage] || repProgress.stage}
                </span>
                <span style={{ ...fontMono, color: C.teal, fontSize: 28, fontWeight: 600 }}>{elapsed.toFixed(1)}s</span>
              </div>
            )}
            {phase === "recording" && repProgress.invalid && (
              <div className="flex flex-col items-center gap-2 w-full">
                <span style={{ ...fontMono, color: "#fff", fontSize: 12, fontWeight: 600 }} className="flex items-center gap-1.5">
                  <AlertCircle size={14} color={C.coral} /> Repetición no válida
                </span>
                <span style={{ ...fontBody, color: "#fff", fontSize: 12.5 }} className="text-center">{repProgress.reason}</span>
                <button onClick={retryCurrentRep} className="rounded-full px-5 py-2.5" style={{ background: C.teal }}>
                  <span style={{ ...fontBody, color: "#fff", fontSize: 13, fontWeight: 700 }}>Reintentar esta repetición</span>
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {phase === "recording" && completedReps.length > 0 && (
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div style={{ ...fontDisplay, color: C.text, fontSize: 13.5, fontWeight: 600 }} className="mb-2">Repeticiones registradas</div>
          <div className="flex items-center gap-1.5">
            {Array.from({ length: SIT_TO_STAND_THRESHOLDS.repsRequired }).map((_, i) => (
              <div
                key={i}
                className="flex-1 rounded-full"
                style={{ height: 6, background: i < completedReps.length ? C.teal : C.line }}
              />
            ))}
          </div>
        </div>
      )}

      {showCamera && phase !== "recording" && (
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>          <div style={{ ...fontDisplay, color: C.text, fontSize: 13.5, fontWeight: 600 }} className="mb-2">Calidad de captura</div>
          <CaptureQualityIndicator status={bodyStatus} />
        </div>
      )}

      {phase === "error" && (
        <div className="rounded-2xl p-5 space-y-3" style={{ background: C.coralSoft }}>
          <div className="flex items-center gap-2">
            <AlertCircle size={18} color={C.coral} />
            <span style={{ ...fontBody, color: C.coral, fontSize: 13.5 }}>{errorMessage || "No se pudo completar la captura real."}</span>
          </div>
          <button onClick={() => setUseDemoFallback(true)} className="w-full rounded-xl py-3" style={{ background: C.ink }}>
            <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Usar demostración</span>
          </button>
        </div>
      )}

      {phase === "completed" && result && (
        <RealSitToStandResult assessment={result} onSave={handleSave} saved={saved} onContinue={onContinue} />
      )}
    </div>
  );
}

/* ============================================================
   COMPONENTES DE CAPTURA REAL — CMJ (Countermovement Jump)
   ============================================================
   Segunda prueba con captura real, además de Sit-to-Stand — mismo
   patrón exacto (RealCameraCapture/PoseDetectionOverlay/
   CaptureQualityIndicator/loadPoseModel/detectBody/buildCaptureQuality
   reutilizados sin cambios), adaptado a 3 fases por salto en vez de 4:
   STANDING → DESCENDING (contramovimiento) → AIRBORNE (vuelo) → de
   vuelta a STANDING (aterrizaje confirmado, salto finalizado).
   A diferencia de Sit-to-Stand, no hay una "vieja" pantalla DEMO
   previa que reutilizar — el respaldo si la cámara falla se genera
   aquí mismo (analyzeDemoCmj) y se muestra con el MISMO componente de
   resultado, marcado con DemoTag. */

function CmjJumpBars({ jumps }) {
  const max = Math.max(...jumps.map((j) => j.jumpHeight), 1);
  return (
    <div className="space-y-2">
      {jumps.map((j) => (
        <div key={j.jumpNumber} className="flex items-center gap-2">
          <span style={{ ...fontMono, color: C.inkFaint, fontSize: 11, width: 52 }}>Salto {j.jumpNumber}</span>
          <div className="flex-1 rounded-full overflow-hidden" style={{ background: C.paper, height: 8 }}>
            <div style={{ width: `${Math.max(4, Math.round((j.jumpHeight / max) * 100))}%`, height: "100%", background: C.teal, borderRadius: 999 }} />
          </div>
          <DataValue value={j.jumpHeight} unit="cm" size={13} />
        </div>
      ))}
    </div>
  );
}

function CmjResult({ assessment, onSave, saved, onContinue }) {
  const byVar = (variable) => assessment.measurements.find((m) => m.variable === variable);
  const bestM = byVar("cmj_jump_height_best");
  const meanM = byVar("cmj_jump_height_mean");
  const consistencyM = byVar("cmj_height_consistency");
  const jumps = assessment.reps || [];
  const isDemo = assessment.measurements.some((m) => m.isDemo);
  const consistency = consistencyM?.value != null ? +(100 - consistencyM.value).toFixed(1) : null;
  const q = assessment.captureQuality || {};
  const date = new Date(assessment.timestamp).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });

  return (
    <div className="space-y-3">
      <div className="rounded-2xl p-5" style={{ background: C.ink }}>
        <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 12 }}>{CMJ_TEST.name} · 3 saltos</div>
        <div style={{ ...fontDisplay, color: "#fff", fontSize: 16, fontWeight: 600 }} className="mt-1">Mejor salto</div>
        <div className="mt-2"><DataValue value={bestM?.value ?? "—"} unit="cm" size={32} color="#fff" /></div>
        <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 12 }} className="mt-2">{date}</div>
        <div className="grid grid-cols-2 gap-2 mt-4">
          <div>
            <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 10.5 }}>Altura media</div>
            <DataValue value={meanM?.value ?? "—"} unit="cm" size={18} color="#fff" />
          </div>
          <div>
            <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 10.5 }}>Consistencia</div>
            <DataValue value={consistency ?? "—"} unit={consistency != null ? "%" : ""} size={18} color="#fff" />
          </div>
        </div>
      </div>

      {isDemo && <DemoTag label="Resultado de demostración" />}

      {jumps.length > 0 && (
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }} className="mb-3">Altura por salto</div>
          <CmjJumpBars jumps={jumps} />
        </div>
      )}

      <div className="rounded-2xl p-4 space-y-2" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div className="flex items-center justify-between">
          <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Medición mediante cámara</span>
        </div>
        {!isDemo && (
          <>
            <div className="flex items-center justify-between">
              <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Calidad de captura</span>
              <span style={{ ...fontBody, color: C.text, fontSize: 12.5 }}>
                {q.overall != null ? `${Math.round(q.overall * 100)}%` : "No disponible"}
              </span>
            </div>
            <div className="flex items-center justify-between">
              <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Frames válidos</span>
              <span style={{ ...fontBody, color: C.text, fontSize: 12.5 }}>{q.validFrames ?? "—"}</span>
            </div>
            <div className="flex items-center justify-between">
              <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Frames perdidos</span>
              <span style={{ ...fontBody, color: C.text, fontSize: 12.5 }}>{q.lostFrames ?? "—"}</span>
            </div>
          </>
        )}
        <div className="flex items-center justify-between">
          <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Estado</span>
          <span style={{ ...fontMono, color: getValidationStatusStyle(bestM?.validationStatus || (isDemo ? "DEMO" : "RESEARCH")).color, fontSize: 11, fontWeight: 600 }} className="uppercase tracking-wide">
            {isDemo ? "Demostración" : "Investigación"}
          </span>
        </div>
        {!isDemo && (
          <div className="flex items-center justify-between">
            <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Error propio de Kinesis</span>
            <span style={{ ...fontBody, color: C.inkFaint, fontSize: 12.5 }}>Todavía no establecido</span>
          </div>
        )}
        {q.warnings?.length > 0 && (
          <div className="pt-1 space-y-1">
            {q.warnings.map((w) => (
              <div key={w} className="flex items-center gap-1.5">
                <AlertCircle size={12} color={C.amber} />
                <span style={{ ...fontBody, color: C.amber, fontSize: 11.5 }}>{w}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <MeasurementEvidenceCard
        measurement={bestM}
        validationProfile={{ variable: bestM?.variable, validationStatus: bestM?.validationStatus }}
        references={[]}
        explanation="La altura de salto se calcula por tiempo de vuelo real (tiempo entre despegue y aterrizaje, detectado por la posición de los tobillos): altura = 9,81 × tiempo² / 8. No requiere calibrar la distancia a la cámara — solo el tiempo, medido con precisión real."
      />

      <p style={{ ...fontBody, color: C.inkFaint, fontSize: 11.5, lineHeight: 1.6 }} className="px-1">
        Esta medición no está clínicamente validada.
      </p>

      {!saved ? (
        <button onClick={onSave} className="w-full rounded-xl py-3.5" style={{ background: C.teal }}>
          <span style={{ ...fontBody, color: "#04150D", fontSize: 14, fontWeight: 700 }}>Guardar evaluación</span>
        </button>
      ) : (
        <>
          <div className="w-full rounded-xl py-3 flex items-center justify-center gap-2" style={{ background: C.tealSoft }}>
            <Check size={16} color={C.teal} />
            <span style={{ ...fontBody, color: C.teal, fontSize: 14, fontWeight: 600 }}>Evaluación guardada</span>
          </div>
          <button onClick={onContinue} className="w-full flex items-center justify-center gap-2 rounded-xl py-3.5" style={{ background: C.ink }}>
            <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Continuar</span>
            <ChevronRight size={16} color="#fff" />
          </button>
        </>
      )}
    </div>
  );
}

const CMJ_STAGE_LABELS = { STANDING: "De pie", DESCENDING: "Contramovimiento", AIRBORNE: "En el aire" };

function RealCmjFlow({ onSave, onContinue, onAbort }) {
  const [phase, setPhase] = useState("instructions");
  const [errorMessage, setErrorMessage] = useState("");
  const [bodyStatus, setBodyStatus] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [result, setResult] = useState(null);
  const [saved, setSaved] = useState(false);
  const [jumpProgress, setJumpProgress] = useState({ index: 1, total: CMJ_THRESHOLDS.jumpsRequired, stage: "STANDING", invalid: false, reason: null });
  const [completedJumps, setCompletedJumps] = useState([]);
  const [cameraFacingMode] = useState("user");

  const videoRef = useRef(null);
  const landmarksRef = useRef(null);
  const landmarkerRef = useRef(null);
  const rafRef = useRef(null);
  const phaseRef = useRef(phase);
  const historyRef = useRef([]);
  const qualitySamplesRef = useRef([]);
  const frameCountersRef = useRef({ total: 0, valid: 0, lost: 0 });
  const cameraJitterRef = useRef([]);
  const prevShoulderMidRef = useRef(null);
  const sendingRef = useRef(false);
  const stageRef = useRef("STANDING");
  const stableSearchCountRef = useRef(0);
  const lastUiUpdateRef = useRef(0);
  const jumpIndexRef = useRef(1);
  const validJumpsRef = useRef([]);
  const currentJumpRef = useRef({ jumpNumber: 1, descentStartTime: null, takeoffTime: null, landingTime: null });
  const standingHipYRef = useRef(null);
  const standingAnkleYRef = useRef(null);
  const criticalLostStreakRef = useRef(0);
  const phaseStartRef = useRef(null);
  const transitionsRef = useRef([]);
  const testStartTimeRef = useRef(null);
  const testEndTimeRef = useRef(null);
  const readyTimeoutRef = useRef(null);
  const unmountedRef = useRef(false);

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const cleanupLoop = () => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = null;
  };
  useEffect(() => () => {
    unmountedRef.current = true;
    cleanupLoop();
    clearTimeout(readyTimeoutRef.current);
  }, []);

  const goToDemo = (message) => {
    cleanupLoop();
    if (message) setErrorMessage(message);
    setPhase("error");
  };

  // Genera un resultado DEMO y lo muestra con el MISMO CmjResult
  // (marcado con DemoTag) — no hay una pantalla DEMO previa que
  // reutilizar para esta prueba, a diferencia de Sit-to-Stand.
  const applyDemoResult = () => {
    cleanupLoop();
    const assessmentId = `assessment_${Date.now()}`;
    const raw = analyzeDemoCmj();
    const measurements = buildMeasurements({ assessmentId, testId: CMJ_TEST.id, raw, source: "camera", isDemo: true });
    const assessment = {
      id: assessmentId, testId: CMJ_TEST.id, timestamp: new Date().toISOString(), status: "completed",
      captures: [], reps: null, captureQuality: null, measurements,
    };
    setResult(assessment);
    setPhase("completed");
  };

  const resetJumpAttempt = (startTimestamp) => {
    const lm = landmarksRef.current;
    stageRef.current = "STANDING";
    currentJumpRef.current = { jumpNumber: jumpIndexRef.current, descentStartTime: null, takeoffTime: null, landingTime: null };
    const hy = lm ? hipY(lm) : null;
    const ay = lm ? ankleY(lm) : null;
    historyRef.current = [{ t: startTimestamp, hipY: hy, ankleY: ay }];
    standingHipYRef.current = hy;
    standingAnkleYRef.current = ay;
    qualitySamplesRef.current = [];
    frameCountersRef.current = { total: 0, valid: 0, lost: 0 };
    criticalLostStreakRef.current = 0;
    phaseStartRef.current = startTimestamp;
    transitionsRef.current = [];
    setJumpProgress({ index: jumpIndexRef.current, total: CMJ_THRESHOLDS.jumpsRequired, stage: "STANDING", invalid: false, reason: null });
  };

  const failJump = (reason) => {
    stageRef.current = "INVALID";
    setJumpProgress((p) => ({ ...p, invalid: true, reason }));
  };

  const retryCurrentJump = () => {
    resetJumpAttempt(performance.now());
  };

  const finalizeJump = (landingTime) => {
    const ev = currentJumpRef.current;
    const captureQuality = buildCaptureQuality({
      samples: qualitySamplesRef.current,
      frameCounters: frameCountersRef.current,
      cameraJitter: cameraJitterRef.current,
    });
    const flightTime = calculateSitToStandDuration(ev.takeoffTime, landingTime);
    const jump = {
      jumpNumber: ev.jumpNumber,
      descentStartTime: ev.descentStartTime,
      takeoffTime: ev.takeoffTime,
      landingTime,
      flightTime,
      jumpHeight: calculateCmjJumpHeight(flightTime),
      timeToTakeoff: calculateSitToStandDuration(ev.descentStartTime, ev.takeoffTime),
      quality: captureQuality.overall,
      valid: true,
      invalidReason: null,
      captureQuality,
      measurementQuality: captureQuality.modelConfidence,
      stateTransitions: transitionsRef.current,
    };
    validJumpsRef.current = [...validJumpsRef.current, jump];
    setCompletedJumps(validJumpsRef.current);

    if (validJumpsRef.current.length >= CMJ_THRESHOLDS.jumpsRequired) {
      cleanupLoop();
      testEndTimeRef.current = landingTime;
      const jumps = validJumpsRef.current;
      const heights = jumps.map((j) => j.jumpHeight);
      const best = Math.max(...heights);
      const mean = +(heights.reduce((a, b) => a + b, 0) / heights.length).toFixed(1);
      const consistency = calculateCmjConsistency(jumps);
      const aggQuality = aggregateRepCaptureQualities(jumps);
      const assessmentId = `assessment_${Date.now()}`;
      const measurements = createCmjScientificMeasurements({ assessmentId, testId: CMJ_TEST.id, best, mean, consistency, aggQuality });
      const assessment = {
        id: assessmentId, testId: CMJ_TEST.id, timestamp: new Date().toISOString(), status: "completed",
        captures: [], reps: jumps, captureQuality: aggQuality, measurements,
      };
      setResult(assessment);
      setPhase("completed");
      return;
    }

    jumpIndexRef.current += 1;
    resetJumpAttempt(landingTime);
  };

  const STILL_PHASES = ["body_searching", "body_detected", "ready_to_start"];
  const CRITICAL_STAGES = ["DESCENDING", "AIRBORNE"];

  const processFrame = (lm) => {
    const currentPhase = phaseRef.current;
    const now = performance.now();
    landmarksRef.current = lm;

    const status = detectBody(lm);
    const framing = lm ? computeFramingQuality(lm) : null;
    const stage = stageRef.current;

    if (currentPhase === "recording" && stage !== "INVALID") {
      frameCountersRef.current.total += 1;
      const isValidFrame = status.detected && status.bodyFullyVisible;
      if (isValidFrame) {
        frameCountersRef.current.valid += 1;
        criticalLostStreakRef.current = 0;
      } else {
        frameCountersRef.current.lost += 1;
        if (CRITICAL_STAGES.includes(stage)) {
          criticalLostStreakRef.current += 1;
          if (criticalLostStreakRef.current >= CMJ_THRESHOLDS.maxCriticalLostFrames) {
            failJump("Cuerpo no detectado durante el salto");
          }
        }
      }

      qualitySamplesRef.current.push({ ...status, framing });
      if (qualitySamplesRef.current.length > 600) qualitySamplesRef.current.shift();

      if (lm) {
        historyRef.current.push({ t: now, hipY: hipY(lm), ankleY: ankleY(lm) });
        if (historyRef.current.length > 300) historyRef.current.shift();
      }
    }

    if (lm && STILL_PHASES.includes(currentPhase)) {
      const mid = shoulderMid(lm);
      const prevMid = prevShoulderMidRef.current;
      if (mid && prevMid) {
        const dx = mid.x - prevMid.x, dy = mid.y - prevMid.y;
        cameraJitterRef.current.push(Math.sqrt(dx * dx + dy * dy));
        if (cameraJitterRef.current.length > 90) cameraJitterRef.current.shift();
      }
      prevShoulderMidRef.current = mid;
    } else if (!lm) {
      prevShoulderMidRef.current = null;
    }

    if (now - lastUiUpdateRef.current > 200) {
      lastUiUpdateRef.current = now;
      setBodyStatus({ ...status, framing });
      if (currentPhase === "recording" && currentJumpRef.current.descentStartTime != null) {
        setElapsed(+((now - currentJumpRef.current.descentStartTime) / 1000).toFixed(1));
      } else if (currentPhase === "recording") {
        setElapsed(0);
      }
    }

    if (currentPhase === "body_searching") {
      stableSearchCountRef.current = status.bodyFullyVisible && status.detected ? stableSearchCountRef.current + 1 : 0;
      if (stableSearchCountRef.current >= CMJ_THRESHOLDS.stabilityFrames) {
        setPhase("body_detected");
      }
      return;
    }

    if (currentPhase !== "recording" || stage === "INVALID" || !lm) return;

    // Máquina de 3 fases: STANDING → DESCENDING → AIRBORNE → (vuelta a
    // STANDING al aterrizar, salto finalizado). Sin fase "de pie tras el
    // contramovimiento" intermedia: en cuanto los tobillos despegan del
    // suelo pasa directamente a AIRBORNE.
    if (stage === "STANDING") {
      if (detectCmjDescentStart(historyRef.current, standingHipYRef.current)) {
        stageRef.current = "DESCENDING";
        currentJumpRef.current.descentStartTime = now;
        phaseStartRef.current = now;
        transitionsRef.current.push({ stage: "DESCENDING", t: now });
        setJumpProgress((p) => ({ ...p, stage: "DESCENDING" }));
      } else if (now - phaseStartRef.current > CMJ_THRESHOLDS.maxStandingWaitMs) {
        failJump("No se detectó el inicio del salto. Colócate de perfil, cuerpo completo, y flexiona bien las rodillas antes de saltar.");
      }
    } else if (stage === "DESCENDING") {
      if (detectCmjTakeoff(historyRef.current, standingAnkleYRef.current)) {
        stageRef.current = "AIRBORNE";
        currentJumpRef.current.takeoffTime = now;
        phaseStartRef.current = now;
        transitionsRef.current.push({ stage: "AIRBORNE", t: now });
        setJumpProgress((p) => ({ ...p, stage: "AIRBORNE" }));
      } else if (now - phaseStartRef.current > CMJ_THRESHOLDS.maxPhaseDurationMs) {
        failJump("Despegue no detectado");
      }
    } else if (stage === "AIRBORNE") {
      if (detectCmjLanding(historyRef.current, standingAnkleYRef.current)) {
        stageRef.current = "STANDING";
        transitionsRef.current.push({ stage: "LANDED", t: now });
        finalizeJump(now);
      } else if (now - phaseStartRef.current > CMJ_THRESHOLDS.maxPhaseDurationMs) {
        failJump("Aterrizaje no detectado");
      }
    }
  };

  const runDetectionLoop = () => {
    const pose = landmarkerRef.current;
    if (!pose) return;
    pose.onResults((results) => processFrame(results?.poseLandmarks || null));

    const pushFrame = async () => {
      if (rafRef.current === null) return;
      const video = videoRef.current;
      const currentPhase = phaseRef.current;
      if (video && video.readyState >= 2 && currentPhase !== "completed" && currentPhase !== "error" && !sendingRef.current) {
        sendingRef.current = true;
        try {
          await pose.send({ image: video });
        } catch {
          processFrame(null);
        } finally {
          sendingRef.current = false;
        }
      }
      if (rafRef.current !== null) rafRef.current = requestAnimationFrame(pushFrame);
    };
    rafRef.current = requestAnimationFrame(pushFrame);
  };

  const beginCapture = async () => {
    setPhase("camera_permission");
    try {
      const pose = await loadPoseModel();
      landmarkerRef.current = pose;
    } catch (err) {
      console.error("Fallo al cargar el motor de pose:", err);
      const detail = err?.message ? ` (${err.message})` : "";
      goToDemo(`No se pudo cargar el motor de detección de pose${detail}. Puedes usar la demostración.`);
    }
  };

  const onCameraReady = () => {
    if (phaseRef.current === "error" || unmountedRef.current) return;
    setPhase("camera_ready");
    readyTimeoutRef.current = setTimeout(() => {
      if (unmountedRef.current || phaseRef.current === "error") return;
      setPhase("body_searching");
      stableSearchCountRef.current = 0;
      runDetectionLoop();
    }, 200);
  };

  const onCameraError = (err) => {
    const detail = err?.message ? ` (${err.message})` : "";
    goToDemo(`No se pudo acceder a la cámara${detail}. Comprueba los permisos o usa la demostración.`);
  };

  useEffect(() => {
    if (phase !== "body_detected") return undefined;
    const t = setTimeout(() => setPhase("ready_to_start"), 500);
    return () => clearTimeout(t);
  }, [phase]);

  const handleStart = () => {
    const now = performance.now();
    testStartTimeRef.current = now;
    testEndTimeRef.current = null;
    jumpIndexRef.current = 1;
    validJumpsRef.current = [];
    setCompletedJumps([]);
    resetJumpAttempt(now);
    setElapsed(0);
    setPhase("recording");
  };

  const handleSave = () => {
    onSave(result);
    setSaved(true);
  };

  const showCamera = ["camera_ready", "body_searching", "body_detected", "ready_to_start", "recording"].includes(phase);

  return (
    <div className="space-y-4">
      {phase !== "completed" && (
        <div className="flex items-center justify-between">
          <button onClick={onAbort} className="flex items-center gap-1.5 rounded-full px-3 py-1.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <ChevronLeft size={15} color={C.inkSoft} />
            <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Abandonar</span>
          </button>
          <button onClick={applyDemoResult} className="rounded-full px-3 py-1.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5, fontWeight: 600 }}>Usar demostración</span>
          </button>
        </div>
      )}

      {phase === "instructions" && (
        <div className="space-y-3">
          <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div style={{ ...fontDisplay, color: C.text, fontSize: 16, fontWeight: 600 }}>{CMJ_TEST.name} — captura real</div>
            <div className="rounded-lg p-3 mt-3 flex items-start gap-2" style={{ background: C.paper }}>
              <Info size={15} color={C.inkSoft} className="mt-0.5 shrink-0" />
              <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5, lineHeight: 1.5 }}>
                La altura se calcula por tiempo de vuelo real mediante estimación de pose en tu
                dispositivo — no se graba ni se sube ningún vídeo.
              </span>
            </div>
            <ul className="space-y-2 mt-3">
              {CMJ_TEST.protocol.instructions.map((t) => (
                <li key={t} className="flex items-start gap-2">
                  <Check size={14} color={C.teal} className="mt-0.5 shrink-0" />
                  <span style={{ ...fontBody, color: C.inkSoft, fontSize: 13.5 }}>{t}</span>
                </li>
              ))}
            </ul>
          </div>
          <button onClick={beginCapture} className="w-full flex items-center justify-center gap-2 rounded-xl py-3.5" style={{ background: C.teal }}>
            <span style={{ ...fontBody, color: "#04150D", fontSize: 14, fontWeight: 700 }}>Activar cámara</span>
            <ChevronRight size={16} color="#04150D" />
          </button>
        </div>
      )}

      {phase === "camera_permission" && !showCamera && (
        <div className="rounded-2xl p-8 flex flex-col items-center gap-3" style={{ background: C.ink }}>
          <Loader2 size={24} className="animate-spin" color={C.teal} />
          <span style={{ ...fontBody, color: "#fff", fontSize: 14 }}>Solicitando acceso a la cámara…</span>
        </div>
      )}

      {(phase === "camera_permission" || showCamera) && (
        <div
          className="relative rounded-2xl overflow-hidden"
          style={{ aspectRatio: "4/5", background: C.ink, display: phase === "camera_permission" && !showCamera ? "none" : "block" }}
        >
          <RealCameraCapture videoRef={videoRef} active={true} onReady={onCameraReady} onError={onCameraError} facingMode={cameraFacingMode} />
          <PoseDetectionOverlay landmarksRef={landmarksRef} />

          <div className="absolute inset-x-0 top-0 p-3 flex justify-between items-start">
            <span style={{ ...fontMono, color: "#fff", fontSize: 10, background: "rgba(0,0,0,0.4)" }} className="px-2 py-1 rounded uppercase tracking-wide">
              {phase.replace(/_/g, " ")}
            </span>
          </div>

          <div className="absolute inset-x-0 bottom-0 p-4 flex flex-col items-center gap-2" style={{ background: "linear-gradient(transparent, rgba(0,0,0,0.55))" }}>
            {phase === "camera_ready" && (
              <span style={{ ...fontBody, color: "#fff", fontSize: 13 }}>Colócate de perfil, cuerpo completo</span>
            )}
            {phase === "body_searching" && (
              <span style={{ ...fontBody, color: "#fff", fontSize: 13 }} className="flex items-center gap-2">
                <Loader2 size={14} className="animate-spin" /> Buscando persona…
              </span>
            )}
            {phase === "body_detected" && (
              <span style={{ ...fontMono, color: C.teal, fontSize: 13, fontWeight: 600 }} className="flex items-center gap-2">
                <Check size={16} /> Persona detectada
              </span>
            )}
            {phase === "ready_to_start" && (
              <button onClick={handleStart} className="rounded-full px-6 py-3" style={{ background: C.teal }}>
                <span style={{ ...fontBody, color: "#04150D", fontSize: 14, fontWeight: 700 }}>INICIAR</span>
              </button>
            )}
            {phase === "recording" && !jumpProgress.invalid && (
              <div className="flex flex-col items-center gap-1.5">
                <span style={{ ...fontMono, color: "#fff", fontSize: 12, fontWeight: 600 }} className="uppercase tracking-wide">
                  Salto {jumpProgress.index}/{jumpProgress.total} · {CMJ_STAGE_LABELS[jumpProgress.stage] || jumpProgress.stage}
                </span>
                <span style={{ ...fontMono, color: C.teal, fontSize: 28, fontWeight: 600 }}>{elapsed.toFixed(1)}s</span>
              </div>
            )}
            {phase === "recording" && jumpProgress.invalid && (
              <div className="flex flex-col items-center gap-2 w-full">
                <span style={{ ...fontMono, color: "#fff", fontSize: 12, fontWeight: 600 }} className="flex items-center gap-1.5">
                  <AlertCircle size={14} color={C.coral} /> Salto no válido
                </span>
                <span style={{ ...fontBody, color: "#fff", fontSize: 12.5 }} className="text-center">{jumpProgress.reason}</span>
                <button onClick={retryCurrentJump} className="rounded-full px-5 py-2.5" style={{ background: C.teal }}>
                  <span style={{ ...fontBody, color: "#04150D", fontSize: 13, fontWeight: 700 }}>Reintentar este salto</span>
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {phase === "recording" && completedJumps.length > 0 && (
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div style={{ ...fontDisplay, color: C.text, fontSize: 13.5, fontWeight: 600 }} className="mb-2">Saltos registrados</div>
          <div className="flex items-center gap-1.5">
            {Array.from({ length: CMJ_THRESHOLDS.jumpsRequired }).map((_, i) => (
              <div key={i} className="flex-1 rounded-full" style={{ height: 6, background: i < completedJumps.length ? C.teal : C.line }} />
            ))}
          </div>
        </div>
      )}

      {showCamera && phase !== "recording" && (
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div style={{ ...fontDisplay, color: C.text, fontSize: 13.5, fontWeight: 600 }} className="mb-2">Calidad de captura</div>
          <CaptureQualityIndicator status={bodyStatus} />
        </div>
      )}

      {phase === "error" && (
        <div className="rounded-2xl p-5 space-y-3" style={{ background: C.coralSoft }}>
          <div className="flex items-center gap-2">
            <AlertCircle size={18} color={C.coral} />
            <span style={{ ...fontBody, color: C.coral, fontSize: 13.5 }}>{errorMessage || "No se pudo completar la captura real."}</span>
          </div>
          <button onClick={applyDemoResult} className="w-full rounded-xl py-3" style={{ background: C.ink }}>
            <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Usar demostración</span>
          </button>
        </div>
      )}

      {phase === "completed" && result && (
        <CmjResult assessment={result} onSave={handleSave} saved={saved} onContinue={onContinue} />
      )}
    </div>
  );
}

/* ============================================================
   COMPONENTES DE CAPTURA REAL — Salto unipodal (comparación L/D)
   ============================================================
   Tercera prueba con captura real. Reutiliza la máquina de detección
   del CMJ tal cual (detectCmjDescentStart/detectCmjTakeoff/
   detectCmjLanding/calculateCmjJumpHeight) — la única diferencia es
   qué tobillo se seguía (el de apoyo, no el promedio de ambos) y que
   hay dos fases "prepárate" con confirmación manual: el atleta debe
   estar YA equilibrado sobre una pierna, con la otra flexionada, antes
   de que se fije el tobillo de referencia — si no, detectStanceAnkleIndex
   podría fijar el tobillo equivocado por un simple apoyo bipodal momentáneo. */

const SLJ_SIDES = ["right", "left"];
const SLJ_SIDE_LABELS = { right: "pierna derecha", left: "pierna izquierda" };

function SingleLegJumpResult({ assessment, onSave, saved, onContinue }) {

  const rightM = byVar("single_leg_jump_height_right");
  const leftM = byVar("single_leg_jump_height_left");
  const asymmetryM = byVar("single_leg_asymmetry_index");
  const isDemo = assessment.measurements.some((m) => m.isDemo);

  const date = new Date(assessment.timestamp).toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
  const strongerSide = (rightM?.value ?? 0) >= (leftM?.value ?? 0) ? "derecha" : "izquierda";

  return (
    <div className="space-y-3">

        <div style={{ ...fontDisplay, color: "#fff", fontSize: 16, fontWeight: 600 }} className="mt-1">Asimetría entre piernas</div>
        <div className="mt-2"><DataValue value={asymmetryM?.value ?? "—"} unit={asymmetryM?.value != null ? "%" : ""} size={32} color="#fff" /></div>
        <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 12 }} className="mt-2">{date} · lado más fuerte: {strongerSide}</div>
      </div>

      {isDemo && <DemoTag label="Resultado de demostración" />}

      <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }} className="mb-3">Altura por pierna</div>
        <CompareBar label="Salto unipodal" right={rightM?.value ?? 0} left={leftM?.value ?? 0} unit="cm" />
      </div>

      <div className="rounded-2xl p-4 space-y-2" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div className="flex items-center justify-between">
          <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Medición mediante cámara</span>
        </div>
        {!isDemo && (
          <>
            <div className="flex items-center justify-between">
              <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Calidad de captura</span>
              <span style={{ ...fontBody, color: C.text, fontSize: 12.5 }}>
                {q.overall != null ? `${Math.round(q.overall * 100)}%` : "No disponible"}
              </span>
            </div>
            <div className="flex items-center justify-between">
              <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Frames perdidos</span>
              <span style={{ ...fontBody, color: C.text, fontSize: 12.5 }}>{q.lostFrames ?? "—"}</span>
            </div>
          </>
        )}
        <div className="flex items-center justify-between">
          <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Estado</span>
          <span style={{ ...fontMono, color: getValidationStatusStyle(rightM?.validationStatus || (isDemo ? "DEMO" : "RESEARCH")).color, fontSize: 11, fontWeight: 600 }} className="uppercase tracking-wide">
            {isDemo ? "Demostración" : "Investigación"}
          </span>
        </div>
        {!isDemo && (
          <div className="flex items-center justify-between">
            <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Error propio de Kinesis</span>
            <span style={{ ...fontBody, color: C.inkFaint, fontSize: 12.5 }}>Todavía no establecido</span>
          </div>
        )}
      </div>

      <MeasurementEvidenceCard
        measurement={asymmetryM}
        validationProfile={{ variable: asymmetryM?.variable, validationStatus: asymmetryM?.validationStatus }}
        references={[]}
        explanation="Cada pierna se mide por separado con el mismo método de tiempo de vuelo que el CMJ bipodal, siguiendo el tobillo de la pierna de apoyo. La asimetría es |derecha − izquierda| / la mayor de las dos × 100 — 0% sería simetría perfecta."
      />

      <p style={{ ...fontBody, color: C.inkFaint, fontSize: 11.5, lineHeight: 1.6 }} className="px-1">
        Esta medición no está clínicamente validada.
      </p>

      {!saved ? (
        <button onClick={onSave} className="w-full rounded-xl py-3.5" style={{ background: C.teal }}>
          <span style={{ ...fontBody, color: "#04150D", fontSize: 14, fontWeight: 700 }}>Guardar evaluación</span>
        </button>
      ) : (
        <>
          <div className="w-full rounded-xl py-3 flex items-center justify-center gap-2" style={{ background: C.tealSoft }}>
            <Check size={16} color={C.teal} />
            <span style={{ ...fontBody, color: C.teal, fontSize: 14, fontWeight: 600 }}>Evaluación guardada</span>
          </div>
          <button onClick={onContinue} className="w-full flex items-center justify-center gap-2 rounded-xl py-3.5" style={{ background: C.ink }}>
            <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Continuar</span>
            <ChevronRight size={16} color="#fff" />
