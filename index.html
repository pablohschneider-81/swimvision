<title>Ondrift</title>
<style>
  :root {
    --bg: #c0d2e0;
    --surface: rgba(255,255,255,0.45);
    --surface2: rgba(255,255,255,0.30);
    --accent: #2980b9;
    --accent2: #1a6fa8;
    --red: #c0392b;
    --red2: #a93226;
    --text: #1a2a3a;
    --text2: #4a6a8a;
    --text3: #7a9ab8;
    --green: #1e8449;
    --yellow: #b7770d;
    --orange: #c0621a;
    --border: rgba(255,255,255,0.75);
    --border2: rgba(100,150,190,0.2);
    --gold: #c8920a;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.28) 50%, rgba(180,215,240,0.22) 100%);
    --glass-shadow: 0 4px 24px rgba(100,140,180,0.18), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(100,140,180,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  body { background: var(--bg); background-image: radial-gradient(ellipse at 15% 15%, rgba(150,200,240,0.68) 0%, transparent 55%), radial-gradient(ellipse at 85% 80%, rgba(170,220,195,0.62) 0%, transparent 65%), radial-gradient(ellipse at 55% 5%, rgba(220,210,170,0.3) 0%, transparent 45%), radial-gradient(ellipse at 88% 12%, rgba(150,200,240,0.52) 0%, transparent 60%); background-attachment: fixed; color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  #app { width: 100%; max-width: 480px; min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-bottom: 70px; background: transparent; padding-top: env(safe-area-inset-top, 0px); }
  /* En modo PWA (pantalla completa), respetar notch y barra inferior */
  @media all and (display-mode: standalone) {
    #app { padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  }

  /* ── NEON KEYFRAMES ── */
  @keyframes neon-pulse { 0%,100%{box-shadow:0 0 6px 1px rgba(52,152,219,0.5),0 0 18px 2px rgba(52,152,219,0.2)} 50%{box-shadow:0 0 10px 2px rgba(52,152,219,0.8),0 0 28px 6px rgba(52,152,219,0.35)} }
  @keyframes neon-pulse-gold { 0%,100%{box-shadow:0 0 6px 1px rgba(240,192,64,0.5),0 0 18px 2px rgba(240,192,64,0.2)} 50%{box-shadow:0 0 10px 2px rgba(240,192,64,0.8),0 0 28px 6px rgba(240,192,64,0.35)} }
  @keyframes neon-pulse-red { 0%,100%{box-shadow:0 0 6px 1px rgba(231,76,60,0.5),0 0 18px 2px rgba(231,76,60,0.2)} 50%{box-shadow:0 0 10px 2px rgba(231,76,60,0.8),0 0 28px 6px rgba(231,76,60,0.35)} }
  @keyframes grid-scroll { from{transform:perspective(600px) rotateX(40deg) translateY(0)} to{transform:perspective(600px) rotateX(40deg) translateY(60px)} }
  @keyframes pin-pulse { 0%{transform:scale(1);box-shadow:0 0 0 0 rgba(52,152,219,0.6)} 60%{transform:scale(0.93);box-shadow:0 0 0 12px rgba(52,152,219,0)} 100%{transform:scale(1);box-shadow:0 0 0 0 rgba(52,152,219,0)} }
  @keyframes logo-glow { 0%,100%{text-shadow:0 0 8px rgba(52,219,180,0.5),0 0 24px rgba(52,219,180,0.2)} 50%{text-shadow:0 0 16px rgba(52,219,180,0.9),0 0 40px rgba(52,219,180,0.35)} }

  /* LOGIN */
  .login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; gap: 32px;
    position: relative; overflow: hidden;
    background: linear-gradient(160deg, #d8e4ec 0%, #e2edf4 35%, #e8f0ea 65%, #e0eaf2 100%);
  }
  .login-screen::before { display: none; }
  .login-screen::after { display: none; }
  /* ONDAS DE AGUA */
  .login-wave { position: absolute; bottom: 0; left: -10%; width: 120%; pointer-events: none; z-index: 0; }
  .login-wave svg { display: block; width: 100%; }
  .login-wave.w1 { bottom: -10px; animation: wave-drift 7s ease-in-out infinite; opacity: 0.35; }
  .login-wave.w2 { bottom: -20px; animation: wave-drift2 9s ease-in-out infinite; opacity: 0.25; }
  .login-wave.w3 { bottom: -5px; animation: wave-drift 11s ease-in-out infinite reverse; opacity: 0.18; }
  /* BURBUJAS */
  .login-bubble { position: absolute; border-radius: 50%; aspect-ratio: 1; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.25) 50%, rgba(200,225,245,0.15) 100%); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 0 0 8px rgba(255,255,255,0.4), 0 2px 8px rgba(150,190,220,0.2); animation: bubble-rise linear infinite; pointer-events: none; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  /* LOGO */
  .login-logo { animation: logo-drop 0.9s cubic-bezier(0.22,1,0.36,1) both; z-index: 1; text-align: center; }
  /* CARD */
  .login-card { animation: card-rise 0.8s cubic-bezier(0.22,1,0.36,1) 0.25s both; z-index: 1; }
  /* SHIMMER en TERRASSA */
  .login-logo-terrassa {
    display: block;
    font-family: 'Exo 2', sans-serif;
    font-size: 2.8rem; font-weight: 900; font-style: italic;
    letter-spacing: 1px; line-height: 1;
    background: linear-gradient(90deg, #5a0000 10%, #c0392b 30%, #ff1a1a 48%, #ff4444 52%, #c0392b 70%, #5a0000 90%);
    background-size: 300% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer-move 3s linear infinite;
  }
  .login-logo {
    font-family: 'Exo 2', sans-serif;
    font-size: 1.1rem; font-weight: 700; letter-spacing: 4px;
    color: #1a4a6a; text-transform: uppercase; text-align: center;
    position: relative; z-index: 1;
    font-size: 0.85rem; letter-spacing: 5px; font-weight: 600;
    text-shadow: 0 1px 3px rgba(255,255,255,0.5);
  }
  .login-logo span {
    display: block;
    font-family: 'Exo 2', sans-serif;
    font-size: 2.8rem; font-weight: 900; font-style: italic;
    letter-spacing: 1px; line-height: 1;
  }
  .login-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.35) 100%);
    border: 1px solid rgba(255,255,255,0.82);
    border-top: 1px solid rgba(255,255,255,0.92);
    border-radius: 16px; padding: 24px; width: 100%;
    position: relative; z-index: 1;
    box-shadow: 0 4px 24px rgba(100,140,180,0.2), inset 0 1px 0 rgba(255,255,255,0.9);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
  }
  .login-card h2 { font-size: 1rem; color: var(--text); font-weight: 700; margin-bottom: 16px; text-align: center; }
  .select-styled {
    width: 100%; background: rgba(255,255,255,0.65); border: 1px solid rgba(255,255,255,0.82);
    color: var(--text); padding: 12px 16px; border-radius: 10px; font-size: 1rem;
    outline: none; appearance: none; -webkit-appearance: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
  }
  .select-styled:focus { border-color: var(--accent2); box-shadow: 0 0 10px rgba(52,152,219,0.3); }

  /* BOTONES */
  .btn {
    display: block; width: 100%; padding: 14px; border-radius: 10px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    border: 1px solid transparent;
    position: relative; overflow: hidden;
    letter-spacing: 0.5px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #1a6fa8 0%, #2980b9 60%, #3498db 100%);
    color: #fff;
    border-color: rgba(52,152,219,0.6);
    box-shadow: 0 0 14px rgba(52,152,219,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
    animation: neon-pulse 2.8s ease-in-out infinite;
  }
  .btn-primary:active { transform: scale(0.97); box-shadow: 0 0 6px rgba(52,152,219,0.6); animation: none; }
  .btn-secondary {
    background: transparent;
    border: 1px solid rgba(52,152,219,0.3);
    color: var(--text2);
    box-shadow: 0 0 8px rgba(52,152,219,0.08);
  }
  .btn-secondary:active { transform: scale(0.97); border-color: var(--accent2); }

  /* LIQUID GLASS — LOGIN: selector de nombre y botones (solo dentro de .login-screen) */
  .login-screen .select-styled {
    appearance: none; -webkit-appearance: none;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 42%),
      linear-gradient(160deg, rgba(255,255,255,0.4) 0%, rgba(210,230,245,0.28) 60%, rgba(180,215,240,0.3) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%232a4a68' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 16px center;
    background-size: auto, auto, 14px 9px;
    border: 1.5px solid rgba(255,255,255,0.8);
    border-radius: 16px;
    backdrop-filter: blur(22px) saturate(190%);
    -webkit-backdrop-filter: blur(22px) saturate(190%);
    box-shadow:
      0 10px 26px rgba(60,110,160,0.20),
      inset 0 1.5px 0 rgba(255,255,255,0.95),
      inset 0 -10px 18px rgba(120,170,210,0.16);
  }
  .login-screen .btn-primary,
  .login-screen .btn-secondary {
    border-radius: 22px;
    border-width: 1.5px;
  }
  .login-screen .btn-primary {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(160deg, rgba(70,150,210,0.65) 0%, rgba(26,111,168,0.9) 100%);
    border-color: rgba(255,255,255,0.75);
    backdrop-filter: blur(18px) saturate(190%);
    -webkit-backdrop-filter: blur(18px) saturate(190%);
    box-shadow:
      0 12px 28px rgba(26,111,168,0.4),
      inset 0 1.5px 0 rgba(255,255,255,0.85),
      inset 0 -12px 18px rgba(10,60,100,0.35);
    animation: none;
  }
  .login-screen .btn-primary:active {
    box-shadow:
      0 4px 10px rgba(26,111,168,0.45),
      inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .login-screen .btn-secondary {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 45%),
      linear-gradient(160deg, rgba(255,255,255,0.3) 0%, rgba(190,220,240,0.28) 100%);
    border-color: rgba(255,255,255,0.75);
    color: var(--text);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    box-shadow:
      0 8px 20px rgba(60,110,160,0.18),
      inset 0 1.5px 0 rgba(255,255,255,0.9),
      inset 0 -10px 14px rgba(120,170,210,0.14);
  }

  .btn-danger {
    background: linear-gradient(135deg, #922b21 0%, #c0392b 60%, #e74c3c 100%);
    color: #fff;
    border-color: rgba(231,76,60,0.5);
    box-shadow: 0 0 14px rgba(231,76,60,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
    animation: neon-pulse-red 3s ease-in-out infinite;
  }
  .btn-danger:active { transform: scale(0.97); animation: none; }
  .btn-sm { padding: 8px 14px; font-size: 0.85rem; width: auto; display: inline-block; }

  /* PIN */
  .pin-screen { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 40px 24px; }
  .pin-dots { display: flex; gap: 16px; }
  .pin-dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--accent2);
    background: transparent;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .pin-dot.filled {
    background: var(--accent2);
    box-shadow: 0 0 10px rgba(52,152,219,0.7);
  }
  .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 280px; }
  .pin-btn {
    background: rgba(16,37,88,0.6);
    border: 1px solid rgba(52,152,219,0.3);
    color: #fff;
    font-size: 1.5rem; font-weight: 700;
    padding: 20px;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.12s, box-shadow 0.12s;
    text-align: center;
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 8px rgba(52,152,219,0.1);
  }
  .pin-btn:active {
    animation: pin-pulse 0.3s ease-out;
    background: rgba(41,128,185,0.4);
    box-shadow: 0 0 20px rgba(52,152,219,0.5);
  }
  .pin-error { color: var(--red2); font-size: 0.85rem; text-shadow: 0 0 8px rgba(231,76,60,0.5); }
  .pin-error { color: var(--red2); font-size: 0.85rem; }

  /* HEADER */
  .header {
    background: rgba(200,218,232,0.55);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border-bottom: 1px solid rgba(255,255,255,0.75);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(100,140,180,0.15), inset 0 1px 0 rgba(255,255,255,0.88);
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 0.72rem; font-weight: 800; letter-spacing: 2px; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; }
  .badge-coach {
    background: linear-gradient(135deg, #c9960a, #f0c040);
    color: #1a1000;
    box-shadow: 0 0 10px rgba(240,192,64,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    animation: neon-pulse-gold 3s ease-in-out infinite;
  }
  .badge-athlete {
    background: linear-gradient(135deg, #1a6fa8, #3498db);
    color: #fff;
    box-shadow: 0 0 10px rgba(52,152,219,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
    animation: neon-pulse 3s ease-in-out infinite;
  }
  .header-name { font-size: 0.95rem; font-weight: 700; color: var(--text); }
  .btn-exit { background: rgba(255,255,255,0.45); border: 1px solid rgba(100,140,180,0.35); color: var(--text); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-weight: 600; }

  /* NAV - píldora flotante glass, estilo Instagram */
  .bottom-nav {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 28px); max-width: 452px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 24px;
    box-shadow: 0 8px 28px rgba(30,60,100,0.25), inset 0 1px 0 rgba(255,255,255,0.9);
    display: flex; align-items: center; justify-content: space-around;
    padding: 7px 4px; z-index: 20;
    margin-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav-item {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 50%;
    border: none; background: transparent; cursor: pointer;
    color: var(--text2); transition: all 0.18s;
  }
  .nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item.active {
    color: #fff;
    background: linear-gradient(135deg, #1a6fa8, #3498db);
    box-shadow: 0 4px 14px rgba(52,152,219,0.45);
  }
  .nav-item.active svg { stroke-width: 2.1; }
  .nav-item { position: relative; }
  .nav-item .nav-dot {
    position: absolute; top: 2px; right: 4px;
    width: 8px; height: 8px; border-radius: 50%;
    background: #e74c3c; border: 1.5px solid #fff;
    box-shadow: 0 0 0 1px rgba(231,76,60,0.3);
  }

  /* CONTENT */
  .content { padding: 16px 16px 90px; flex: 1; background: transparent; }
  .section-title { font-size: 0.95rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--red2); margin-bottom: 14px; }
  .card {
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 4px 18px rgba(40,90,140,0.10), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; color: var(--text); }
  .card-sub { font-size: 0.8rem; color: var(--text2); }

  /* FORM */
  label.field-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; margin-top: 14px; }
  input[type=text], input[type=number], input[type=date], select, textarea {
    width: 100%; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.8); color: var(--text);
    padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; font-family: inherit;
    -webkit-appearance: none; appearance: none; box-sizing: border-box;
  }
  input[type=date] { height: 44px; line-height: 44px; padding: 0 14px; }
  input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, select:focus, textarea:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 2px rgba(52,152,219,0.15), 0 0 8px rgba(52,152,219,0.2);
  }
  textarea { resize: vertical; min-height: 110px; line-height: 1.6; }
  textarea.ta-grow { overflow: hidden; resize: none; font-size: 0.95rem; }
  input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.7); }

  /* ALPHA GRID */
  .alpha-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .alpha-btn {
    background: rgba(16,37,88,0.5); border: 1px solid rgba(52,152,219,0.2);
    color: var(--text2); padding: 12px 8px; border-radius: 8px;
    font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s;
  }
  .alpha-btn.selected {
    background: linear-gradient(135deg, rgba(240,192,64,0.2), rgba(240,192,64,0.12));
    border-color: var(--gold); color: var(--gold);
    box-shadow: 0 0 10px rgba(240,192,64,0.25);
    text-shadow: 0 0 8px rgba(240,192,64,0.5);
    animation: neon-pulse-gold 2.5s ease-in-out infinite;
  }

  /* METER STATS */
  .meter-stat { font-size: 0.78rem; color: var(--accent2); margin-top: 4px; }
  .total-meters { background: rgba(41,128,185,0.15); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-top: 8px; font-size: 0.85rem; display: flex; justify-content: space-between; }

  /* PACK TOGGLE */
  .pack-toggle { display: flex; gap: 8px; margin-top: 8px; }
  .pack-btn {
    flex: 1; padding: 10px; border-radius: 8px;
    border: 1px solid rgba(52,152,219,0.25);
    background: rgba(16,37,88,0.5); color: var(--text2);
    font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: center;
    transition: all 0.15s;
  }
  .pack-btn.active {
    background: linear-gradient(135deg, rgba(41,128,185,0.4), rgba(52,152,219,0.3));
    border-color: var(--accent2); color: #fff;
    box-shadow: 0 0 10px rgba(52,152,219,0.3), inset 0 0 8px rgba(52,152,219,0.1);
    text-shadow: 0 0 8px rgba(52,152,219,0.6);
  }

  /* ACTION BUTTONS */
  .actions-row { display: flex; gap: 10px; margin-top: 16px; }

  /* RPE TABLE */
  .rpe-table { width: 100%; border-collapse: collapse; background: transparent; }
  .rpe-table th { font-size: 0.7rem; color: var(--red2); text-align: left; padding: 6px 8px; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--border); background: transparent; }
  .rpe-table td { padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; font-size: 0.85rem; color: var(--text); background: transparent; }
  .rpe-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; color: #fff; }
  .fatigue-label { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .delta { font-size: 0.8rem; font-weight: 600; }
  .delta.good { color: var(--green); }
  .delta.warn { color: #f39c12; }
  .delta.bad { color: var(--red2); }
  .comment-btn { background: transparent; border: none; font-size: 1.1rem; cursor: pointer; padding: 4px; }
  .no-data { color: var(--text2); font-size: 0.85rem; text-align: center; padding: 20px; }

  /* RPE SUMMARY */
  .summary-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .summary-box {
    flex: 1;
    background: linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.28) 100%);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.78);
    border-radius: 10px; padding: 12px; text-align: center;
    box-shadow: 0 2px 12px rgba(100,140,180,0.14), inset 0 1px 0 rgba(255,255,255,0.88);
  }
  .summary-val { font-size: 1.5rem; font-weight: 700; }
  .summary-lbl { font-size: 0.7rem; color: var(--text2); margin-top: 2px; }

  /* HISTORY */
  .hist-row {
    background: linear-gradient(135deg, rgba(255,255,255,0.52) 0%, rgba(255,255,255,0.28) 100%);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.78);
    border-radius: 10px; margin-bottom: 8px; overflow: hidden;
    box-shadow: 0 2px 16px rgba(100,140,180,0.14), inset 0 1px 0 rgba(255,255,255,0.85);
  }
  .hist-header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
  .hist-date-block { text-align: center; min-width: 36px; }
  .hist-day-name { font-size: 0.65rem; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
  .hist-day-num { font-size: 1.3rem; font-weight: 700; line-height: 1; }
  .hist-month { font-size: 0.65rem; color: var(--text2); text-transform: uppercase; }
  .hist-info { flex: 1; min-width: 0; }
  .hist-title { font-size: 0.9rem; font-weight: 600; color: var(--red2); }
  .hist-meta { font-size: 0.75rem; color: var(--text2); display: flex; gap: 10px; margin-top: 2px; }
  .hist-body { padding: 0 14px 14px; border-top: 1px solid var(--border); display: none; }
  .hist-body.open { display: block; }

  /* CALENDAR */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav { background: rgba(255,255,255,0.45); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.75); color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: rgba(255,255,255,0.35); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.7); border-radius: 10px; padding: 6px; }
  .cal-dh { text-align: center; font-size: 0.65rem; color: var(--text2); padding: 6px 2px; font-weight: 600; text-transform: uppercase; }
  .cal-day { text-align: center; padding: 8px 2px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: background 0.1s; min-height: 34px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; color: var(--text); }
  .cal-day.other-month { color: var(--text2); opacity: 0.35; }
  .cal-day.today { background: var(--accent); color: #fff; font-weight: 700; border: none; }
  .cal-day.has-session { background: rgba(41,128,185,0.18); color: var(--accent2); font-weight: 600; }
  .cal-day.has-session::after { content: ''; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent2); }
  .cal-day.has-comp::after { content: ''; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--red2); }
  .cal-day.is-comp { background: rgba(192,57,43,0.25); color: #ff7a6e; font-weight: 700; border: 1px solid rgba(192,57,43,0.5); }
  .comp-item { background: rgba(192,57,43,0.1); border: 1px solid rgba(192,57,43,0.3); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .comp-name { font-weight: 600; font-size: 0.9rem; }
  .comp-sub { font-size: 0.78rem; color: var(--text2); margin-top: 3px; }
  .comp-badge { display: inline-block; font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; padding: 2px 8px; border-radius: 10px; background: rgba(192,57,43,0.3); color: var(--red2); text-transform: uppercase; margin-top: 4px; }

  /* ATHLETE INICIO */
  .welcome-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.58) 0%, rgba(180,215,240,0.35) 100%);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.82);
    border-radius: 16px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 4px 24px rgba(100,140,180,0.18), inset 0 1px 0 rgba(255,255,255,0.92);
  }
  .welcome-name { font-size: 1.1rem; font-weight: 700; color: var(--accent2); }
  .welcome-date { font-size: 0.8rem; color: var(--text2); margin-top: 4px; }
  .coach-msg { background: rgba(41,128,185,0.15); border: 1px solid var(--accent); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .coach-msg-lbl { font-size: 0.7rem; color: var(--accent2); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .alert-comp { background: rgba(192,57,43,0.15); border: 1px solid rgba(192,57,43,0.5); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .alert-comp-lbl { font-size: 0.7rem; color: var(--red2); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
  .week-sessions { margin-top: 8px; }
  .day-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.52) 0%, rgba(255,255,255,0.28) 100%);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.78);
    border-radius: 10px; margin-bottom: 8px; overflow: hidden;
    box-shadow: 0 2px 16px rgba(100,140,180,0.14), inset 0 1px 0 rgba(255,255,255,0.85);
  }
  .day-card.today-card { border-color: rgba(52,152,219,0.55); box-shadow: 0 0 20px rgba(52,152,219,0.2), inset 0 1px 0 rgba(255,255,255,0.9); }
  .day-card-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; }
  .day-name { font-size: 0.85rem; font-weight: 600; }
  .day-phase { font-size: 0.7rem; color: var(--text2); }
  .day-card-body { padding: 0 14px 14px; border-top: 1px solid var(--border); display: none; }
  .day-card-body.open { display: block; }
  .session-section { margin-top: 10px; }
  .section-lbl { font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; color: var(--accent2); text-transform: uppercase; margin-bottom: 4px; opacity: 1; }
  .session-lines { font-size: 0.82rem; line-height: 1.7; white-space: pre-wrap; color: var(--text); }
  .at-note { color: var(--gold); }

  /* RPE SELECTOR */
  .rpe-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .rpe-btn {
    padding: 14px 4px; border-radius: 10px; border: 2px solid transparent;
    font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    opacity: 0.75;
  }
  .rpe-btn.selected {
    border-color: rgba(255,255,255,0.9);
    transform: scale(1.12);
    opacity: 1;
    box-shadow: 0 0 16px 4px currentColor, 0 0 32px 2px currentColor;
    filter: brightness(1.15);
  }
  .fatigue-grid { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .fatigue-btn { flex: 1; min-width: 80px; padding: 12px 6px; border-radius: 8px; border: 2px solid transparent; font-size: 0.78rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.15s; color: #fff; }
  .fatigue-btn.selected { border-color: #fff; transform: scale(1.05); }
  .confirm-screen { text-align: center; padding: 40px 20px; }
  .confirm-emoji { font-size: 4rem; }
  .confirm-rpe { font-size: 3rem; font-weight: 700; margin: 16px 0 8px; }
  .confirm-label { font-size: 1rem; color: var(--text2); }

  /* STATS */
  .stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat-box { flex: 1; background: linear-gradient(135deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.28) 100%); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border: 1px solid rgba(255,255,255,0.78); border-radius: 10px; padding: 14px; text-align: center; box-shadow: 0 2px 12px rgba(100,140,180,0.14), inset 0 1px 0 rgba(255,255,255,0.88); }
  .stat-val { font-size: 1.6rem; font-weight: 700; color: var(--accent2); }
  .stat-lbl { font-size: 0.7rem; color: var(--text2); margin-top: 4px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-top: 12px; }
  .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
  .bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 2px; transition: height 0.3s; }
  .bar-val { font-size: 0.6rem; color: var(--text2); }

  /* BOTTOM SHEET */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 50; display: none; }
  .overlay.open { display: block; }
  .bottom-sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(255,255,255,0.7); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); border-radius: 20px 20px 0 0; border: 1px solid rgba(255,255,255,0.85); border-bottom: none; padding: 20px; z-index: 51; transition: transform 0.25s; box-shadow: 0 -4px 30px rgba(100,140,180,0.2); }
  .sheet-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; color: var(--red2); }
  .sheet-close { float: right; background: var(--surface2); border: none; color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }

  /* TEAM */
  .athlete-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: rgba(255,255,255,0.42); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.72); border-radius: 8px; margin-bottom: 6px; box-shadow: 0 2px 8px rgba(100,140,180,0.1); }
  .athlete-name { font-size: 0.9rem; font-weight: 500; }
  .btn-del { background: rgba(192,57,43,0.2); border: 1px solid rgba(192,57,43,0.4); color: var(--red2); padding: 5px 12px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }

  /* HIST PAST RPE */
  .hist-rpe-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .hist-rpe-name { flex: 1; font-size: 0.82rem; }
  .hist-date-section { background: rgba(41,128,185,0.08); border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; overflow: hidden; }
  .hist-date-toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  .hist-date-body { padding: 0 14px 10px; display: none; }
  .hist-date-body.open { display: block; }

  /* MISC */
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .tag { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: rgba(41,128,185,0.2); color: var(--accent2); margin-right: 4px; }
  .tag-red { background: rgba(192,57,43,0.2); color: var(--red2); }
  .empty-state { text-align: center; padding: 30px 20px; color: var(--text2); font-size: 0.85rem; }

  .greyed { opacity: 0.4; }
  .note-field { margin-top: 10px; }
  input[type=number]::-webkit-inner-spin-button { opacity: 0.5; }

  /* ── INSCRIPCIONS ── */
  .insc-deadline { margin-top:10px; display:inline-flex; align-items:center; gap:8px; background:rgba(243,156,18,0.12); border:1px solid rgba(243,156,18,0.4); color:var(--yellow); font-size:0.75rem; font-weight:600; padding:6px 12px; border-radius:20px; }
  .insc-deadline.win-before { background:rgba(52,152,219,0.1); border-color:var(--border); color:var(--text2); }
  .insc-deadline.win-after { background:rgba(231,76,60,0.1); border-color:rgba(231,76,60,0.4); color:var(--red2); }
  .insc-counter { font-size:0.8rem; font-weight:700; color:var(--accent2); background:rgba(52,152,219,0.12); border:1px solid var(--border); padding:5px 12px; border-radius:20px; }
  .insc-counter.full { color:var(--red2); border-color:rgba(231,76,60,0.5); background:rgba(231,76,60,0.1); }
  .stroke-label { font-size:0.7rem; letter-spacing:2px; text-transform:uppercase; color:var(--accent2); font-weight:800; margin:14px 0 8px; display:flex; align-items:center; gap:8px; }
  .stroke-label::after { content:''; flex:1; height:1px; background:var(--border2); }
  @keyframes chip-select { 0%{transform:scale(1)} 40%{transform:scale(1.08)} 100%{transform:scale(1)} }

  /* LOGIN CINEMATIC */
  @keyframes wave-drift {
    0%   { transform: translateX(0) scaleY(1); }
    50%  { transform: translateX(-30px) scaleY(1.08); }
    100% { transform: translateX(0) scaleY(1); }
  }
  @keyframes wave-drift2 {
    0%   { transform: translateX(0) scaleY(1); }
    50%  { transform: translateX(25px) scaleY(0.94); }
    100% { transform: translateX(0) scaleY(1); }
  }
  @keyframes bubble-rise {
    0%   { transform: translateY(0) scale(1); opacity: 0.5; }
    100% { transform: translateY(-120vh) scale(0.4); opacity: 0; }
  }
  @keyframes logo-drop {
    0%   { opacity: 0; transform: translateY(-40px) scale(0.92); }
    60%  { opacity: 1; transform: translateY(6px) scale(1.02); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes card-rise {
    0%   { opacity: 0; transform: translateY(40px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes shimmer-move {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes float-particle {
    0%,100% { transform: translateY(0) translateX(0); opacity:0.4; }
    33%      { transform: translateY(-18px) translateX(8px); opacity:0.7; }
    66%      { transform: translateY(-8px) translateX(-10px); opacity:0.5; }
  }
  .insc-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .insc-chip {
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.78);
    color: var(--text); padding: 11px 16px; border-radius: 12px;
    font-size: 0.9rem; font-weight: 700; cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, color 0.15s;
    user-select: none;
    box-shadow: 0 2px 8px rgba(100,140,180,0.15), inset 0 1px 0 rgba(255,255,255,0.85);
  }
  .insc-chip:active { transform: scale(0.95); }
  .insc-chip.sel {
    background: linear-gradient(135deg, #2980b9, #3498db);
    border-color: rgba(52,152,219,0.7);
    color: #fff;
    box-shadow: 0 4px 14px rgba(41,128,185,0.4);
    animation: chip-select 0.25s ease-out;
  }
  .insc-chip.sel::before { content: '✓ '; font-weight: 800; color: rgba(255,255,255,0.85); }
  .insc-chip.dis { opacity: 0.28; pointer-events: none; }
  .insc-matrix-wrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin:14px 0; }
  .insc-matrix-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .insc-matrix { border-collapse:collapse; width:max-content; min-width:100%; font-size:0.78rem; }
  .insc-matrix th, .insc-matrix td { padding:9px 10px; text-align:center; white-space:nowrap; border-bottom:1px solid rgba(41,128,185,0.12); }
  .insc-matrix thead th { background:var(--surface2); color:var(--text2); font-size:0.6rem; letter-spacing:0.5px; text-transform:uppercase; }
  .insc-matrix th.iname, .insc-matrix td.iname { position:sticky; left:0; background:var(--surface2); text-align:left; font-weight:700; font-size:0.73rem; z-index:2; min-width:120px; box-shadow:2px 0 6px rgba(0,0,0,0.35); }
  .insc-matrix td.iname { background:var(--surface); }
  .insc-matrix .ix { color:var(--accent2); font-weight:800; }
  .insc-matrix tfoot td { background:var(--surface2); color:var(--gold); font-weight:800; font-size:0.7rem; border-top:1px solid var(--border); }
  .insc-stat-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:12px 0; }
  .insc-stat { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 8px; text-align:center; }
  .insc-stat b { display:block; font-size:1.3rem; color:var(--accent2); }
  .insc-stat.gold b { color:var(--gold); }
  .insc-stat span { font-size:0.6rem; letter-spacing:1px; text-transform:uppercase; color:var(--text2); font-weight:600; }
  .insc-comp-sel { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; }
  .insc-comp-sel button { flex:0 0 auto; background:var(--surface); border:1px solid var(--border); color:var(--text2); padding:8px 14px; border-radius:10px; font-size:0.78rem; font-weight:600; cursor:pointer; }
  .insc-comp-sel button.on { background:var(--accent); color:#fff; border-color:var(--accent2); }

  /* ── Modal confirmación ── */
  .acwr-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  .acwr-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 6px; text-align:center; }
  .acwr-name { font-size:0.72rem; font-weight:700; color:var(--text); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acwr-val { font-size:1.1rem; font-weight:800; line-height:1.1; }
  .acwr-lbl { font-size:0.6rem; letter-spacing:0.5px; text-transform:uppercase; font-weight:700; margin-top:2px; }
  .confirm-back { position:fixed; inset:0; background:rgba(4,16,31,0.78); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:200; padding:24px; animation:fadeIn 0.15s ease; }
  .confirm-box { background:rgba(16,37,88,0.82); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%); border:1px solid rgba(52,152,219,0.25); border-radius:18px; padding:24px 22px; max-width:380px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.07); animation:popIn 0.18s ease; }
  .confirm-title { font-size:1.05rem; font-weight:700; color:#eaf2f8; margin-bottom:8px; }
  .confirm-msg { font-size:0.86rem; color:var(--text2); line-height:1.5; margin-bottom:20px; }
  .confirm-btns { display:flex; gap:10px; }
  .confirm-btns button { flex:1; padding:13px; border-radius:11px; border:none; font-size:0.92rem; font-weight:700; cursor:pointer; transition:transform 0.1s; }
  .confirm-btns button:active { transform:scale(0.96); }
  .confirm-cancel { background:var(--surface); color:var(--text2); border:1px solid var(--border) !important; }
  .confirm-ok { background:var(--red); color:#fff; }
  .confirm-ok.safe { background:var(--accent); }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes popIn { from{opacity:0;transform:scale(0.94)} to{opacity:1;transform:scale(1)} }

  /* ── Botón borrar entreno en historial ── */
  .sess-del-btn { background:rgba(192,57,43,0.12); border:1px solid rgba(192,57,43,0.35); color:var(--red2); min-width:34px; height:34px; padding:0 6px; border-radius:9px; font-size:0.78rem; line-height:1; display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; cursor:pointer; flex-shrink:0; margin-right:8px; transition:all 0.12s; }
  .sess-del-btn:active { transform:scale(0.9); background:rgba(192,57,43,0.25); }

  /* ── Botones abrir/cerrar inscripción ── */
  .insc-ctrl { display:flex; gap:10px; margin:12px 0; }
  .insc-ctrl button { flex:1; padding:13px; border-radius:12px; border:none; font-size:0.88rem; font-weight:700; cursor:pointer; transition:transform 0.1s; }
  .insc-ctrl button:active { transform:scale(0.97); }
  .insc-ctrl .open-btn { background:var(--green); color:#fff; }
  .insc-ctrl .close-btn { background:var(--red); color:#fff; }
  .insc-ctrl button:disabled { opacity:0.4; cursor:default; }
  .insc-ctrl button:disabled:active { transform:none; }
</style>

<script>
// ============================================================
// SUPABASE CONFIG
// ============================================================
const SUPABASE_URL = 'https://skblkxwaxnefycgrqeyt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Wc-Lo4L8ZPZ_OOg1F8iVVg_vWPEabtn'; // clave pública (terrassanatacio) — diseñada para ir en el cliente

let SB_STATUS = 'ok'; // 'ok' | 'nokey' | 'auth' | 'offline'

// --- Sesión de coach (Supabase Auth) para que las policies RLS de escritura reconozcan auth.uid() ---
const COACH_EMAIL = 'pablohschneider@gmail.com';
const COACH_PASSWORD = 'Elherny1';
let SB_ACCESS_TOKEN = localStorage.getItem('ondrift_sb_token') || null;

async function coachSignIn() {
  try {
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: COACH_EMAIL, password: COACH_PASSWORD })
    });
    if (!res.ok) { console.error('Coach auth error', await res.text()); return false; }
    const data = await res.json();
    SB_ACCESS_TOKEN = data.access_token;
    localStorage.setItem('ondrift_sb_token', SB_ACCESS_TOKEN);
    return true;
  } catch (e) {
    console.error('Coach auth sin conexión', e.message);
    return false;
  }
}

async function sbFetch(path, options) {
  if (SUPABASE_KEY.indexOf('PEGA_AQUI') === 0) { SB_STATUS = 'nokey'; return null; }
  const url = SUPABASE_URL + '/rest/v1/' + path;
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + (SB_ACCESS_TOKEN || SUPABASE_KEY),
    'Content-Type': 'application/json',
    'Prefer': options && options.prefer ? options.prefer : 'return=representation'
  };
  try {
    const res = await fetch(url, { ...options, headers: { ...headers, ...(options && options.headers || {}) } });
    if (!res.ok) {
      const err = await res.text(); console.error('SB error', path, err);
      if ((res.status === 401 || res.status === 403) && SB_ACCESS_TOKEN) {
        // El token pudo expirar: reautenticamos una vez en background y reintentamos
        const ok = await coachSignIn();
        if (ok) return sbFetch(path, options);
      }
      if (res.status === 401 || res.status === 403) SB_STATUS = 'auth';
      return null;
    }
    SB_STATUS = 'ok';
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  } catch (e) {
    console.error('SB sin conexión', path, e.message);
    SB_STATUS = 'offline';
    return null;
  }
}
async function sbFunctionCall(fnName, body, useAuthToken) {
  const headers = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
  if (useAuthToken && SB_ACCESS_TOKEN) headers['Authorization'] = 'Bearer ' + SB_ACCESS_TOKEN;
  const res = await fetch(SUPABASE_URL + '/functions/v1/' + fnName, {
    method: 'POST', headers, body: JSON.stringify(body || {})
  });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  return { ok: res.ok, status: res.status, data };
}

function buildSbBanner() {
  if (SB_STATUS === 'ok') return null;
  const msgs = {
    nokey: '⚙️ Falta configurar la clave de Supabase. Abre el archivo y pega tu sb_publishable_ en SUPABASE_KEY.',
    auth: '🔑 La clave de Supabase no es válida o fue revocada. Revisa SUPABASE_KEY en el archivo.',
    offline: '📡 Sin conexión con la base de datos. Comprueba tu internet y recarga.'
  };
  const b = document.createElement('div');
  b.style.cssText = 'background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.5);color:#f0b4ad;padding:12px 16px;border-radius:12px;margin:12px;font-size:0.82rem;line-height:1.4;max-width:480px;align-self:center';
  b.textContent = msgs[SB_STATUS];
  return b;
}

// ── Athlete cache ──────────────────────────────────────────
let _athleteCache = null;
async function dbGetAthletes() {
  if (_athleteCache) return _athleteCache;
  const rows = await sbFetch('athletes?select=id,name,morning_days,pin_hash&active=eq.true&order=name');
  _athleteCache = rows || [];
  return _athleteCache;
}
async function dbAthleteId(name) {
  const athletes = await dbGetAthletes();
  const found = athletes.find(a => a.name === name);
  return found ? found.id : null;
}
async function dbAddAthlete(name) {
  // 'name' tiene UNIQUE constraint en la tabla. El INSERT directo fallaba en
  // silencio (409) si el nombre coincidía con un nadador desactivado, y el
  // caller nunca chequeaba el resultado. Ahora se verifica antes de insertar:
  // - Si existe y está activo -> duplicado real, se avisa.
  // - Si existe pero está inactivo -> se reactiva (conserva RPE/asistencia/wellness).
  // - Si no existe -> INSERT normal.
  const existing = await sbFetch('athletes?name=eq.' + encodeURIComponent(name) + '&select=id,active');
  if (existing && existing.length > 0) {
    const row = existing[0];
    if (row.active) return { ok: false, reason: 'duplicate_active' };
    const reactivated = await sbFetch('athletes?id=eq.' + row.id, { method:'PATCH', body: JSON.stringify({ active: true }) });
    _athleteCache = null;
    return { ok: Array.isArray(reactivated) && reactivated.length > 0, reason: 'reactivated' };
  }
  const res = await sbFetch('athletes', { method:'POST', body: JSON.stringify({ name }) });
  _athleteCache = null;
  return { ok: !!res, reason: res ? 'created' : 'error' };
}
async function dbDeleteAthlete(name) {
  // Soft-delete: pone active=false en vez de borrar la fila.
  // Un DELETE físico fallaba en silencio por la FK de 'attendance' (NO ACTION,
  // a diferencia de rpe_entries/comments/inscriptions/wellness_entries que sí
  // tienen CASCADE) — y de paso hubiera borrado el historial de asistencia,
  // RPE y wellness del nadador. dbGetAthletes() ya filtra active=eq.true.
  // Nota: sin 'return=minimal' (default 'return=representation') para poder
  // distinguir éxito (devuelve la fila) de fallo (sbFetch devuelve null en
  // ambos casos si se pide return=minimal).
  const res = await sbFetch('athletes?name=eq.' + encodeURIComponent(name), { method:'PATCH', body: JSON.stringify({ active: false }) });
  _athleteCache = null;
  return Array.isArray(res) && res.length > 0;
}

// ── Sessions ───────────────────────────────────────────────
let _sessionCache = {};
let _allSessionsCache = null;
async function dbGetSession(date) {
  if (_sessionCache[date] !== undefined) return _sessionCache[date];
  const rows = await sbFetch('sessions?date=eq.' + date + '&select=*');
  if (!rows || rows.length === 0) { _sessionCache[date] = null; return null; }
  // Reconstruct am/pm format
  const result = { am: null, pm: null };
  rows.forEach(r => {
    const sess = { ...r.content, title: r.title, phase: r.phase, targetRPE: r.target_rpe, duration: r.duration_min, alphaPhase: r.alpha_phase, _id: r.id };
    result[r.slot] = sess;
  });
  _sessionCache[date] = result;
  return result;
}
async function dbSaveSession(date, slot, sessObj) {
  const body = {
    date, slot,
    title: sessObj.title || 'Sin título',
    phase: sessObj.phase || 'Ligero',
    target_rpe: sessObj.targetRPE || 6,
    duration_min: sessObj.duration || 80,
    alpha_phase: sessObj.alphaPhase || null,
    content: {
      warmUp: sessObj.warmUp || '', preSet: sessObj.preSet || '',
      mainSet: sessObj.mainSet || '', mainSetFondo: sessObj.mainSetFondo || '',
      coolDown: sessObj.coolDown || '',
      pullText: sessObj.pullText || '', pushText: sessObj.pushText || '', lowerText: sessObj.lowerText || ''
    }
  };
  const res = await sbFetch('sessions?on_conflict=date,slot', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=representation',
    body: JSON.stringify(body)
  });
  delete _sessionCache[date];
  _allSessionsCache = null;
  return res; // null si falló, array si guardó
}
async function dbGetAllSessions(weeks) {
  // Ventana de arranque: solo las últimas N semanas (por defecto 6).
  if (_allSessionsCache) return _allSessionsCache;
  const w = weeks || 6;
  const from = new Date(); from.setDate(from.getDate() - w * 7);
  const fromS = from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
  const rows = await sbFetch('sessions?select=*&date=gte.' + fromS + '&order=date.desc');
  if (!rows) return [];
  const byDate = {};
  rows.forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = { am: null, pm: null };
    const sess = { ...r.content, title: r.title, phase: r.phase, targetRPE: r.target_rpe, duration: r.duration_min, alphaPhase: r.alpha_phase, _id: r.id };
    byDate[r.date][r.slot] = sess;
  });
  _allSessionsCache = Object.entries(byDate).map(([date, data]) => ({ date, data })).sort((a,b) => b.date.localeCompare(a.date));
  _loadedMonths = {};
  // marcar los meses ya cubiertos por la ventana inicial
  _allSessionsCache.forEach(function(s){ _loadedMonths[s.date.slice(0,7)] = true; });
  return _allSessionsCache;
}

// Carga un mes concreto bajo demanda (formato 'YYYY-MM'). Fusiona en la caché.
let _loadedMonths = {};
async function dbLoadSessionMonth(ym) {
  if (_loadedMonths[ym]) return;
  const first = ym + '-01';
  const [y, m] = ym.split('-').map(Number);
  const lastDay = new Date(y, m, 0).getDate();
  const last = ym + '-' + String(lastDay).padStart(2,'0');
  const rows = await sbFetch('sessions?select=*&date=gte.' + first + '&date=lte.' + last + '&order=date.desc');
  _loadedMonths[ym] = true;
  if (!rows || rows.length === 0) return;
  const byDate = {};
  rows.forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = { am: null, pm: null };
    const sess = { ...r.content, title: r.title, phase: r.phase, targetRPE: r.target_rpe, duration: r.duration_min, alphaPhase: r.alpha_phase, _id: r.id };
    byDate[r.date][r.slot] = sess;
  });
  const existing = {}; (_allSessionsCache || []).forEach(function(s){ existing[s.date] = s; });
  Object.entries(byDate).forEach(([date, data]) => { existing[date] = { date, data }; });
  _allSessionsCache = Object.values(existing).sort((a,b) => b.date.localeCompare(a.date));
  DATA.allSessions = _allSessionsCache;
  DATA.sessions = {}; _allSessionsCache.forEach(x => { DATA.sessions[x.date] = x.data; });
}

// ── RPE ────────────────────────────────────────────────────
let _rpeCache = {};
let _rpeRangeLoaded = false;
async function dbGetRPERange(days) {
  // 1 sola petición para los últimos N días, agrupada por fecha en cliente
  const from = new Date(); from.setDate(from.getDate() - (days - 1));
  const fromS = from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
  const rows = await sbFetch('rpe_entries?date=gte.' + fromS + '&select=*,athletes(name)&order=date');
  const byDate = {};
  (rows || []).forEach(r => {
    const name = r.athletes?.name;
    if (!name) return;
    if (!byDate[r.date]) byDate[r.date] = {};
    if (!byDate[r.date][name]) byDate[r.date][name] = { am: null, pm: null };
    byDate[r.date][name][r.slot] = { rpe: r.rpe, fatigue: r.fatigue, note: r.note, ts: new Date(r.created_at).getTime() };
  });
  // rellenar caché completa del rango (días sin datos = {})
  for (let i = 0; i < days; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    _rpeCache[ds] = byDate[ds] || {};
  }
  _rpeRangeLoaded = true;
  return _rpeCache;
}
async function dbGetDayRPE(date) {
  if (_rpeCache[date]) return _rpeCache[date];
  const rows = await sbFetch('rpe_entries?date=eq.' + date + '&select=*,athletes(name)');
  if (!rows) { _rpeCache[date] = {}; return {}; }
  const result = {};
  rows.forEach(r => {
    const name = r.athletes?.name;
    if (!name) return;
    if (!result[name]) result[name] = { am: null, pm: null };
    result[name][r.slot] = { rpe: r.rpe, fatigue: r.fatigue, note: r.note, ts: new Date(r.created_at).getTime() };
  });
  _rpeCache[date] = result;
  return result;
}
async function dbSaveRPE(date, slot, athleteName, rpe, fatigue, note) {
  const athleteId = await dbAthleteId(athleteName);
  if (!athleteId) return null;
  // Upsert atómico: si ya existe (athlete_id,date,slot) lo actualiza, si no lo crea.
  // Evita la carrera del DELETE+POST cuando varios escriben a la vez.
  const res = await sbFetch('rpe_entries?on_conflict=athlete_id,date,slot', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=representation',
    body: JSON.stringify({ athlete_id: athleteId, date, slot, rpe, fatigue, note: note || '' })
  });
  delete _rpeCache[date];
  _rpeRangeLoaded = false;
  return res;
}

// Garantiza que DATA.sessions esté poblado antes de leer duración.
// Evita la carrera de red: sin esto, dbGetAthleteHist/dbGetAllAthleteHist podían
// leer DATA.sessions vacío si su propio fetch de rpe_entries resolvía antes que
// el de sessions (ambos lanzados en paralelo en loadData()), cayendo al fallback
// de 80 min de forma silenciosa aunque la sesión real tuviera otra duración.
async function ensureSessionsLoaded() {
  if (Object.keys(DATA.sessions).length > 0) return;
  const s = await dbGetAllSessions(6);
  DATA.allSessions = s;
  DATA.sessions = {};
  s.forEach(x => { DATA.sessions[x.date] = x.data; });
}

// ENCUESTA POST-COMPETICIÓN
// Se activa 5 días después de terminar una competición de nivel
// Autonómico, Nacional o Internacional (no en meets de club) — el margen
// de 5 días es para que el nadador conteste después de que baje la carga
// emocional inmediata, no en caliente.
async function dbGetPendingSurvey(name) {
  const athleteId = await dbAthleteId(name);
  if (!athleteId) return null;
  const today = new Date();
  const limit = new Date(today); limit.setDate(limit.getDate() - 5);
  const limitS = limit.getFullYear()+'-'+String(limit.getMonth()+1).padStart(2,'0')+'-'+String(limit.getDate()).padStart(2,'0');
  const tiposFiltro = encodeURIComponent('Nacional,Autonómico,Internacional');
  const comps = await sbFetch('competitions?select=id,name,type,end_date&type=in.(' + tiposFiltro + ')&end_date=lte.' + limitS + '&order=end_date.desc');
  if (!comps || comps.length === 0) return null;
  for (const c of comps) {
    const existing = await sbFetch('results?athlete_id=eq.' + athleteId + '&competition_id=eq.' + c.id + '&select=id&limit=1');
    if (!existing || existing.length === 0) return c; // primera competición sin encuesta completada
  }
  return null;
}

async function dbGetAthleteHist(name) {
  const athleteId = await dbAthleteId(name);
  if (!athleteId) return [];
  await ensureSessionsLoaded();
  const from = new Date(); from.setDate(from.getDate() - 27);
  const fromS = from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
  const rows = await sbFetch('rpe_entries?athlete_id=eq.' + athleteId + '&select=date,slot,rpe,fatigue&date=gte.' + fromS + '&order=date.asc');
  if (!rows) return [];
  // Adjuntar duración de la sesión correspondiente (para sRPE = RPE × min).
  // DATA.sessions ya garantizado por ensureSessionsLoaded(); si aun así falta
  // (sesión borrada / dato huérfano real, no carrera), default 80 y se marca estimado.
  rows.forEach(function(h) {
    let dur = 80, estimated = true;
    const day = DATA.sessions && DATA.sessions[h.date];
    if (day && day[h.slot] && day[h.slot].duration) { dur = day[h.slot].duration; estimated = false; }
    h.duration = dur;
    h.durationEstimated = estimated;
  });
  return rows;
}

// Carga en un solo request el historial de TODOS los atletas (para el panel
// Escuadra del coach). Devuelve un mapa name -> [{date,slot,rpe,fatigue,duration}],
// mismo shape que dbGetAthleteHist para que calcACWR() no distinga origen.
async function dbGetAllAthleteHist() {
  await ensureSessionsLoaded();
  const from = new Date(); from.setDate(from.getDate() - 27);
  const fromS = from.getFullYear()+'-'+String(from.getMonth()+1).padStart(2,'0')+'-'+String(from.getDate()).padStart(2,'0');
  const rows = await sbFetch('rpe_entries?select=date,slot,rpe,fatigue,athletes(name)&date=gte.' + fromS + '&order=date.asc');
  const map = {};
  if (!rows) return map;
  rows.forEach(function(r) {
    const name = r.athletes && r.athletes.name;
    if (!name) return;
    let dur = 80, estimated = true;
    const day = DATA.sessions && DATA.sessions[r.date];
    if (day && day[r.slot] && day[r.slot].duration) { dur = day[r.slot].duration; estimated = false; }
    if (!map[name]) map[name] = [];
    map[name].push({ date: r.date, slot: r.slot, rpe: r.rpe, fatigue: r.fatigue, duration: dur, durationEstimated: estimated });
  });
  return map;
}

function showToast(msg, type) {
  // type: 'success' | 'error'
  const existing = document.getElementById('_toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.id = '_toast';
  const isOk = type !== 'error';
  t.style.cssText = [
    'position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px)',
    'background:' + (isOk ? 'rgba(16,37,88,0.92)' : 'rgba(80,20,20,0.92)'),
    'border:1px solid ' + (isOk ? 'rgba(52,152,219,0.5)' : 'rgba(231,76,60,0.5)'),
    'color:#fff;padding:12px 24px;border-radius:30px',
    'font-size:0.9rem;font-weight:700;letter-spacing:0.5px',
    'backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)',
    'box-shadow:0 4px 24px rgba(0,0,0,0.4),' + (isOk ? '0 0 16px rgba(52,152,219,0.3)' : '0 0 16px rgba(231,76,60,0.3)'),
    'z-index:999;transition:transform 0.3s cubic-bezier(.34,1.56,.64,1),opacity 0.3s ease',
    'opacity:0;white-space:nowrap;pointer-events:none'
  ].join(';');
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      t.style.transform = 'translateX(-50%) translateY(0)';
      t.style.opacity = '1';
    });
  });
  setTimeout(function() {
    t.style.transform = 'translateX(-50%) translateY(20px)';
    t.style.opacity = '0';
    setTimeout(function() { t.remove(); }, 350);
  }, 2200);
}

function showConfirm(title, message, onConfirm, opts) {
  opts = opts || {};
  const back = document.createElement('div');
  back.className = 'confirm-back';
  const box = document.createElement('div');
  box.className = 'confirm-box';
  box.innerHTML = '<div class="confirm-title">' + title + '</div>'
    + (message ? '<div class="confirm-msg">' + message + '</div>' : '');
  const btns = document.createElement('div');
  btns.className = 'confirm-btns';
  const cancel = document.createElement('button');
  cancel.className = 'confirm-cancel';
  cancel.textContent = opts.cancelText || 'Cancelar';
  const ok = document.createElement('button');
  ok.className = 'confirm-ok';
  ok.textContent = opts.okText || 'Borrar';
  if (opts.okSafe) ok.classList.add('safe');
  cancel.onclick = function() { back.remove(); };
  back.onclick = function(e) { if (e.target === back) back.remove(); };
  ok.onclick = function() { back.remove(); onConfirm(); };
  btns.append(cancel, ok);
  box.appendChild(btns);
  back.appendChild(box);
  document.body.appendChild(back);
}

function findQueuedRPE(date, slot, athleteName) {
  return getRPEQueue().find(function(q) { return q.date === date && q.slot === slot && q.athleteName === athleteName; }) || null;
}
function queueRPE(date, slot, athleteName, rpe, fatigue, note) {
  const q = getRPEQueue();
  // si ya había una entrada pendiente para el mismo date+slot+atleta, la reemplaza (no duplica)
  const filtered = q.filter(function(x){ return !(x.date === date && x.slot === slot && x.athleteName === athleteName); });
  filtered.push({ date, slot, athleteName, rpe, fatigue, note: note || '', ts: Date.now() });
  saveRPEQueue(filtered);
}
let _flushingRPEQueue = false;
async function flushRPEQueue() {
  if (_flushingRPEQueue) return;
  const q = getRPEQueue();
  if (q.length === 0) return;
  _flushingRPEQueue = true;
  const remaining = [];
  for (const item of q) {
    const res = await dbSaveRPE(item.date, item.slot, item.athleteName, item.rpe, item.fatigue, item.note);
    if (!res) {
      if (SB_STATUS === 'offline') {
        // seguimos sin red: dejamos esta y el resto tal cual, no tiene sentido seguir intentando ahora
        remaining.push(item);
        remaining.push.apply(remaining, q.slice(q.indexOf(item) + 1));
        break;
      }
      // fallo no-offline (ej. clave inválida): se descarta para no reintentar infinito con datos malos
      console.error('RPE en cola descartado (fallo no offline)', item);
      continue;
    }
    // éxito: no se agrega a remaining
  }
  saveRPEQueue(remaining);
  _flushingRPEQueue = false;
  if (remaining.length < q.length) render();
}

// ============================================================
// METERS PARSER
// ============================================================
function parseMeters(text) {
  if (!text) return 0;
  // Expand block multipliers: Nx{ ... } before line-by-line parsing
  text = text.replace(/(\d+)\s*[xX×]\s*\{([^}]*)\}/g, (_, mult, inner) => {
    const n = parseInt(mult);
    return inner.trim().split('\n').map(line => {
      const t = line.trim();
      if (!t) return '';
      // If line is NxD, multiply reps by block multiplier
      const m = t.match(/^(\d+)\s*[xX×]\s*(\d+)(.*)/);
      if (m) return (parseInt(m[1]) * n) + 'x' + m[2] + (m[3] || '');
      // If bare distance line
      const b = t.match(/^(\d+)(.*)/);
      if (b) return (parseInt(b[1]) * n) + (b[2] || '');
      return t;
    }).filter(Boolean).join('\n');
  });
  let total = 0;
  text.split('\n').forEach(line => {
    const t = line.trim();
    if (!t) return;
    // NxD pattern: 4x50, 6X100, 3×200
    const mult = t.match(/(\d+)\s*[xX×]\s*(\d+)/);
    if (mult) { total += parseInt(mult[1]) * parseInt(mult[2]); return; }
    // Bare distance: line starts with a number (e.g. "300 FC", "200 patada")
    const bare = t.match(/^(\d+)\s+[^x×X]/);
    if (bare) { total += parseInt(bare[1]); }
  });
  return total;
}
function metersLabel(text) {
  const m = parseMeters(text);
  return m > 0 ? m + ' m' : '';
}
function totalMeters(session) {
  if (session.phase === 'Fuerza') return 0;
  return parseMeters(session.warmUp) + parseMeters(session.preSet) + parseMeters(session.mainSet) + parseMeters(session.mainSetFondo) + parseMeters(session.coolDown);
}
function volumeBreakdown(session) {
  if (session.phase === 'Fuerza') return null;
  var base = parseMeters(session.warmUp) + parseMeters(session.preSet) + parseMeters(session.coolDown);
  var grupo = base + parseMeters(session.mainSet);
  var fondo = base + parseMeters(session.mainSetFondo);
  return { grupo: grupo, fondo: fondo, hasGrupo: parseMeters(session.mainSet) > 0, hasFondo: parseMeters(session.mainSetFondo) > 0 };
}
function buildVolumeBlock(session, prefix) {
  var vb = volumeBreakdown(session);
  if (!vb) return null;
  if (!vb.hasGrupo && !vb.hasFondo) return null;
  var wrap = document.createElement('div');
  wrap.style.marginTop = '10px';
  if (vb.hasGrupo) {
    var rowG = document.createElement('div'); rowG.className = 'total-meters'; rowG.style.marginBottom = '4px';
    rowG.innerHTML = '<span>' + (prefix || '') + 'Vol. Grupo</span><span style="font-weight:700;color:var(--accent2)">' + vb.grupo + ' m</span>';
    wrap.appendChild(rowG);
  }
  if (vb.hasFondo) {
    var rowF = document.createElement('div'); rowF.className = 'total-meters';
    rowF.innerHTML = '<span>' + (prefix || '') + 'Vol. Fondo</span><span style="font-weight:700;color:var(--gold)">' + vb.fondo + ' m</span>';
    wrap.appendChild(rowF);
  }
  return wrap;
}

// Clasifica el delta RPE reportado − objetivo con margen de tolerancia.
// ±1 es variación normal (no es señal); ±2 vale la pena mirar; ±3+ es discrepancia
// grande en cualquier dirección (mucho más duro o mucho más fácil de lo planeado).
function deltaClass(delta) {
  const abs = Math.abs(delta);
  if (abs <= 1) return 'good';
  if (abs === 2) return 'warn';
  return 'bad';
}
function rpeColor(v) {
  if (!v) return '#555';
  if (v <= 3) return '#1e8449';
  if (v <= 5) return '#5a9e1e';
  if (v <= 6) return '#d4860f';
  if (v <= 8) return '#d2691e';
  return '#c0392b';
}
function contrastText(hex) {
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.6 ? '#1a2a3a' : '#fff';
}

// ============================================================
// RENDER AT-NOTES
// ============================================================
function renderTextWithNotes(text) {
  if (!text) return '';
  // Modelo de bloque por indentación (sin llaves):
  //   - Una línea que empieza con "N×" o "Nx" abre un bloque de repetición.
  //   - Las líneas siguientes pertenecen al bloque (se muestran sangradas).
  //   - Una línea EN BLANCO cierra el bloque.
  //   - Texto suelto tras el cierre se muestra normal.
  const rawLines = text.split('\n');
  const out = [];
  let insideBlock = false;
  const openerRe = /^(\d+)\s*[xX\u00d7]\s*$/;        // "2×" o "2x" solos
  const openerInlineRe = /^(\d+)\s*[xX\u00d7]\s+(.+)$/; // "2× algo" (contenido en la misma línea)

  for (let i = 0; i < rawLines.length; i++) {
    const line = rawLines[i];
    const trimmed = line.trim();

    // Línea en blanco: cierra bloque si estaba abierto; separa visualmente
    if (!trimmed) {
      if (insideBlock) insideBlock = false;
      out.push('\n');
      continue;
    }

    // ¿Abre bloque? ("2×" sola, o "2× 4x50 ...")
    const mSolo = trimmed.match(openerRe);
    const mInline = trimmed.match(openerInlineRe);
    if (mSolo || mInline) {
      insideBlock = true;
      const n = (mSolo || mInline)[1];
      out.push(`\n<span style="color:var(--accent2);font-weight:700;letter-spacing:1px">${n}\u00d7</span>`);
      if (mInline && mInline[2].trim()) {
        out.push('\n  ' + renderInlineNotes(mInline[2].trim()));
      }
      continue;
    }

    // Línea normal (dentro o fuera de bloque)
    const indent = insideBlock ? '  ' : '';
    const parts = line.split(/(@[^@\n]+)/g);
    const rendered = parts.map(p => p.startsWith('@') ? `<span class="at-note">${p}</span>` : p).join('');
    out.push('\n' + indent + rendered.trim());
  }
  return out.join('').replace(/^\n+/, '').replace(/\n{3,}/g, '\n\n');
}
function renderInlineNotes(text) {
  if (!text) return '';
  return text.split(/(@[^@\n]+)/g)
    .map(p => p.startsWith('@') ? `<span class="at-note">${p}</span>` : p).join('');
}


// ============================================================
// ACWR CALCULATOR
// ============================================================
function calcACWR(athleteName) {
  try {
  const hist = DATA.athleteHist[athleteName] || [];
    if (hist.length < 3) return null;
    const today = new Date();
    // 1) Carga sRPE por entrada (RPE × duración), agrupada por DÍA.
    //    Un día con doble sesión suma am+pm (carga diaria real).
    const loadByDay = {};
    hist.forEach(function(h) {
      const d = dateObj(h.date);
      const daysAgo = Math.floor((today - d) / 86400000);
      if (daysAgo < 0 || daysAgo >= 28) return;
      const srpe = h.rpe * (h.duration || 80);
      loadByDay[h.date] = (loadByDay[h.date] || 0) + srpe;
    });
    // 2) Aguda = suma de carga de los últimos 7 días.
    //    Crónica = media semanal = suma de 28 días / 4.
    let acute = 0, chronic = 0;
    Object.keys(loadByDay).forEach(function(date) {
      const daysAgo = Math.floor((today - dateObj(date)) / 86400000);
      if (daysAgo < 7) acute += loadByDay[date];
      chronic += loadByDay[date];
    });
    const chronicWeekly = chronic / 4;
    if (chronicWeekly === 0) return null;
    // Días distintos con carga en la ventana crónica (28d). El ACWR no es
    // fiable hasta tener ~3 semanas de historia: antes, la ventana crónica
    // está casi vacía y el ratio sale artificialmente alto.
    const diasConCarga = Object.keys(loadByDay).length;
    const ratio = Math.round((acute / chronicWeekly) * 100) / 100;
    if (diasConCarga < 14) return { calibrating: true, days: diasConCarga, value: ratio };
    // 3) Ratio agudo:crónico (umbrales Gabbett 0.8–1.3 válidos con esta fórmula)
    return ratio;
  } catch(e) { return null; }
}
// Detecta si, dentro de la ventana de 28 días que usa el ACWR, hay entradas
// cuya duración cayó en el fallback de 80 min por no encontrar la sesión real
// (sesión borrada / dato huérfano) — no por la carrera de red ya corregida.
function acwrHasEstimated(athleteName) {
  const hist = DATA.athleteHist[athleteName] || [];
  const today = new Date();
  return hist.some(function(h) {
    const daysAgo = Math.floor((today - dateObj(h.date)) / 86400000);
    return daysAgo >= 0 && daysAgo < 28 && h.durationEstimated;
  });
}

// ============================================================
// MONOTONÍA Y STRAIN (Foster, 1998)
// Monotonía = carga media diaria (7d) ÷ desviación estándar de esa carga diaria.
// Captura lo que el ACWR no ve: una semana de RPE parejo día a día puede salir
// "Óptima" en ACWR y aun así ser de riesgo si no hay variación (Foster la
// vinculó a mayor incidencia de enfermedad/lesión incluso con carga moderada).
// Strain = carga semanal total × monotonía.
// Desviación estándar muestral (n-1), consistente con las guías prácticas
// (hojas de cálculo STDEV) más citadas para este método.
function calcMonotonyStrain(athleteName) {
  try {
  const hist = DATA.athleteHist[athleteName] || [];
  const today = new Date();
  const loadByDay = {};
  hist.forEach(function(h) {
    const d = dateObj(h.date);
    const daysAgo = Math.floor((today - d) / 86400000);
    if (daysAgo < 0 || daysAgo >= 7) return;
    const srpe = h.rpe * (h.duration || 80);
    loadByDay[h.date] = (loadByDay[h.date] || 0) + srpe;
  });
  // Construir los 7 días calendario completos: los días sin sesión cuentan
  // como carga 0 (el descanso real es lo que baja la monotonía).
  const dailyLoads = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    dailyLoads.push(loadByDay[key] || 0);
  }
  const weeklyLoad = dailyLoads.reduce(function(a,b){ return a+b; }, 0);
  if (weeklyLoad === 0) return null;
  const n = dailyLoads.length;
  const mean = weeklyLoad / n;
  const variance = dailyLoads.reduce(function(a,b){ return a + Math.pow(b-mean, 2); }, 0) / (n - 1);
  const sd = Math.sqrt(variance);
  if (sd === 0) return { monotony: null, strain: null, weeklyLoad: Math.round(weeklyLoad), flatWeek: true };
  const monotony = Math.round((mean / sd) * 100) / 100;
  const strain = Math.round(weeklyLoad * monotony);
  return { monotony: monotony, strain: strain, weeklyLoad: Math.round(weeklyLoad), flatWeek: false };
  } catch(e) { return null; }
}
function monotonyLabel(m) {
  // Umbrales orientativos de la literatura (Foster/adaptaciones posteriores),
  // no un corte validado específicamente en natación juvenil — usar como guía,
  // no como diagnóstico automático.
  if (m === null) return { label: 'Sin variación', color: '#e74c3c' };
  if (m < 1.5) return { label: 'Bien variada', color: '#27ae60' };
  if (m <= 2.0) return { label: 'Moderada', color: '#f39c12' };
  return { label: 'Alta monotonía', color: '#e74c3c' };
}
function acwrLabel(ratio) {
  if (ratio === null) return null;
  if (typeof ratio === 'object' && ratio.calibrating) return { label: 'Calibrando', color: '#5a7085', icon: '○', calibrating: true };
  if (ratio < 0.8)  return { label: 'Subcarga', color: '#3498db', icon: '↓' };
  if (ratio <= 1.3) return { label: 'Óptimo',   color: '#27ae60', icon: '✓' };
  if (ratio <= 1.5) return { label: 'Atención', color: '#f39c12', icon: '⚠' };
  return              { label: 'Riesgo',    color: '#e74c3c', icon: '⚡' };
}

// ===== FUERZA (NeuroForce) — módulo del atleta =====
// ── Datos ─────────────────────────────────────────────────────────
async function dbLoadAthleteStrength(name) {
  const id = await dbAthleteId(name);
  if (!id) { DATA.strengthEx = []; DATA.athStrToday = {}; DATA.athStrTrend = {}; return; }
  const today = todayStr();
  const [ex, todayRows, trendRows] = await Promise.all([
    DATA.strengthEx ? Promise.resolve(DATA.strengthEx)
                    : sbFetch('strength_exercises?select=id,name,uses_bodyweight&order=id'),
    sbFetch('strength_sets?athlete_id=eq.' + id + '&date=eq.' + today + '&set_num=eq.1&select=exercise_id,load_kg,reps,rir'),
    sbFetch('v_strength_estimation_athlete?select=exercise,date,rm_est&order=date.asc')
  ]);
  DATA.strengthEx = ex || [];
  const tmap = {}; (todayRows || []).forEach(function (r) { tmap[r.exercise_id] = { load: r.load_kg, reps: r.reps, rir: r.rir }; });
  DATA.athStrToday = tmap;
  const trend = {}; (trendRows || []).forEach(function (r) { (trend[r.exercise] = trend[r.exercise] || []).push(r.rm_est); });
  DATA.athStrTrend = trend;
}

async function dbSaveStrengthSet(name, exerciseId, load, reps, rir, sessionId) {
  const id = await dbAthleteId(name);
  if (!id) return null;
  // Upsert atómico por (athlete_id, exercise_id, date, set_num) — mismo patrón que RPE.
  const res = await sbFetch('strength_sets?on_conflict=athlete_id,exercise_id,date,set_num', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=representation',
    body: JSON.stringify({
      athlete_id: id, exercise_id: exerciseId, date: todayStr(), set_num: 1,
      load_kg: load, reps: reps, rir: rir,
      is_estimation: (Number(rir) === 0),   // solo la serie a RIR 0 alimenta el 1RM
      phase: 'intensification',
      session_id: sessionId || null          // enlaza la serie al entreno de físico del día
    })
  });
  DATA.athStrTrend = undefined;             // fuerza recarga de la tendencia
  return res;
}

// ── Mini-sparkline (SVG) ──────────────────────────────────────────
function strengthSpark(data, w, h) {
  w = w || 110; h = h || 32;
  if (!data || data.length < 2) return '';
  const min = Math.min.apply(null, data), max = Math.max.apply(null, data), rng = (max - min) || 1;
  const pts = data.map(function (v, i) {
    return [(i / (data.length - 1)) * (w - 4) + 2, h - 4 - ((v - min) / rng) * (h - 8)];
  });
  const dPath = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  const last = pts[pts.length - 1];
  return '<svg width="' + w + '" height="' + h + '" style="display:block">'
    + '<path d="' + dPath + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="var(--accent)"/></svg>';
}

// ── Pantalla ──────────────────────────────────────────────────────
// Ejercicio del catálogo → campo de texto libre que el coach escribió
// en la sesión de físico para esa categoría biomecánica (Pull/Push/Lower Body).
const STRENGTH_NOTE_FIELD = { 1: 'pullText', 2: 'pushText', 3: 'lowerText' };

function buildAthleteStrength() {
  const d = document.createElement('div');
  const st = document.createElement('div'); st.className = 'section-title'; st.textContent = 'FUERZA';
  d.appendChild(st);

  // Igual que Mi RPE: Fuerza cuelga de la sesión programada para hoy.
  // Solo se habilita si hay un turno con phase === 'Fuerza' (entreno de físico).
  const today = todayStr();
  const rawSession = getSession(today);
  const slots = daySlots(rawSession);
  const fuerzaSlot = slots.find(function (s) { return s.sess && s.sess.phase === 'Fuerza'; });

  if (!fuerzaSlot) {
    const empty = document.createElement('div'); empty.className = 'card';
    empty.innerHTML = '<div class="card-sub" style="text-align:center">Hoy no tienes entreno de físico programado.</div>';
    d.appendChild(empty);
    return d;
  }
  const sessObj = fuerzaSlot.sess;
  const sessionId = sessObj._id || null;

  // Carga perezosa (patrón cache-then-render)
  if (DATA.athStrTrend === undefined) {
    if (!S._strLoading) {
      S._strLoading = true;
      dbLoadAthleteStrength(S.athleteName).then(function () { S._strLoading = false; render(); });
    }
    const loading = document.createElement('div'); loading.className = 'card';
    loading.innerHTML = '<div class="card-sub" style="text-align:center">Cargando…</div>';
    d.appendChild(loading);
    return d;
  }

  S.strInput = S.strInput || {};

  const intro = document.createElement('div'); intro.className = 'card'; intro.style.marginBottom = '16px';
  intro.innerHTML = '<div class="card-title">' + (sessObj.title || 'Físico · hoy') + '</div>'
    + '<div class="card-sub">Registra el peso, las reps y el RIR de tu serie principal. Tu 1RM va subiendo con el tiempo.</div>';
  d.appendChild(intro);

  (DATA.strengthEx || []).forEach(function (ex) {
    const saved = DATA.athStrToday[ex.id];
    if (S.strInput[ex.id] === undefined) {
      S.strInput[ex.id] = saved
        ? { load: saved.load, reps: saved.reps, rir: saved.rir }
        : { load: '', reps: '', rir: '' };
    }
    const inputVal = S.strInput[ex.id];
    const trend = DATA.athStrTrend[ex.name] || [];
    const lastRm = trend.length ? trend[trend.length - 1] : null;
    const noteTxt = sessObj[STRENGTH_NOTE_FIELD[ex.id]];

    const card = document.createElement('div'); card.className = 'card'; card.style.marginBottom = '12px';

    // cabecera: nombre + 1RM estimado
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px';
    head.innerHTML = '<div class="card-title" style="margin:0">' + ex.name + '</div>'
      + '<div style="text-align:right">'
      + '<div style="font-size:0.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--text3)">1RM est.</div>'
      + '<div style="font-family:monospace;font-weight:700;font-size:1.3rem;color:var(--text)">' + (lastRm != null ? lastRm : '—') + '<span style="font-size:0.7rem;color:var(--text3)"> kg</span></div>'
      + '</div>';
    card.appendChild(head);

    // nota del coach para esta categoría (Pull/Push/Lower Body) — si escribió algo
    if (noteTxt) {
      const note = document.createElement('div');
      note.style.cssText = 'font-size:0.78rem;color:var(--text2);background:rgba(41,128,185,0.08);border-radius:8px;padding:8px 10px;margin-bottom:12px;white-space:pre-wrap';
      note.textContent = noteTxt;
      card.appendChild(note);
    }

    // inputs carga / reps / rir
    const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:10px;margin-bottom:10px';
    [['load', 'Carga', 'kg'], ['reps', 'Reps', ''], ['rir', 'RIR', '']].forEach(function (f) {
      const wrap = document.createElement('div'); wrap.style.flex = '1';
      const lbl = document.createElement('div'); lbl.className = 'field-label'; lbl.textContent = f[1] + (f[2] ? ' (' + f[2] + ')' : '');
      const inp = document.createElement('input'); inp.type = 'number'; inp.inputMode = 'decimal';
      inp.value = inputVal[f[0]]; inp.placeholder = '—';
      inp.oninput = function (e) { S.strInput[ex.id][f[0]] = e.target.value; };  // sin render: no pierde foco
      wrap.appendChild(lbl); wrap.appendChild(inp); row.appendChild(wrap);
    });
    card.appendChild(row);

    // tendencia
    if (trend.length >= 2) {
      const sp = document.createElement('div'); sp.style.cssText = 'display:flex;justify-content:flex-end;margin-bottom:10px';
      sp.innerHTML = strengthSpark(trend);
      card.appendChild(sp);
    }

    // guardar
    const btn = document.createElement('button'); btn.className = 'btn btn-primary';
    btn.textContent = saved ? 'Actualizar' : 'Guardar';
    btn.onclick = function () {
      const v = S.strInput[ex.id];
      if (v.load === '' || v.reps === '') { alert('Pon al menos carga y reps'); return; }
      btn.disabled = true; btn.textContent = 'Guardando…';
      dbSaveStrengthSet(S.athleteName, ex.id, Number(v.load), Number(v.reps), v.rir === '' ? null : Number(v.rir), sessionId)
        .then(function (res) {
          if (!res) {
            btn.disabled = false; btn.textContent = '⚠ No se guardó — reintenta';
            btn.style.background = '#e74c3c';
            setTimeout(function () { btn.textContent = 'Guardar'; btn.style.background = ''; }, 2800);
            return;
          }
          S.strInput[ex.id] = undefined;   // reseed desde lo guardado
          render();
        });
    };
    card.appendChild(btn);
    d.appendChild(card);
  });

  return d;
}

function buildPin() {

  title.textContent = 'PIN Entrenador'; title.style.fontSize = '1.2rem';
