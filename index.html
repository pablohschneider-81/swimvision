}

function RealSingleLegJumpFlow({ onSave, onContinue, onAbort }) {
  const [phase, setPhase] = useState("instructions");
  const [errorMessage, setErrorMessage] = useState("");
  const [bodyStatus, setBodyStatus] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [result, setResult] = useState(null);
  const [saved, setSaved] = useState(false);
  const [jumpProgress, setJumpProgress] = useState({ stage: "STANDING", invalid: false, reason: null });
  const [completedSides, setCompletedSides] = useState([]);
  const [cameraFacingMode] = useState("user");

  const videoRef = useRef(null);
  const landmarksRef = useRef(null);
  const landmarkerRef = useRef(null);
  const rafRef = useRef(null);
  const phaseRef = useRef(phase);
  const historyRef = useRef([]);
  const qualitySamplesRef = useRef([]);
  const frameCountersRef = useRef({ total: 0, valid: 0, lost: 0 });
  const cameraJitterRef = useRef([]);
  const prevShoulderMidRef = useRef(null);
  const sendingRef = useRef(false);
  const stageRef = useRef("STANDING");
  const stableSearchCountRef = useRef(0);
  const lastUiUpdateRef = useRef(0);
  const sideIndexRef = useRef(0);
  const validJumpsRef = useRef([]);
  const currentJumpRef = useRef({ side: "right", descentStartTime: null, takeoffTime: null, landingTime: null });
  const standingHipYRef = useRef(null);
  const standingAnkleYRef = useRef(null);
  const stanceAnkleIndexRef = useRef(null);
  const criticalLostStreakRef = useRef(0);
  const phaseStartRef = useRef(null);
  const transitionsRef = useRef([]);
  const testStartTimeRef = useRef(null);
  const testEndTimeRef = useRef(null);
  const readyTimeoutRef = useRef(null);
  const unmountedRef = useRef(false);

  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const cleanupLoop = () => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = null;
  };
  useEffect(() => () => {
    unmountedRef.current = true;
    cleanupLoop();
    clearTimeout(readyTimeoutRef.current);
  }, []);

  const goToDemo = (message) => {
    cleanupLoop();
    if (message) setErrorMessage(message);
    setPhase("error");
  };

  const applyDemoResult = () => {
    cleanupLoop();
    const assessmentId = `assessment_${Date.now()}`;
    const raw = analyzeDemoSingleLegJump();
    const measurements = buildMeasurements({ assessmentId, testId: SLJ_TEST.id, raw, source: "camera", isDemo: true });
    const assessment = {
      id: assessmentId, testId: SLJ_TEST.id, timestamp: new Date().toISOString(), status: "completed",
      captures: [], reps: null, captureQuality: null, measurements,
    };
    setResult(assessment);
    setPhase("completed");
  };

  // Fija el tobillo de apoyo (detectStanceAnkleIndex) en este instante —
  // el atleta debe estar YA equilibrado sobre una pierna al llamarse esto,
  // por eso solo se invoca desde confirmReady(), tras una pantalla de
  // confirmación manual, nunca automáticamente al terminar el salto anterior.
  const resetSideAttempt = (startTimestamp) => {
    const lm = landmarksRef.current;
    const side = SLJ_SIDES[sideIndexRef.current];
    stageRef.current = "STANDING";
    currentJumpRef.current = { side, descentStartTime: null, takeoffTime: null, landingTime: null };
    const hy = lm ? hipY(lm) : null;
    const stanceIdx = lm ? detectStanceAnkleIndex(lm) : null;
    stanceAnkleIndexRef.current = stanceIdx;
    const ay = lm && stanceIdx != null ? stanceAnkleY(lm, stanceIdx) : null;
    historyRef.current = [{ t: startTimestamp, hipY: hy, ankleY: ay }];
    standingHipYRef.current = hy;
    standingAnkleYRef.current = ay;
    qualitySamplesRef.current = [];
    frameCountersRef.current = { total: 0, valid: 0, lost: 0 };
    criticalLostStreakRef.current = 0;
    phaseStartRef.current = startTimestamp;
    transitionsRef.current = [];
    setJumpProgress({ stage: "STANDING", invalid: false, reason: null });
  };

  const failJump = (reason) => {
    stageRef.current = "INVALID";
    setJumpProgress((p) => ({ ...p, invalid: true, reason }));
  };

  const retryCurrentJump = () => {
    resetSideAttempt(performance.now());
    setPhase("recording");
  };

  const finalizeSideJump = (landingTime) => {
    const ev = currentJumpRef.current;
    const captureQuality = buildCaptureQuality({
      samples: qualitySamplesRef.current,
      frameCounters: frameCountersRef.current,
      cameraJitter: cameraJitterRef.current,
    });
    const flightTime = calculateSitToStandDuration(ev.takeoffTime, landingTime);
    const jump = {
      side: ev.side,
      descentStartTime: ev.descentStartTime,
      takeoffTime: ev.takeoffTime,
      landingTime,
      flightTime,
      jumpHeight: calculateCmjJumpHeight(flightTime),
      quality: captureQuality.overall,
      valid: true,
      invalidReason: null,
      captureQuality,
      measurementQuality: captureQuality.modelConfidence,
      stateTransitions: transitionsRef.current,
    };
    validJumpsRef.current = [...validJumpsRef.current, jump];
    setCompletedSides(validJumpsRef.current);

    if (sideIndexRef.current >= SLJ_SIDES.length - 1) {
      cleanupLoop();
      testEndTimeRef.current = landingTime;
      const jumps = validJumpsRef.current;
      const heightRight = jumps.find((j) => j.side === "right")?.jumpHeight ?? null;
      const heightLeft = jumps.find((j) => j.side === "left")?.jumpHeight ?? null;
      const aggQuality = aggregateRepCaptureQualities(jumps);
      const assessmentId = `assessment_${Date.now()}`;
      const measurements = createSingleLegJumpScientificMeasurements({ assessmentId, testId: SLJ_TEST.id, heightRight, heightLeft, aggQuality });
      const assessment = {
        id: assessmentId, testId: SLJ_TEST.id, timestamp: new Date().toISOString(), status: "completed",
        captures: [], reps: jumps, captureQuality: aggQuality, measurements,
      };
      setResult(assessment);
      setPhase("completed");
      return;
    }

    sideIndexRef.current += 1;
    setPhase("switch_side"); // confirmación manual antes de fijar el tobillo de la otra pierna
  };

  const STILL_PHASES = ["body_searching", "body_detected", "ready_to_start"];
  const CRITICAL_STAGES = ["DESCENDING", "AIRBORNE"];

  const processFrame = (lm) => {
    const currentPhase = phaseRef.current;
    const now = performance.now();
    landmarksRef.current = lm;

    const status = detectBody(lm);
    const framing = lm ? computeFramingQuality(lm) : null;
    const stage = stageRef.current;

    if (currentPhase === "recording" && stage !== "INVALID") {
      frameCountersRef.current.total += 1;
      const isValidFrame = status.detected && status.bodyFullyVisible;
      if (isValidFrame) {
        frameCountersRef.current.valid += 1;
        criticalLostStreakRef.current = 0;
      } else {
        frameCountersRef.current.lost += 1;
        if (CRITICAL_STAGES.includes(stage)) {
          criticalLostStreakRef.current += 1;
          if (criticalLostStreakRef.current >= CMJ_THRESHOLDS.maxCriticalLostFrames) {
            failJump("Cuerpo no detectado durante el salto");
          }
        }
      }

      qualitySamplesRef.current.push({ ...status, framing });
      if (qualitySamplesRef.current.length > 600) qualitySamplesRef.current.shift();

      if (lm) {
        // A diferencia del CMJ bipodal: se sigue el tobillo de APOYO
        // específico (stanceAnkleIndexRef), no el promedio de ambos —
        // el otro tobillo está deliberadamente elevado todo el salto.
        historyRef.current.push({ t: now, hipY: hipY(lm), ankleY: stanceAnkleY(lm, stanceAnkleIndexRef.current) });
        if (historyRef.current.length > 300) historyRef.current.shift();
      }
    }

    if (lm && STILL_PHASES.includes(currentPhase)) {
      const mid = shoulderMid(lm);
      const prevMid = prevShoulderMidRef.current;
      if (mid && prevMid) {
        const dx = mid.x - prevMid.x, dy = mid.y - prevMid.y;
        cameraJitterRef.current.push(Math.sqrt(dx * dx + dy * dy));
        if (cameraJitterRef.current.length > 90) cameraJitterRef.current.shift();
      }
      prevShoulderMidRef.current = mid;
    } else if (!lm) {
      prevShoulderMidRef.current = null;
    }

    if (now - lastUiUpdateRef.current > 200) {
      lastUiUpdateRef.current = now;
      setBodyStatus({ ...status, framing });
      if (currentPhase === "recording" && currentJumpRef.current.descentStartTime != null) {
        setElapsed(+((now - currentJumpRef.current.descentStartTime) / 1000).toFixed(1));
      } else if (currentPhase === "recording") {
        setElapsed(0);
      }
    }

    if (currentPhase === "body_searching") {
      stableSearchCountRef.current = status.bodyFullyVisible && status.detected ? stableSearchCountRef.current + 1 : 0;
      if (stableSearchCountRef.current >= CMJ_THRESHOLDS.stabilityFrames) {
        setPhase("body_detected");
      }
      return;
    }

    if (currentPhase !== "recording" || stage === "INVALID" || !lm) return;

    if (stage === "STANDING") {
      if (detectCmjDescentStart(historyRef.current, standingHipYRef.current)) {
        stageRef.current = "DESCENDING";
        currentJumpRef.current.descentStartTime = now;
        phaseStartRef.current = now;
        transitionsRef.current.push({ stage: "DESCENDING", t: now });
        setJumpProgress((p) => ({ ...p, stage: "DESCENDING" }));
      } else if (now - phaseStartRef.current > CMJ_THRESHOLDS.maxStandingWaitMs) {
        failJump("No se detectó el inicio del salto. Asegúrate de estar en apoyo unipodal antes de saltar.");
      }
    } else if (stage === "DESCENDING") {
      if (detectCmjTakeoff(historyRef.current, standingAnkleYRef.current)) {
        stageRef.current = "AIRBORNE";
        currentJumpRef.current.takeoffTime = now;
        phaseStartRef.current = now;
        transitionsRef.current.push({ stage: "AIRBORNE", t: now });
        setJumpProgress((p) => ({ ...p, stage: "AIRBORNE" }));
      } else if (now - phaseStartRef.current > CMJ_THRESHOLDS.maxPhaseDurationMs) {
        failJump("Despegue no detectado");
      }
    } else if (stage === "AIRBORNE") {
      if (detectCmjLanding(historyRef.current, standingAnkleYRef.current)) {
        stageRef.current = "STANDING";
        transitionsRef.current.push({ stage: "LANDED", t: now });
        finalizeSideJump(now);
      } else if (now - phaseStartRef.current > CMJ_THRESHOLDS.maxPhaseDurationMs) {
        failJump("Aterrizaje no detectado");
      }
    }
  };

  const runDetectionLoop = () => {
    const pose = landmarkerRef.current;
    if (!pose) return;
    pose.onResults((results) => processFrame(results?.poseLandmarks || null));

    const pushFrame = async () => {
      if (rafRef.current === null) return;
      const video = videoRef.current;
      const currentPhase = phaseRef.current;
      if (video && video.readyState >= 2 && currentPhase !== "completed" && currentPhase !== "error" && !sendingRef.current) {
        sendingRef.current = true;
        try {
          await pose.send({ image: video });
        } catch {
          processFrame(null);
        } finally {
          sendingRef.current = false;
        }
      }
      if (rafRef.current !== null) rafRef.current = requestAnimationFrame(pushFrame);
    };
    rafRef.current = requestAnimationFrame(pushFrame);
  };

  const beginCapture = async () => {
    setPhase("camera_permission");
    try {
      const pose = await loadPoseModel();
      landmarkerRef.current = pose;
    } catch (err) {
      console.error("Fallo al cargar el motor de pose:", err);
      const detail = err?.message ? ` (${err.message})` : "";
      goToDemo(`No se pudo cargar el motor de detección de pose${detail}. Puedes usar la demostración.`);
    }
  };

  const onCameraReady = () => {
    if (phaseRef.current === "error" || unmountedRef.current) return;
    setPhase("camera_ready");
    readyTimeoutRef.current = setTimeout(() => {
      if (unmountedRef.current || phaseRef.current === "error") return;
      setPhase("body_searching");
      stableSearchCountRef.current = 0;
      runDetectionLoop();
    }, 200);
  };

  const onCameraError = (err) => {
    const detail = err?.message ? ` (${err.message})` : "";
    goToDemo(`No se pudo acceder a la cámara${detail}. Comprueba los permisos o usa la demostración.`);
  };

  useEffect(() => {
    if (phase !== "body_detected") return undefined;
    const t = setTimeout(() => setPhase("ready_to_start"), 500);
    return () => clearTimeout(t);
  }, [phase]);

  // Primera pierna: tras pulsar INICIAR, pasa por "get_ready" (confirmación
  // manual) antes de fijar el tobillo de referencia — no automáticamente.
  const handleStart = () => {
    testStartTimeRef.current = performance.now();
    testEndTimeRef.current = null;
    sideIndexRef.current = 0;
    validJumpsRef.current = [];
    setCompletedSides([]);
    setPhase("get_ready");
  };

  // Usado tanto desde "get_ready" (primera pierna) como desde
  // "switch_side" (segunda pierna) — mismo botón, mismo criterio.
  const confirmReady = () => {
    const now = performance.now();
    resetSideAttempt(now);
    setElapsed(0);
    setPhase("recording");
  };

  const handleSave = () => {
    onSave(result);
    setSaved(true);
  };

  const showCamera = ["camera_ready", "body_searching", "body_detected", "ready_to_start", "get_ready", "switch_side", "recording"].includes(phase);
  const currentSideLabel = SLJ_SIDE_LABELS[SLJ_SIDES[sideIndexRef.current]] || "";

  return (
    <div className="space-y-4">
      {phase !== "completed" && (
        <div className="flex items-center justify-between">
          <button onClick={onAbort} className="flex items-center gap-1.5 rounded-full px-3 py-1.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <ChevronLeft size={15} color={C.inkSoft} />
            <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Abandonar</span>
          </button>
          <button onClick={applyDemoResult} className="rounded-full px-3 py-1.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5, fontWeight: 600 }}>Usar demostración</span>
          </button>
        </div>
      )}

      {phase === "instructions" && (
        <div className="space-y-3">
          <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div style={{ ...fontDisplay, color: C.text, fontSize: 16, fontWeight: 600 }}>{SLJ_TEST.name} — captura real</div>
            <div className="rounded-lg p-3 mt-3 flex items-start gap-2" style={{ background: C.paper }}>
              <Info size={15} color={C.inkSoft} className="mt-0.5 shrink-0" />
              <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5, lineHeight: 1.5 }}>
                Un salto por pierna — despegue y aterrizaje con la misma. No se graba ni se sube ningún vídeo.
              </span>
            </div>
            <ul className="space-y-2 mt-3">
              {SLJ_TEST.protocol.instructions.map((t) => (
                <li key={t} className="flex items-start gap-2">
                  <Check size={14} color={C.teal} className="mt-0.5 shrink-0" />
                  <span style={{ ...fontBody, color: C.inkSoft, fontSize: 13.5 }}>{t}</span>
                </li>
              ))}
            </ul>
          </div>
          <button onClick={beginCapture} className="w-full flex items-center justify-center gap-2 rounded-xl py-3.5" style={{ background: C.teal }}>
            <span style={{ ...fontBody, color: "#04150D", fontSize: 14, fontWeight: 700 }}>Activar cámara</span>
            <ChevronRight size={16} color="#04150D" />
          </button>
        </div>
      )}

      {phase === "camera_permission" && !showCamera && (
        <div className="rounded-2xl p-8 flex flex-col items-center gap-3" style={{ background: C.ink }}>
          <Loader2 size={24} className="animate-spin" color={C.teal} />
          <span style={{ ...fontBody, color: "#fff", fontSize: 14 }}>Solicitando acceso a la cámara…</span>
        </div>
      )}

      {(phase === "camera_permission" || showCamera) && (
        <div
          className="relative rounded-2xl overflow-hidden"
          style={{ aspectRatio: "4/5", background: C.ink, display: phase === "camera_permission" && !showCamera ? "none" : "block" }}
        >
          <RealCameraCapture videoRef={videoRef} active={true} onReady={onCameraReady} onError={onCameraError} facingMode={cameraFacingMode} />
          <PoseDetectionOverlay landmarksRef={landmarksRef} />

          <div className="absolute inset-x-0 top-0 p-3 flex justify-between items-start">
            <span style={{ ...fontMono, color: "#fff", fontSize: 10, background: "rgba(0,0,0,0.4)" }} className="px-2 py-1 rounded uppercase tracking-wide">
              {phase.replace(/_/g, " ")}
            </span>
          </div>

          <div className="absolute inset-x-0 bottom-0 p-4 flex flex-col items-center gap-2" style={{ background: "linear-gradient(transparent, rgba(0,0,0,0.55))" }}>
            {phase === "camera_ready" && (
              <span style={{ ...fontBody, color: "#fff", fontSize: 13 }}>Colócate de perfil, cuerpo completo</span>
            )}
            {phase === "body_searching" && (
              <span style={{ ...fontBody, color: "#fff", fontSize: 13 }} className="flex items-center gap-2">
                <Loader2 size={14} className="animate-spin" /> Buscando persona…
              </span>
            )}
            {phase === "body_detected" && (
              <span style={{ ...fontMono, color: C.teal, fontSize: 13, fontWeight: 600 }} className="flex items-center gap-2">
                <Check size={16} /> Persona detectada
              </span>
            )}
            {phase === "ready_to_start" && (
              <button onClick={handleStart} className="rounded-full px-6 py-3" style={{ background: C.teal }}>
                <span style={{ ...fontBody, color: "#04150D", fontSize: 14, fontWeight: 700 }}>INICIAR</span>
              </button>
            )}
            {(phase === "get_ready" || phase === "switch_side") && (
              <div className="flex flex-col items-center gap-2 w-full">
                <span style={{ ...fontBody, color: "#fff", fontSize: 13.5, fontWeight: 600 }} className="text-center">
                  Ponte en apoyo unipodal sobre la {currentSideLabel}, con la otra rodilla flexionada
                </span>
                <button onClick={confirmReady} className="rounded-full px-6 py-3" style={{ background: C.teal }}>
                  <span style={{ ...fontBody, color: "#04150D", fontSize: 14, fontWeight: 700 }}>Continuar</span>
                </button>
              </div>
            )}
            {phase === "recording" && !jumpProgress.invalid && (
              <div className="flex flex-col items-center gap-1.5">
                <span style={{ ...fontMono, color: "#fff", fontSize: 12, fontWeight: 600 }} className="uppercase tracking-wide">
                  {currentSideLabel} · {CMJ_STAGE_LABELS[jumpProgress.stage] || jumpProgress.stage}
                </span>
                <span style={{ ...fontMono, color: C.teal, fontSize: 28, fontWeight: 600 }}>{elapsed.toFixed(1)}s</span>
              </div>
            )}
            {phase === "recording" && jumpProgress.invalid && (
              <div className="flex flex-col items-center gap-2 w-full">
                <span style={{ ...fontMono, color: "#fff", fontSize: 12, fontWeight: 600 }} className="flex items-center gap-1.5">
                  <AlertCircle size={14} color={C.coral} /> Salto no válido
                </span>
                <span style={{ ...fontBody, color: "#fff", fontSize: 12.5 }} className="text-center">{jumpProgress.reason}</span>
                <button onClick={retryCurrentJump} className="rounded-full px-5 py-2.5" style={{ background: C.teal }}>
                  <span style={{ ...fontBody, color: "#04150D", fontSize: 13, fontWeight: 700 }}>Reintentar</span>
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {phase === "recording" && completedSides.length > 0 && (
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div style={{ ...fontDisplay, color: C.text, fontSize: 13.5, fontWeight: 600 }} className="mb-2">Piernas registradas</div>
          <div className="flex items-center gap-1.5">
            {SLJ_SIDES.map((side, i) => (
              <div key={side} className="flex-1 rounded-full" style={{ height: 6, background: i < completedSides.length ? C.teal : C.line }} />
            ))}
          </div>
        </div>
      )}

      {showCamera && phase !== "recording" && phase !== "get_ready" && phase !== "switch_side" && (
        <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div style={{ ...fontDisplay, color: C.text, fontSize: 13.5, fontWeight: 600 }} className="mb-2">Calidad de captura</div>
          <CaptureQualityIndicator status={bodyStatus} />
        </div>
      )}

      {phase === "error" && (
        <div className="rounded-2xl p-5 space-y-3" style={{ background: C.coralSoft }}>
          <div className="flex items-center gap-2">
            <AlertCircle size={18} color={C.coral} />
            <span style={{ ...fontBody, color: C.coral, fontSize: 13.5 }}>{errorMessage || "No se pudo completar la captura real."}</span>
          </div>
          <button onClick={applyDemoResult} className="w-full rounded-xl py-3" style={{ background: C.ink }}>
            <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Usar demostración</span>
          </button>
        </div>
      )}

      {phase === "completed" && result && (
        <SingleLegJumpResult assessment={result} onSave={handleSave} saved={saved} onContinue={onContinue} />
      )}
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */

function App() {
  const [view, setView] = useState("dashboard");
  const authState = useAuthState(); // estado centralizado — sección 3 del ticket
  const [loginNotice, setLoginNotice] = useState("");
  // Historial longitudinal — visual, en memoria; alimenta Dashboard/
  // Resultados/Perfil/Historial exactamente como antes. Al reanudar una
  // evaluación in_progress tras recargar, se reconstruye desde el
  // Assessment real (ver useEffect de abajo) — no se pierde entre
  // reload y reload, aunque este array en sí no sea lo persistido.
  const [assessmentHistory, setAssessmentHistory] = useState([]);
  // Evaluación real en curso (Assessment con sus 8 TestResult),
  // persistida en LocalAssessmentRepository. null = no hay ninguna
  // "Nueva evaluación" activa todavía.
  const [activeAssessment, setActiveAssessment] = useState(null);

  // Al montar (equivalente a "recargar la app"): ¿hay una evaluación
  // in_progress guardada? Si la hay, se reanuda — nunca se crea una
  // nueva automáticamente — y se reconstruye el historial visual de
  // sus pruebas ya completadas.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const all = await getAssessmentHistory();
        if (cancelled) return;
        const inProgress = all.find((a) => a.status === ASSESSMENT_STATUS.IN_PROGRESS);
        if (inProgress) {
          setActiveAssessment(inProgress);
          const completedEntries = (inProgress.testResults || [])
            .filter((t) => t.status === TEST_RESULT_STATUS.COMPLETED)
            .map((t) => fromTestResultToHistoryEntry(t, inProgress.id))
            .sort((a, b) => new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime());
          if (completedEntries.length > 0) setAssessmentHistory(completedEntries);
        }
      } catch (err) {
        console.error("No se pudo comprobar si hay una evaluación en curso:", err);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const addAssessment = (assessment) => {
    setAssessmentHistory((h) => [assessment, ...h]);
    // Sincroniza la prueba recién completada con el Assessment real, si
    // hay uno activo (siempre lo hay dentro del flujo guiado de "Nueva
    // evaluación"; si no lo hay —p.ej. un uso suelto futuro— no hay
    // nada que sincronizar y el historial visual sigue funcionando igual).
    setActiveAssessment((current) => {
      if (!current) return current;
      const testResult = toTestResult(assessment);
      let updated = addTestResultToAssessment(current, testResult);
      if (canCompleteAssessment(updated)) updated = closeAssessment(updated);
      assessmentRepository.updateAssessment(updated.id, updated).catch((err) => {
        console.error("No se pudo guardar la evaluación:", err);
      });
      return updated;
    });
  };

  // Punto de entrada único a "Nueva evaluación": reanuda si ya hay una
  // in_progress, o crea y persiste una nueva de 8 TestResult si no.
  // En modo "supabase" (nunca activo por defecto), exige sesión antes
  // de intentar persistir nada remoto — el modo "local" nunca lo pide.
  const goToEvaluacion = async () => {
    if (REPOSITORY_MODE === "supabase" && !authState.authenticated) {
      setLoginNotice("Necesitas iniciar sesión para guardar tus evaluaciones.");
      setView("login");
      return;
    }
    if (!activeAssessment || activeAssessment.status !== ASSESSMENT_STATUS.IN_PROGRESS) {
      const fresh = startNewAssessmentRecord();
      try {
        await assessmentRepository.createAssessment(fresh);
        setActiveAssessment(fresh);
      } catch (err) {
        console.error("No se pudo crear la evaluación:", err);
      }
    }
    setView("evaluacion");
  };

  const handleSignOut = async () => {
    await AuthService.signOut();
    setView("dashboard");
  };

  const screens = {
    dashboard: <Dashboard setView={setView} assessmentHistory={assessmentHistory} activeAssessment={activeAssessment} onStartEvaluation={goToEvaluacion} />,
    evaluacion: <Evaluacion setView={setView} addAssessment={addAssessment} activeAssessment={activeAssessment} />,
    salud: <Salud />,
    resultados: <Resultados setView={setView} assessmentHistory={assessmentHistory} />,
    informe: <Informe setView={setView} assessmentHistory={assessmentHistory} />,
    historial: <Historial setView={setView} assessmentHistory={assessmentHistory} />,
    perfil: <Perfil setView={setView} assessmentHistory={assessmentHistory} authState={authState} onSignOut={handleSignOut} />,
    ciencia: <Ciencia setView={setView} />,
    informe_evaluacion: <InformeEvaluacionScreen setView={setView} assessmentHistory={assessmentHistory} />,
    login: <LoginScreen setView={setView} notice={loginNotice} />,
    register: <RegisterScreen setView={setView} />,
  };

  return (
    <div style={{ ...fontBody, background: C.paper, minHeight: "100vh", position: "relative" }}>
      <FontImport />
      {/* Glow verde sutil — capa puramente decorativa entre el fondo y las
          superficies de vidrio (sección 12). No intercepta interacción. */}
      <div
        aria-hidden="true"
        style={{
          position: "fixed", inset: 0, zIndex: 0, pointerEvents: "none",
          background:
            "radial-gradient(circle at 15% -10%, rgba(24,166,106,0.16), transparent 55%), " +
            "radial-gradient(circle at 100% 100%, rgba(24,166,106,0.10), transparent 50%)",
        }}
      />
      <div className="flex" style={{ minHeight: "100vh", position: "relative", zIndex: 1 }}>
        <Sidebar view={view} setView={setView} />
        <main className="flex-1" style={{ maxWidth: 960, margin: "0 auto", width: "100%" }}>
          {screens[view]}
        </main>
      </div>
      <BottomNav view={view} setView={setView} />
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
