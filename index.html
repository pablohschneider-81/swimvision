/* ---------- Orquestador del flujo: AssessmentFlow ----------
   not_started → instructions → camera_setup → capture (xN) →
   processing → completed | error
   Genérico desde esta iteración: recibe `test` (TestDefinition) y
   `ResultsComponent` (pantalla de resultados propia de ese test).
   Añadir un test nuevo = añadir su TestDefinition + su analyzeXxx +
   su pantalla de resultados — este componente no cambia. */

function CameraAssessment({ test, ResultsComponent, onSave, onContinue, onAbort }) {
  const [phase, setPhase] = useState("not_started");
  const [captureIndex, setCaptureIndex] = useState(0);
  const [captures, setCaptures] = useState([]);
  const [result, setResult] = useState(null);
  const [saved, setSaved] = useState(false);

  const views = test.views.map((id) => ({ id, label: VIEW_LABELS[id] || id }));
  const captureMode =
    test.captureType === "repetition" ? "video_reps" :
    test.captureType === "timed_hold" ? "timed_hold" :
    "photo";

  const acceptCapture = (capture) => {
    const updated = [...captures, capture];
    setCaptures(updated);
    if (captureIndex + 1 < views.length) {
      setCaptureIndex((i) => i + 1);
      return;
    }
    setPhase("processing");
    setTimeout(() => {
      const assessmentId = `assessment_${Date.now()}`;
      const analysis = analyzeTest(test.id, updated);
      setResult({
        id: assessmentId,
        testId: test.id,
        timestamp: new Date().toISOString(),
        status: "completed",
        captures: updated,
        captureQuality: analysis.captureQuality,
        reps: analysis.reps || null, // solo lo usan tests con repeticiones (p.ej. sentadilla, sit-to-stand)
        sides: analysis.sides || null, // solo lo usa equilibrio unipodal (resultado por lado)
        measurements: buildMeasurements({
          assessmentId,
          testId: test.id,
          raw: analysis.measurements,
          source: "camera",
          isDemo: true,
        }),
      });
      setPhase("completed");
    }, 1800);
  };

  const save = () => { onSave(result); setSaved(true); };

  const backOnePhase = () => {
    if (phase === "instructions") setPhase("not_started");
    else if (phase === "camera_setup") setPhase("instructions");
    else if (phase === "capture" && captureIndex > 0) setCaptureIndex((i) => i - 1);
    else onAbort();
  };

  return (
    <div className="space-y-4">
      {phase !== "completed" && (
        <div className="flex items-center justify-between">
          <button onClick={backOnePhase} className="flex items-center gap-1.5 rounded-full px-3 py-1.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <ChevronLeft size={15} color={C.inkSoft} />
            <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Atrás</span>
          </button>
          <button onClick={onAbort} className="rounded-full px-3 py-1.5" style={{ background: C.coralSoft }}>
            <span style={{ ...fontBody, color: C.coral, fontSize: 12.5, fontWeight: 600 }}>Abandonar</span>
          </button>
        </div>
      )}

      {phase === "not_started" && (
        <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div style={{ ...fontDisplay, color: C.text, fontSize: 16, fontWeight: 600 }}>{test.name}</div>
          <p style={{ ...fontBody, color: C.inkSoft, fontSize: 13.5 }} className="mt-1.5">{test.description}</p>
          <div className="rounded-lg p-3 mt-3 flex items-start gap-2" style={{ background: C.paper }}>
            <Info size={15} color={C.inkSoft} className="mt-0.5 shrink-0" />
            <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5, lineHeight: 1.5 }}>
              {test.protocol?.intro}
            </span>
          </div>
          <button onClick={() => setPhase("instructions")} className="w-full flex items-center justify-center gap-2 rounded-xl py-3.5 mt-4" style={{ background: C.teal }}>
            <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Comenzar evaluación</span>
            <ChevronRight size={16} color="#fff" />
          </button>
        </div>
      )}

      {phase === "instructions" && (
        <div className="space-y-3">
          <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }} className="mb-2.5">Antes de comenzar</div>
            <ul className="space-y-2">
              {(test.protocol?.instructions || []).map((t) => (
                <li key={t} className="flex items-start gap-2">
                  <Check size={14} color={C.teal} className="mt-0.5 shrink-0" />
                  <span style={{ ...fontBody, color: C.inkSoft, fontSize: 13.5 }}>{t}</span>
                </li>
              ))}
            </ul>
          </div>
          <div className="rounded-2xl p-5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }} className="mb-2.5">Preparación del móvil</div>
            <ul className="space-y-2">
              {(test.protocol?.preparation || []).map((t) => (
                <li key={t} className="flex items-start gap-2">
                  <Check size={14} color={C.teal} className="mt-0.5 shrink-0" />
                  <span style={{ ...fontBody, color: C.inkSoft, fontSize: 13.5 }}>{t}</span>
                </li>
              ))}
            </ul>
          </div>
          {test.protocol?.warning && (
            <div className="rounded-lg p-3 flex items-start gap-2" style={{ background: C.amberSoft }}>
              <AlertCircle size={15} color={C.amber} className="mt-0.5 shrink-0" />
              <span style={{ ...fontBody, color: C.amber, fontSize: 12.5, lineHeight: 1.5, fontWeight: 600 }}>
                {test.protocol.warning}
              </span>
            </div>
          )}
          <button onClick={() => setPhase("camera_setup")} className="w-full flex items-center justify-center gap-2 rounded-xl py-3.5" style={{ background: C.ink }}>
            <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Preparar cámara</span>
            <ChevronRight size={16} color="#fff" />
          </button>
        </div>
      )}

      {phase === "camera_setup" && (
        <CaptureQualityPanel onReady={() => { setCaptureIndex(0); setCaptures([]); setPhase("capture"); }} />
      )}

      {phase === "capture" && (
        <CaptureGuide
          key={captureIndex}
          view={views[captureIndex]}
          index={captureIndex}
          total={views.length}
          onAccept={acceptCapture}
          mode={captureMode}
          reps={test.repsPerView || 5}
          targetSeconds={test.targetDurationSeconds || 30}
        />
      )}

      {phase === "processing" && (
        <div className="rounded-2xl p-8 flex flex-col items-center gap-3" style={{ background: C.ink }}>
          <Loader2 size={24} className="animate-spin" color={C.teal} />
          <span style={{ ...fontBody, color: "#fff", fontSize: 14 }}>
            {captureMode === "video_reps"
              ? "Procesando movimiento…"
              : captureMode === "timed_hold"
              ? "Procesando equilibrio…"
              : "Analizando movimiento y alineación…"}
          </span>
          <KineticTrace color="#2A3540" height={30} seed={7} />
        </div>
      )}

      {phase === "completed" && result && (
        <ResultsComponent assessment={result} onSave={save} saved={saved} onContinue={onContinue} />
      )}

      {phase === "error" && (
        <div className="rounded-2xl p-5 flex items-center gap-3" style={{ background: C.coralSoft }}>
          <AlertCircle size={18} color={C.coral} />
          <span style={{ ...fontBody, color: C.coral, fontSize: 13.5 }}>No se pudo procesar el análisis. Intenta de nuevo.</span>
        </div>
      )}
    </div>
  );
}

function Evaluacion({ setView, addAssessment, activeAssessment = null }) {
  const [stepIndex, setStepIndex] = useState(0);
  const [selectedTest, setSelectedTest] = useState(null);
  const step = EVAL_STEPS[stepIndex];
  const next = () => setStepIndex((i) => Math.min(i + 1, EVAL_STEPS.length - 1));
  const prev = () => (stepIndex === 0 ? setView("dashboard") : setStepIndex((i) => i - 1));

  const completedTestIds = (activeAssessment?.testResults || [])
    .filter((t) => t.status === "completed")
    .map((t) => t.testId);

  // En cuanto las 8 pruebas están completas, salta directamente a "fin"
  // — sin pasar por los pasos movilidad/movimiento/equilibrio/capacidad
  // (arquitectura previa a las 8 pruebas, ajena a este flujo real).
  useEffect(() => {
    if (step.id === "prueba" && !selectedTest && activeAssessment && canCompleteAssessment(activeAssessment)) {
      const finIndex = EVAL_STEPS.findIndex((s) => s.id === "fin");
      if (finIndex >= 0) setStepIndex(finIndex);
    }
  }, [selectedTest, activeAssessment, step.id]);

  return (
    <div className="pb-24 md:pb-10">
      <TopBar title="Evaluación" subtitle={step.label} onBack={prev} />
      <StepProgress index={stepIndex} total={EVAL_STEPS.length} />
      <div className="px-5 md:px-8 mt-5">

        {step.id === "datos" && (
          <div className="space-y-3">
            <Field label="Edad" unit="años" placeholder="34" type="number" />
            <Field label="Sexo" placeholder="Selecciona…" />
            <Field label="Altura" unit="cm" placeholder="178" type="number" />
            <Field label="Peso" unit="kg" placeholder="76" type="number" />
          </div>
        )}

        {step.id === "preparacion" && (
          <div className="rounded-2xl p-5 space-y-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div className="flex items-center gap-2">
              <Info size={16} color={C.teal} />
              <span style={{ ...fontDisplay, color: C.text, fontSize: 15, fontWeight: 600 }}>Antes de empezar</span>
            </div>
            <ul className="space-y-2">
              {["Ropa ajustada, sin prendas holgadas", "Espacio despejado de 2 x 2 m", "Buena iluminación frontal", "Teléfono estable a la altura de la cadera"].map((t) => (
                <li key={t} className="flex items-start gap-2">
                  <Check size={14} color={C.teal} className="mt-0.5" />
                  <span style={{ ...fontBody, color: C.inkSoft, fontSize: 13.5 }}>{t}</span>
                </li>
              ))}
            </ul>
          </div>
        )}

        {step.id === "prueba" && !selectedTest && (
          <TestSelector onSelect={setSelectedTest} completedTestIds={completedTestIds} />
        )}

        {step.id === "prueba" && selectedTest && selectedTest.id === "sit_to_stand" && (
          <RealSitToStandFlow
            onSave={addAssessment}
            onContinue={() => setSelectedTest(null)}
            onAbort={() => setView("dashboard")}
          />
        )}

        {step.id === "prueba" && selectedTest && selectedTest.id === "cmj" && (
          <RealCmjFlow
            onSave={addAssessment}
            onContinue={() => setSelectedTest(null)}
            onAbort={() => setView("dashboard")}
          />
        )}

        {step.id === "prueba" && selectedTest && selectedTest.id === "salto_unipodal" && (
          <RealSingleLegJumpFlow
            onSave={addAssessment}
            onContinue={() => setSelectedTest(null)}
            onAbort={() => setView("dashboard")}
          />
        )}

        {step.id === "prueba" && selectedTest && !["sit_to_stand", "cmj", "salto_unipodal"].includes(selectedTest.id) && (
          <AssessmentFlow
            test={selectedTest}
            ResultsComponent={TEST_RESULTS_COMPONENTS[selectedTest.id]}
            onSave={addAssessment}
            onContinue={() => setSelectedTest(null)}
            onAbort={() => setView("dashboard")}
          />
        )}

        {["movilidad", "movimiento", "equilibrio", "capacidad"].includes(step.id) && (
          <SimpleCameraCapture test={CAMERA_TESTS[step.id]} onDone={next} />
        )}

        {step.id === "fin" && (
          <div className="rounded-2xl p-6 text-center" style={{ background: C.ink }}>
            <div className="mx-auto rounded-full flex items-center justify-center" style={{ width: 52, height: 52, background: C.teal }}>
              <Check size={26} color="#fff" />
            </div>
            <div style={{ ...fontDisplay, color: "#fff", fontSize: 18, fontWeight: 600 }} className="mt-4">Evaluación registrada</div>
            <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 13 }} className="mt-1">Los resultados están disponibles en tu panel.</div>
            <button
              onClick={() => setView("resultados")}
              className="mt-5 w-full rounded-xl py-3"
              style={{ background: C.teal }}
            >
              <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Ver resultados</span>
            </button>
          </div>
        )}

        {(step.id === "datos" || step.id === "preparacion") && (
          <button onClick={next} className="w-full flex items-center justify-center gap-2 rounded-xl py-3.5 mt-5" style={{ background: C.ink }}>
            <span style={{ ...fontBody, color: "#fff", fontSize: 14, fontWeight: 600 }}>Continuar</span>
            <ChevronRight size={16} color="#fff" />
          </button>
        )}
      </div>
    </div>
  );
}

// Extrae la serie temporal real de una variable a partir del
// historial de Assessment guardados (más reciente primero → se
// invierte para mostrar orden cronológico).
function buildVariableSeries(assessmentHistory, variable) {
  return [...assessmentHistory]
    .reverse()
    .map((a) => {
      const m = (a.measurements || []).find((mm) => mm.variable === variable && mm.value != null);
      if (!m) return null;
      return {
        label: new Date(a.timestamp).toLocaleDateString("es-ES", { day: "2-digit", month: "short" }),
        valor: m.value,
      };
    })
    .filter(Boolean);
}

function Historial({ setView, assessmentHistory = [] }) {
  const variableKeys = Object.keys(MEASUREMENT_LABELS);
  const series = variableKeys
    .map((key) => ({ key, unit: null, points: buildVariableSeries(assessmentHistory, key) }))
    .filter((s) => s.points.length > 0);

  return (
    <div className="pb-24 md:pb-10">
      <TopBar title="Historial" subtitle="Evolución temporal" onBack={() => setView("resultados")} />
      <div className="px-5 md:px-8 space-y-3">

/* ============================================================
   MODELO DE DATOS DE EVALUACIÓN — infraestructura, sin conectar a la UI
   ============================================================
   Capa NUEVA y separada de `assessmentHistory` (el estado en memoria
   que ya usan las 8 pruebas vía `addAssessment`/`AssessmentFlow`/
   `RealSitToStandFlow` — eso sigue funcionando exactamente igual, no
   se toca). Esta es una capa superior pensada para cuando conectemos
   persistencia real: un `Assessment` (sesión de evaluación completa)
   puede contener varios `TestResult` (uno por prueba realizada) más
   datos de salud y de perfil. Nada de esto se llama todavía desde
   ningún componente — son los cimientos, no el edificio.

   Assessment
   ├── UserProfile        (opcional)
   ├── healthData[]        (HealthDataRecord — manual o Apple Health)
   ├── TestResult[]        (uno por prueba)
   └── measurements[]      (ScientificMeasurement — agregado de los
                             TestResult, mismas referencias, sin copiar)
   ============================================================ */

/**
 * @typedef {Object} UserProfile
 * @property {string} id
 * @property {string} createdAt
 * @property {string} [sex]
 * @property {number} [birthYear]
 * @property {number} [heightCm]
 * @property {number} [weightKg]
 *
 * ManualAssessmentData — forma fija original del ticket de modelo de
 * datos. Se mantiene como tipo documentado, pero el mecanismo real de
 * almacenamiento pasa a ser `healthData: HealthDataRecord[]` (más
 * abajo), que generaliza esto y además cubre Apple Health. Ver
 * `manualAssessmentDataToHealthRecords()`.
 * @typedef {Object} ManualAssessmentData
 * @property {number} [restingHeartRate]
 * @property {number} [bloodPressureSystolic]
 * @property {number} [bloodPressureDiastolic]
 * @property {number} [dailySteps]
 * @property {number} [sleepDuration]
 * @property {string} [notes]
 *
 * @typedef {Object} TestResult
 * @property {string} testId
 * @property {string} completedAt
 * @property {"not_started"|"in_progress"|"completed"|"failed"} status
 * @property {ScientificMeasurement[]} measurements
 * @property {CaptureQuality} [captureQuality]
 * @property {string} [notes]
 *
 * @typedef {Object} Assessment
 * @property {string} id
 * @property {string} createdAt
 * @property {string} updatedAt
 * @property {"draft"|"in_progress"|"completed"} status
 * @property {string} protocolVersion
 * @property {ScientificMeasurement[]} measurements
 * @property {string} [notes]
 * @property {UserProfile} [userProfile]
 * @property {ManualAssessmentData} [manualData]
 * @property {import('./HealthDataRecord').HealthDataRecord[]} healthData
 * @property {TestResult[]} testResults
 */

// Versión del protocolo científico — una evaluación conserva SIEMPRE la
// versión con la que se realizó, aunque exista una posterior.
const PROTOCOL_VERSION = "V0.2";

const ASSESSMENT_STATUS = { DRAFT: "draft", IN_PROGRESS: "in_progress", COMPLETED: "completed" };
const TEST_RESULT_STATUS = { NOT_STARTED: "not_started", IN_PROGRESS: "in_progress", COMPLETED: "completed", FAILED: "failed" };

// ID único, sin depender de índices de array. No es criptográficamente
// seguro (no hace falta para esto) — solo necesita no colisionar en la
// práctica dentro de una misma sesión/dispositivo.
function generateId(prefix = "id") {
  const rand = Math.random().toString(36).slice(2, 10);
  return `${prefix}_${Date.now()}_${rand}`;
}

function nowISO() {
  return new Date().toISOString(); // ISO 8601 siempre — nunca formato local
}

/* ---------- Construcción de Assessment ---------- */

function createAssessment({ userProfile, manualData, notes } = {}) {
  const timestamp = nowISO();
  return {
    id: generateId("assessment"),
    createdAt: timestamp,
    updatedAt: timestamp,
    status: ASSESSMENT_STATUS.DRAFT,
    protocolVersion: PROTOCOL_VERSION,
    measurements: [],
    notes: notes || undefined,
    userProfile: userProfile || undefined,
    manualData: manualData || undefined,
    healthData: [],
    testResults: [],
  };
}

// Añade (o reemplaza, si ya existía uno para ese testId) un TestResult,
// y recalcula `measurements` como agregado — mismas referencias de
// ScientificMeasurement, nunca copias. Cada medición ya trae su propio
// assessmentId/testId (los ponen los buildXxxMeasurement de cada
// prueba), así que no hace falta reescribirlos aquí.
function addTestResultToAssessment(assessment, testResult) {
  const testResults = [...assessment.testResults.filter((t) => t.testId !== testResult.testId), testResult];
  const measurements = testResults.flatMap((t) => t.measurements || []);
  return { ...assessment, testResults, measurements, updatedAt: nowISO() };
}

function closeAssessment(assessment) {
  return { ...assessment, status: ASSESSMENT_STATUS.COMPLETED, updatedAt: nowISO() };
}

// Adaptador: convierte el objeto que ya producen CameraAssessment /
// RealSitToStandFlow (lo que hoy vive en `assessmentHistory`) en
// TestResult, SIN tocar su origen ni la lógica de captura de ninguna
// prueba — incluida Sit-to-Stand real, cuyas 3 mediciones
// (sit_to_stand_test_time, sit_to_stand_mean_cycle_time,
// sit_to_stand_cycle_variability) pasan tal cual en `measurements`.
function toTestResult(existingAssessmentEntry) {
  return {
    testId: existingAssessmentEntry.testId,
    completedAt: existingAssessmentEntry.timestamp,
    status: existingAssessmentEntry.status === "completed" ? TEST_RESULT_STATUS.COMPLETED : TEST_RESULT_STATUS.IN_PROGRESS,
    measurements: existingAssessmentEntry.measurements || [],
    captureQuality: existingAssessmentEntry.captureQuality,
    notes: undefined,
  };
}

/* ---------- Flujo completo de evaluación (8 pruebas) ---------- */

// Crea el Assessment con el que arranca "Nueva evaluación": 8
// TestResult (uno por prueba, "not_started") y status "in_progress"
// desde el principio — no hace falta pasar por "draft" para esto.
function startNewAssessmentRecord() {
  const base = createAssessment();
  const testResults = TEST_DEFINITIONS.map((t) => ({
    testId: t.id,
    completedAt: null,
    status: TEST_RESULT_STATUS.NOT_STARTED,
    measurements: [],
    captureQuality: undefined,
    notes: undefined,
  }));
  return { ...base, status: ASSESSMENT_STATUS.IN_PROGRESS, testResults };
}

// true únicamente cuando las 8 pruebas tienen su TestResult en
// "completed" — nunca antes.
function canCompleteAssessment(assessment) {
  if (!assessment || !Array.isArray(assessment.testResults)) return false;
  return TEST_DEFINITIONS.every((t) => {
    const tr = assessment.testResults.find((r) => r.testId === t.id);
    return tr && tr.status === TEST_RESULT_STATUS.COMPLETED;
  });
}

// Adaptador inverso a toTestResult(): al reanudar una evaluación
// "in_progress" desde el repositorio tras recargar la app, reconstruye
// las entradas que Dashboard/Resultados/Perfil/Historial ya saben
// mostrar (sin tocar esas pantallas). `reps` queda en null — el detalle
// por repetición no se persiste en TestResult, solo las mediciones ya
// agregadas; no se inventa nada, simplemente no está disponible tras recargar.
function fromTestResultToHistoryEntry(testResult, assessmentId) {
  return {
    id: `${assessmentId}_${testResult.testId}`,
    testId: testResult.testId,
    timestamp: testResult.completedAt || nowISO(),
    status: testResult.status === TEST_RESULT_STATUS.COMPLETED ? "completed" : testResult.status,
    measurements: testResult.measurements || [],
    reps: null,
    captureQuality: testResult.captureQuality,
  };
}

/* ---------- Exportación / importación (JSON, sin backend) ---------- */

function isValidAssessmentShape(data) {
  if (!data || typeof data !== "object") return false;
  if (typeof data.id !== "string" || !data.id) return false;
  if (typeof data.protocolVersion !== "string" || !data.protocolVersion) return false;
  if (!Array.isArray(data.measurements)) return false;
  if (!Array.isArray(data.testResults)) return false;
  if (data.healthData != null && !Array.isArray(data.healthData)) return false;
  if (typeof data.createdAt !== "string" || Number.isNaN(Date.parse(data.createdAt))) return false;
  if (typeof data.updatedAt !== "string" || Number.isNaN(Date.parse(data.updatedAt))) return false;
  return true;
}

async function exportAssessment(id, repository = assessmentRepository) {
  const assessment = await repository.getAssessment(id);
  if (!assessment) throw new Error(`Assessment "${id}" no encontrado.`);
  return JSON.stringify(assessment, null, 2); // JSON — CSV/PDF quedan para más adelante
}

async function importAssessment(data, repository = assessmentRepository) {
  const parsed = typeof data === "string" ? JSON.parse(data) : data;
  if (!isValidAssessmentShape(parsed)) {
    throw new Error("Datos de evaluación no válidos: falta id, protocolVersion, measurements, testResults o timestamps correctos.");
  }
  return repository.updateAssessment(parsed.id, { ...parsed, healthData: parsed.healthData || [] });
}

async function getAssessmentHistory(repository = assessmentRepository) {
  const all = await repository.listAssessments();
  return [...all].sort((a, b) => new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime()); // createdAt DESC
}

/* ---------- AssessmentRepository — abstracción de almacenamiento ----------
   Los componentes (el día que se conecten) deben trabajar contra esta
   interfaz, nunca contra IndexedDB directamente. Así, más adelante,
   SupabaseAssessmentRepository o ApiAssessmentRepository implementan
   los mismos métodos sin tocar pantallas ni pruebas.
   createAssessment(assessment), getAssessment(id),
   updateAssessment(id, assessment), deleteAssessment(id),
   listAssessments(), saveTestResult(assessmentId, testResult),
   saveMeasurement(assessmentId, testId, measurement) */

const KINESIS_DB_NAME = "kinesis_db";
const KINESIS_DB_VERSION = 1;
const ASSESSMENTS_STORE = "assessments";

function openKinesisDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("IndexedDB no disponible en este entorno."));
      return;
    }
    const req = indexedDB.open(KINESIS_DB_NAME, KINESIS_DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(ASSESSMENTS_STORE)) {
        const store = db.createObjectStore(ASSESSMENTS_STORE, { keyPath: "id" });
        store.createIndex("createdAt", "createdAt", { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("No se pudo abrir la base de datos local."));
  });
}

function idbRequest(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

// Única implementación real por ahora: IndexedDB del navegador, tras la
// interfaz AssessmentRepository. Se eligió IndexedDB sobre localStorage
// porque los Assessment son objetos anidados (TestResult[],
// ScientificMeasurement[], healthData[]) que crecen con cada prueba —
// localStorage obliga a serializar/deserializar TODO el blob en cada
// lectura/escritura, mientras IndexedDB indexa por id y por createdAt
// de forma nativa, sin añadir una librería nueva.
class LocalAssessmentRepository {
  async createAssessment(assessment) {
    const db = await openKinesisDB();
    try {
      const tx = db.transaction(ASSESSMENTS_STORE, "readwrite");
      await idbRequest(tx.objectStore(ASSESSMENTS_STORE).add(assessment));
      return assessment;
    } finally {
      db.close();
    }
  }

  async getAssessment(id) {
    const db = await openKinesisDB();
    try {
      const tx = db.transaction(ASSESSMENTS_STORE, "readonly");
      const result = await idbRequest(tx.objectStore(ASSESSMENTS_STORE).get(id));
      return result || null;
    } finally {
      db.close();
    }
  }

  async updateAssessment(id, assessment) {
    const db = await openKinesisDB();
    try {
      const tx = db.transaction(ASSESSMENTS_STORE, "readwrite");
      const updated = { ...assessment, id, updatedAt: nowISO() };
      await idbRequest(tx.objectStore(ASSESSMENTS_STORE).put(updated)); // put = crea o actualiza
      return updated;
    } finally {
      db.close();
    }
  }

  async deleteAssessment(id) {
    const db = await openKinesisDB();
    try {
      const tx = db.transaction(ASSESSMENTS_STORE, "readwrite");
      await idbRequest(tx.objectStore(ASSESSMENTS_STORE).delete(id));
      return true;
    } finally {
      db.close();
    }
  }

  async listAssessments() {
    const db = await openKinesisDB();
    try {
      const tx = db.transaction(ASSESSMENTS_STORE, "readonly");
      const all = await idbRequest(tx.objectStore(ASSESSMENTS_STORE).getAll());
      return all || [];
    } finally {
      db.close();
    }
  }

  async saveTestResult(assessmentId, testResult) {
    const existing = await this.getAssessment(assessmentId);
    if (!existing) throw new Error(`Assessment "${assessmentId}" no encontrado.`);
    return this.updateAssessment(assessmentId, addTestResultToAssessment(existing, testResult));
  }

  async saveMeasurement(assessmentId, testId, measurement) {
    const existing = await this.getAssessment(assessmentId);
    if (!existing) throw new Error(`Assessment "${assessmentId}" no encontrado.`);
    const testResults = existing.testResults.map((t) =>
      t.testId === testId ? { ...t, measurements: [...t.measurements, measurement] } : t
    );
    const measurements = testResults.flatMap((t) => t.measurements || []);
    return this.updateAssessment(assessmentId, { ...existing, testResults, measurements });
  }
}

// scaffold del Prompt 17). Aquí, sin build tool, son constantes —
// SIEMPRE vacías por defecto. Nunca la service_role key.
const SUPABASE_CONFIG = {
  url: "",     // VITE_SUPABASE_URL
  anonKey: "", // VITE_SUPABASE_ANON_KEY
};

function isSupabaseConfigured() {
  return Boolean(SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey);
}

// Carga @supabase/supabase-js vía <script> clásico (mismo patrón que
// loadPoseModel() para MediaPipe) — un import() ESM aquí se resuelve
// estáticamente contra la lista de librerías del artifact y falla
// siempre con "Module not found", confirmado en el Prompt 10.
let cachedSupabaseClientPromise = null;
function loadSupabaseClient() {
  if (!isSupabaseConfigured()) {
    return Promise.reject(new Error("Supabase no está configurado (faltan VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY)."));
  }
  if (cachedSupabaseClientPromise) return cachedSupabaseClientPromise;
  cachedSupabaseClientPromise = (async () => {
    await loadScriptOnce("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js");
    if (typeof window.supabase?.createClient !== "function") {
      throw new Error("El script se cargó pero no expuso window.supabase.createClient.");
    }
    return window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
  })();
  return cachedSupabaseClientPromise;
}

/* ---------- Adaptadores Assessment ↔ filas de Supabase ----------
   Transformación pura, sin lógica visual. El estado científico
   (validationStatus) se transporta TAL CUAL — nunca se reinterpreta:
   un DEMO nunca sale de aquí como RESEARCH, un RESEARCH nunca como
   VALIDATED. Mismos adaptadores que en el scaffold del Prompt 17,
   ahora también presentes aquí para que el repositorio sea real. */

function assessmentToRow(assessment, userId) {
  return {
    id: assessment.id,
    user_id: userId,
    created_at: assessment.createdAt,
    updated_at: assessment.updatedAt,
    status: assessment.status,
    protocol_version: assessment.protocolVersion,
    notes: assessment.notes ?? null,
  };
}

function rowToAssessment(row, testResultRows = [], measurementRows = [], healthRows = []) {
  return {
    id: row.id,
    createdAt: row.created_at,
    updatedAt: row.updated_at,
    status: row.status,
    protocolVersion: row.protocol_version,
    notes: row.notes ?? undefined,
    measurements: measurementRows.map(rowToMeasurementRow),
    healthData: healthRows.map(rowToHealthDataRow),
    testResults: testResultRows.map((tr) => rowToTestResultRow(tr, measurementRows)),
  };
}

function testResultToSupabaseRow(testResult, assessmentId) {
  return {
    id: testResult.id || `${assessmentId}_${testResult.testId}`,
    assessment_id: assessmentId,
    test_id: testResult.testId,
    completed_at: testResult.completedAt,
    status: testResult.status,
    capture_quality: testResult.captureQuality ?? null,
    notes: testResult.notes ?? null,
  };
}

function rowToTestResultRow(row, allMeasurementRows = []) {
  return {
    id: row.id,
    testId: row.test_id,
    completedAt: row.completed_at,
    status: row.status,
    captureQuality: row.capture_quality ?? undefined,
    notes: row.notes ?? undefined,
    measurements: allMeasurementRows.filter((m) => m.test_result_id === row.id).map(rowToMeasurementRow),
  };
}

function measurementToSupabaseRow(measurement, assessmentId, testResultId) {
  return {
    id: measurement.id,
    assessment_id: assessmentId,
    test_result_id: testResultId ?? null,
    variable: measurement.variable,
    value: measurement.value ?? null,
    unit: measurement.unit ?? null,
    side: measurement.side ?? null,
    source: measurement.source,
    method: measurement.method ?? null,
    confidence: measurement.confidence ?? null,
    capture_quality: measurement.captureQuality ?? null,
    measurement_error: measurement.measurementError ?? null,
    measurement_error_unit: measurement.measurementErrorUnit ?? null,
    // — transporte tal cual, nunca reinterpretado —
    validation_status: measurement.validationStatus,
    evidence_level: measurement.evidenceLevel ?? null,
    reference_ids: measurement.referenceIds ?? null,
    metadata: { isDemo: measurement.isDemo ?? null, qualityMetadata: measurement.qualityMetadata ?? null },
    created_at: measurement.timestamp,
  };
}

function rowToMeasurementRow(row) {
  return {
    id: row.id,
    assessmentId: row.assessment_id,
    variable: row.variable,
    value: row.value,
    unit: row.unit,
    side: row.side ?? null,
    timestamp: row.created_at,
    source: row.source,
    method: row.method ?? undefined,
    confidence: row.confidence ?? undefined,
    captureQuality: row.capture_quality ?? undefined,
    measurementError: row.measurement_error ?? null,
    measurementErrorUnit: row.measurement_error_unit ?? undefined,
    // — transporte tal cual, nunca reinterpretado —
    validationStatus: row.validation_status,
    evidenceLevel: row.evidence_level ?? undefined,
    referenceIds: row.reference_ids ?? [],
    isDemo: row.metadata?.isDemo ?? (row.validation_status === "DEMO"),
    qualityMetadata: row.metadata?.qualityMetadata ?? undefined,
    measurementQuality: row.confidence ?? null,
  };
}

function healthDataRecordToSupabaseRow(record, assessmentId) {
  return {
    id: record.id,
    assessment_id: assessmentId,
    type: record.type,
    value: record.value,
    unit: record.unit,
    source: record.source,
    recorded_at: record.recordedAt,
    imported_at: record.importedAt,
    confidence: record.confidence ?? null,
    notes: record.notes ?? null,
    metadata: null,
  };
}

function rowToHealthDataRow(row) {
  return {
    id: row.id,
    type: row.type,
    value: row.value,
    unit: row.unit,
    source: row.source,
    recordedAt: row.recorded_at,
    importedAt: row.imported_at,
    confidence: row.confidence ?? undefined,
    notes: row.notes ?? undefined,
  };
}

/* ---------- SupabaseAssessmentRepository ----------
   Implementa la misma interfaz que LocalAssessmentRepository. No se
   activa por defecto (ver REPOSITORY_MODE, más abajo) — pero es una
   implementación REAL, no un stub: si algún día SUPABASE_CONFIG tiene
   credenciales válidas, esta clase funciona contra un proyecto Supabase
   real con el esquema del Prompt 17. */
class SupabaseAssessmentRepository {
  constructor(client) {
    if (!client) throw new Error("SupabaseAssessmentRepository requiere un cliente Supabase ya inicializado.");
    this.client = client;
  }

  async _getUserId() {
    const { data, error } = await this.client.auth.getUser();
    if (error || !data?.user) throw new Error("Usuario no autenticado — no se puede acceder a Supabase todavía.");
    return data.user.id;
  }

  async createAssessment(assessment) {
    const userId = await this._getUserId();
    const { error } = await this.client.from("assessments").insert(assessmentToRow(assessment, userId));
    if (error) throw error;
    if (assessment.testResults?.length) {
      const rows = assessment.testResults.map((tr) => testResultToSupabaseRow(tr, assessment.id));
      const { error: trError } = await this.client.from("test_results").insert(rows);
      if (trError) throw trError;
    }
    return assessment;
  }

  async getAssessment(id) {
    const { data: row, error } = await this.client.from("assessments").select("*").eq("id", id).single();
    if (error || !row) return null;
    const [testResultsRes, measurementsRes, healthRes] = await Promise.all([
      this.client.from("test_results").select("*").eq("assessment_id", id),
      this.client.from("scientific_measurements").select("*").eq("assessment_id", id),
      this.client.from("health_data").select("*").eq("assessment_id", id),
    ]);
    return rowToAssessment(row, testResultsRes.data || [], measurementsRes.data || [], healthRes.data || []);
  }

  async updateAssessment(id, assessment) {
    const userId = await this._getUserId();
    const { error } = await this.client.from("assessments").update(assessmentToRow(assessment, userId)).eq("id", id);
    if (error) throw error;
    return { ...assessment, id };
  }

  async deleteAssessment(id) {
    const { error } = await this.client.from("assessments").delete().eq("id", id);
    if (error) throw error;
    return true;
  }

  async listAssessments() {
    const userId = await this._getUserId();
    const { data, error } = await this.client.from("assessments").select("*").eq("user_id", userId).order("created_at", { ascending: false });
    if (error) throw error;
    const assessments = await Promise.all((data || []).map((row) => this.getAssessment(row.id)));
    return assessments.filter(Boolean);
  }

  async saveTestResult(assessmentId, testResult) {
    const row = testResultToSupabaseRow(testResult, assessmentId);
    const { error } = await this.client.from("test_results").upsert(row);
    if (error) throw error;
    if (testResult.measurements?.length) {
      const measurementRows = testResult.measurements.map((m) => measurementToSupabaseRow(m, assessmentId, row.id));
      const { error: mError } = await this.client.from("scientific_measurements").upsert(measurementRows);
      if (mError) throw mError;
    }
    return this.getAssessment(assessmentId);
  }

  async saveMeasurement(assessmentId, testId, measurement) {
    const { data: testResultRow } = await this.client.from("test_results").select("id").eq("assessment_id", assessmentId).eq("test_id", testId).single();
    const row = measurementToSupabaseRow(measurement, assessmentId, testResultRow?.id ?? null);
    const { error } = await this.client.from("scientific_measurements").upsert(row);
    if (error) throw error;
    return this.getAssessment(assessmentId);
  }

  async saveHealthData(assessmentId, records) {
    if (!records?.length) return;
    const rows = records.map((h) => healthDataRecordToSupabaseRow(h, assessmentId));
    const { error } = await this.client.from("health_data").insert(rows);
    if (error) throw error;
  }
}

/* ============================================================
   AUTENTICACIÓN — Supabase Auth (email + password)
   ============================================================
   Independiente del REPOSITORY_MODE: la DEMO local funciona igual con
   o sin sesión. Ninguna pantalla llama a supabase.auth.* directamente
   — todo pasa por AuthService, el único punto de entrada (sección 2
   del ticket). Si Supabase no está configurado (SUPABASE_CONFIG vacío,
   el valor por defecto en este artifact), todos los métodos devuelven
   un error controlado sin romper nada. */

function translateAuthError(error) {
  if (!isSupabaseConfigured()) return "Supabase no está disponible todavía.";
  const message = String(error?.message || error || "").toLowerCase();
  if (message.includes("invalid login credentials")) return "Email o contraseña incorrectos.";
  if (message.includes("already registered") || message.includes("user already exists")) return "Ya existe una cuenta con ese email.";
  if (message.includes("email not confirmed")) return "Confirma tu email antes de iniciar sesión.";
  if (message.includes("jwt") || message.includes("session")) return "Tu sesión ha caducado. Inicia sesión de nuevo.";
  if (message.includes("password")) return "La contraseña no cumple los requisitos mínimos.";
  if (message.includes("email")) return "Introduce un email válido.";
  return "No se pudo completar la operación. Inténtalo de nuevo.";
}

const AuthService = {
  // signUp: crea el usuario en auth.users Y su fila correspondiente en
  // profiles (profiles.id = auth.users.id) — nunca se guarda la
  // contraseña ahí, Supabase Auth es quien gestiona las credenciales.
  async signUp(email, password) {
    if (!isSupabaseConfigured()) return { user: null, error: translateAuthError() };
    try {
      const client = await loadSupabaseClient();
      const { data, error } = await client.auth.signUp({ email, password });
      if (error) { console.error("[AuthService] signUp:", error); return { user: null, error: translateAuthError(error) }; }
      if (data?.user) {
        const { error: profileError } = await client.from("profiles").insert({ id: data.user.id });
        if (profileError) console.error("[AuthService] No se pudo crear el profile:", profileError);
      }
      return { user: data?.user ?? null, error: null };
    } catch (err) {
      console.error("[AuthService] signUp:", err);
      return { user: null, error: translateAuthError(err) };
    }
  },

  async signIn(email, password) {
    if (!isSupabaseConfigured()) return { user: null, error: translateAuthError() };
    try {
      const client = await loadSupabaseClient();
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) { console.error("[AuthService] signIn:", error); return { user: null, error: translateAuthError(error) }; }
      return { user: data?.user ?? null, error: null };
    } catch (err) {
      console.error("[AuthService] signIn:", err);
      return { user: null, error: translateAuthError(err) };
    }
  },

  async signOut() {
    if (!isSupabaseConfigured()) return { error: null };
    try {
      const client = await loadSupabaseClient();
      const { error } = await client.auth.signOut();
      if (error) console.error("[AuthService] signOut:", error);
      return { error: error ? translateAuthError(error) : null };
    } catch (err) {
      console.error("[AuthService] signOut:", err);
      return { error: translateAuthError(err) };
    }
  },

  async getCurrentUser() {
    if (!isSupabaseConfigured()) return null;
    try {
      const client = await loadSupabaseClient();
      const { data } = await client.auth.getUser();
      return data?.user ?? null;
    } catch (err) {
      console.error("[AuthService] getCurrentUser:", err);
      return null;
    }
  },

  // Recupera la sesión existente — se llama al montar la app para no
  // pedir login de nuevo si la sesión sigue siendo válida (sección 17).
  async getSession() {
    if (!isSupabaseConfigured()) return null;
    try {
      const client = await loadSupabaseClient();
      const { data } = await client.auth.getSession();
      return data?.session ?? null;
    } catch (err) {
      console.error("[AuthService] getSession:", err);
      return null;
    }
  },

  // Devuelve una función de desuscripción.
  async onAuthStateChange(callback) {
    if (!isSupabaseConfigured()) return () => {};
    try {
      const client = await loadSupabaseClient();
      const { data } = client.auth.onAuthStateChange((_event, session) => callback(session));
      return () => data?.subscription?.unsubscribe?.();
    } catch (err) {
      console.error("[AuthService] onAuthStateChange:", err);
      return () => {};
    }
  },
};

// AuthState centralizado (sección 3) — un único hook, usado una sola
// vez en App y pasado hacia abajo; ninguna pantalla mantiene su propia
// copia del estado de sesión.
function useAuthState() {
  const [state, setState] = useState({ user: null, session: null, loading: true, authenticated: false });

  useEffect(() => {
    let cancelled = false;
    let unsubscribe = () => {};
    (async () => {
      const session = await AuthService.getSession();
      if (cancelled) return;
      setState({ user: session?.user ?? null, session, loading: false, authenticated: Boolean(session?.user) });
      unsubscribe = await AuthService.onAuthStateChange((newSession) => {
        setState({ user: newSession?.user ?? null, session: newSession, loading: false, authenticated: Boolean(newSession?.user) });
      });
    })();
    return () => { cancelled = true; unsubscribe(); };
  }, []);

  return state;
}

 * @typedef {Object} HealthDataSource

 * @property {string} [name]
 * @property {boolean} connected
 * @property {string} [lastSync]
 *
 * HealthDataProvider — abstracción para futuras fuentes externas
 * (Apple Health y otras). NO implementada todavía — ver
 * UnimplementedHealthDataProvider más abajo, que solo define el
 * contrato sin ninguna lógica real de HealthKit.
 * @typedef {Object} HealthDataProvider
 * @property {() => string[]} getAvailableDataTypes
 * @property {() => Promise<boolean>} requestAuthorization
 * @property {(types: string[], range?: {from: string, to: string}) => Promise<HealthDataRecord[]>} fetchData
 * @property {() => HealthDataSource} getConnectionStatus
 */

// Tipos soportados inicialmente — deliberadamente pocos, ampliables después.
const HEALTH_DATA_TYPES = {
  resting_heart_rate: { unit: "bpm" },
  steps: { unit: "count" },
  sleep_duration: { unit: "hours" },
  body_weight: { unit: "kg" },
  height: { unit: "cm" },
  blood_pressure_systolic: { unit: "mmHg" },
  blood_pressure_diastolic: { unit: "mmHg" },
};

const HEALTH_DATA_SOURCE_TYPE = { MANUAL: "manual", APPLE_HEALTH: "apple_health", EXTERNAL: "external" };

function createHealthDataSource({ type, name, connected = false, lastSync } = {}) {
  return { type, name: name || undefined, connected, lastSync: lastSync || undefined };
}

// Validación mínima: tipo soportado, valor numérico finito (no NaN, no
// Infinity), unidad presente, timestamp real. Sin rangos clínicos.
function isValidHealthDataRecord(record) {
  if (!record || typeof record !== "object") return false;
  if (!HEALTH_DATA_TYPES[record.type]) return false;
  if (typeof record.value !== "number" || Number.isNaN(record.value) || !Number.isFinite(record.value)) return false;
  if (typeof record.unit !== "string" || !record.unit) return false;
  if (!Object.values(HEALTH_DATA_SOURCE_TYPE).includes(record.source)) return false;
  if (typeof record.recordedAt !== "string" || Number.isNaN(Date.parse(record.recordedAt))) return false;
  return true;
}

function createHealthDataRecord({ type, value, unit, source = HEALTH_DATA_SOURCE_TYPE.MANUAL, recordedAt, confidence, notes }) {
  const record = {
    id: generateId("health"),
    type,
    value,
    unit: unit || HEALTH_DATA_TYPES[type]?.unit || "",
    source,
    recordedAt: recordedAt || nowISO(),
    importedAt: nowISO(),
    confidence: confidence ?? undefined,
    notes: notes || undefined,
  };
  if (!isValidHealthDataRecord(record)) {
    throw new Error(`HealthDataRecord no válido: tipo "${type}" o valor "${value}" incorrectos.`);
  }
  return record;
}

// Las 3 funciones de entrada manual que pide el ticket — devuelven un
// Assessment nuevo (inmutable), listo para pasar a
// assessmentRepository.updateAssessment().
function addManualHealthData(assessment, data) {
  const record = createHealthDataRecord({ ...data, source: HEALTH_DATA_SOURCE_TYPE.MANUAL });
  return { ...assessment, healthData: [...(assessment.healthData || []), record], updatedAt: nowISO() };
}

function updateManualHealthData(assessment, recordId, changes) {
  const healthData = (assessment.healthData || []).map((r) => {
    if (r.id !== recordId) return r;
    if (r.source !== HEALTH_DATA_SOURCE_TYPE.MANUAL) throw new Error("Solo se pueden editar datos de origen manual.");
    const updated = { ...r, ...changes, id: r.id, source: HEALTH_DATA_SOURCE_TYPE.MANUAL, importedAt: r.importedAt };
    if (!isValidHealthDataRecord(updated)) throw new Error("Datos actualizados no válidos.");
    return updated;
  });
  return { ...assessment, healthData, updatedAt: nowISO() };
}

function removeHealthData(assessment, recordId) {
  return { ...assessment, healthData: (assessment.healthData || []).filter((r) => r.id !== recordId), updatedAt: nowISO() };
}

// Puente con ManualAssessmentData (el tipo de forma fija del ticket de
// modelo de datos) — lo convierte a HealthDataRecord[] para que ambos
// tickets convivan sin contradecirse.
function manualAssessmentDataToHealthRecords(manualData, recordedAt) {
  if (!manualData) return [];
  const mapping = {
    restingHeartRate: "resting_heart_rate",
    dailySteps: "steps",
    sleepDuration: "sleep_duration",
    bloodPressureSystolic: "blood_pressure_systolic",
    bloodPressureDiastolic: "blood_pressure_diastolic",
  };
  return Object.entries(mapping)
    .filter(([key]) => manualData[key] != null)
    .map(([key, type]) => createHealthDataRecord({ type, value: manualData[key], recordedAt, source: HEALTH_DATA_SOURCE_TYPE.MANUAL }));
}

// Contrato de HealthDataProvider SIN implementación real — solo lanza,
// dejando claro que Apple Health no está conectado todavía. El día que
// exista AppleHealthProvider, implementa esta misma interfaz y nada
// más en la app necesita cambiar.
class UnimplementedHealthDataProvider {
  getAvailableDataTypes() {
    return Object.keys(HEALTH_DATA_TYPES);
  }
  async requestAuthorization() {
    throw new Error("HealthDataProvider no implementado todavía (preparado para Apple Health).");
  }
  async fetchData() {
    throw new Error("HealthDataProvider no implementado todavía (preparado para Apple Health).");
  }
  getConnectionStatus() {
    return createHealthDataSource({ type: HEALTH_DATA_SOURCE_TYPE.APPLE_HEALTH, name: "Apple Health", connected: false });
  }
}

/* ============================================================

        </span>

      <div>
        <Row label="Confianza" value={hasConfidence ? `${Math.round(measurement.confidence * 100)}%` : "No disponible todavía"} />
        <Row label="Calidad de captura" value={hasCaptureQuality ? `${Math.round(measurement.captureQuality * 100)}%` : "No disponible todavía"} />
        <Row label="Estado de validación" value={status.replace(/_/g, " ")} />
        <Row label="Evidencia científica" value={references.length > 0 ? `${references.length} referencia(s)` : "No disponible todavía"} />

          {explanation}
        </p>

  );
}

/* ============================================================
   SISTEMA DE RESULTADOS E INFORME
   ============================================================
   Transforma los datos ya existentes (assessmentHistory + healthData)
   en un AssessmentResult estructurado. Funciona igual con mediciones
   DEMO, RESEARCH o (en el futuro) VALIDATED — no distingue el origen
   salvo para etiquetarlo con honestidad. No calcula ningún score,
   riesgo ni diagnóstico: solo organiza lo que ya se midió. */

/**
 * @typedef {Object} ResultSummary
 * @property {string[]} completedTests
 * @property {string[]} pendingTests
 * @property {number} researchMeasurements
 * @property {number} validatedMeasurements
 * @property {number} demoMeasurements
 * @property {number} measurementsWithExternalEvidence
 * @property {number} measurementsWithKinesisValidation
 *
 * @typedef {Object} AssessmentResult
 * @property {string} assessmentId
 * @property {string} generatedAt
 * @property {string} protocolVersion
 * @property {number} testsCompleted
 * @property {number} testsTotal
 * @property {ScientificMeasurement[]} measurements
 * @property {import('./HealthDataRecord').HealthDataRecord[]} healthData
 * @property {ResultSummary} summary
 */

const REPORT_TEST_STATUS_LABELS = {
  not_started: "No realizada",
  in_progress: "En progreso",
  completed: "Completada",
  error: "Error",
};

const VALIDATION_STATUS_LABELS = {
  DEMO: "Demostración",
  RESEARCH: "Medición experimental",
  PARTIALLY_VALIDATED: "Validación parcial",
  VALIDATED: "Validado por Kinesis",
};

const HEALTH_DATA_TYPE_LABELS = {
  resting_heart_rate: "Frecuencia cardíaca en reposo",
  steps: "Pasos",
  sleep_duration: "Sueño",
  body_weight: "Peso",
  height: "Altura",
  blood_pressure_systolic: "Presión arterial (sistólica)",
  blood_pressure_diastolic: "Presión arterial (diastólica)",
};

const HEALTH_DATA_SOURCE_LABELS = { manual: "Manual", apple_health: "Apple Health", external: "External" };

function getTestReportStatus(testId, latestByTestId) {
  const entry = latestByTestId[testId];
  if (!entry) return "not_started";
  if (entry.status === "completed") return "completed";
  if (entry.status === "error") return "error";
  return "in_progress";
}

// Normaliza una medición para el informe: rellena los campos que las
// mediciones DEMO de los 8 tests no traían todavía (method, confidence,
// captureQuality, measurementError, evidenceLevel, referenceIds) SIN
// inventar validación — una medición isDemo:true nunca sale de aquí
// marcada como RESEARCH o VALIDATED. "No perder información
// científica": lo que ya existía en la medición se conserva tal cual,
// esto solo añade lo que faltaba.
function toReportMeasurement(m) {
  const status = getMeasurementScientificStatus(m.variable);
  const validationStatus = m.validationStatus || (m.isDemo ? VALIDATION_STATUS.DEMO : status.validationStatus);
  return {
    ...m,
    method: m.method || (m.isDemo ? "demo_simulation" : "unknown"),
    confidence: m.confidence ?? m.measurementQuality ?? null,
    captureQuality: m.captureQuality ?? null,
    measurementError: m.measurementError ?? null,
    evidenceLevel: m.evidenceLevel || status.evidenceLevel || null,
    referenceIds: m.referenceIds || [],
    validationStatus,
  };
}

// Genera el AssessmentResult a partir de `assessmentHistory` (el
// historial real que ya usan Dashboard/Resultados/Perfil/Historial —
// no se toca su formato, esto solo lo lee) y, opcionalmente, de
// HealthDataRecord[] ya recogidos. Usa la última entrada de cada test
// (assessmentHistory viene más reciente primero).
function generateAssessmentResult(assessmentHistory = [], { assessmentId, healthData = [] } = {}) {
  const latestByTestId = {};
  for (const entry of assessmentHistory) {
    if (!latestByTestId[entry.testId]) latestByTestId[entry.testId] = entry;
  }
  const completedTests = Object.keys(latestByTestId);
  const testsTotal = TEST_DEFINITIONS.length;
  const pendingTests = TEST_DEFINITIONS.map((t) => t.id).filter((id) => !completedTests.includes(id));

  const measurements = completedTests.flatMap((testId) =>
    (latestByTestId[testId].measurements || []).map(toReportMeasurement)
  );

  let researchMeasurements = 0, validatedMeasurements = 0, demoMeasurements = 0;
  let measurementsWithExternalEvidence = 0, measurementsWithKinesisValidation = 0;
  for (const m of measurements) {
    if (m.isDemo) demoMeasurements += 1;
    if (m.validationStatus === VALIDATION_STATUS.RESEARCH) researchMeasurements += 1;
    if (m.validationStatus === VALIDATION_STATUS.VALIDATED) validatedMeasurements += 1;
    if (m.referenceIds && m.referenceIds.length > 0) measurementsWithExternalEvidence += 1;
    if (getMeasurementScientificStatus(m.variable).hasKinesisValidation) measurementsWithKinesisValidation += 1;
  }

  return {
    assessmentId: assessmentId || generateId("result"),
    generatedAt: nowISO(),
    protocolVersion: PROTOCOL_VERSION,
    testsCompleted: completedTests.length,
    testsTotal,
    measurements,
    healthData,
    summary: {
      completedTests, pendingTests,
      researchMeasurements, validatedMeasurements, demoMeasurements,
      measurementsWithExternalEvidence, measurementsWithKinesisValidation,
    },
  };
}

/* ---------- TestResultCard ---------- */

function TestResultCard({ test, measurements, status }) {

  const statusColor = status === "completed" ? C.teal : status === "in_progress" ? C.amber : status === "error" ? C.coral : C.inkFaint;
  const isDemo = measurements.some((m) => m.isDemo);
  const primary = measurements[0];

  return (
    <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      <div className="p-4">
        <div className="flex items-center justify-between">
          <span style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }}>{test.name}</span>
          <span style={{ ...fontMono, color: statusColor, fontSize: 10, fontWeight: 600 }} className="uppercase tracking-wide">{statusLabel}</span>
        </div>
        {isDemo && <div className="mt-2"><DemoTag label="Resultado de demostración" /></div>}

        {measurements.length === 0 ? (
          <div style={{ ...fontBody, color: C.inkFaint, fontSize: 12.5 }} className="mt-2">Sin mediciones disponibles.</div>
        ) : (
          <div className="mt-3 space-y-2">
            {measurements.map((m) => (
              <div key={m.id} className="flex items-center justify-between">
                <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>
                  {MEASUREMENT_LABELS[m.variable] || m.variable}{m.side ? ` (${SIDE_LABELS[m.side] || m.side})` : ""}
                </span>
                {m.value != null ? <DataValue value={m.value} unit={m.unit} size={14} /> : (
                  <span style={{ ...fontBody, color: C.inkFaint, fontSize: 12 }}>Sin dato</span>
                )}
              </div>
            ))}
            {primary?.captureQuality != null && (
              <div className="flex items-center justify-between pt-1">
                <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Calidad</span>
                <span style={{ ...fontBody, color: C.text, fontSize: 12.5 }}>{Math.round(primary.captureQuality * 100)}%</span>
              </div>
            )}
            <div className="flex items-center justify-between pt-1">
              <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Estado</span>
              <span style={{ ...fontBody, color: getValidationStatusStyle(primary?.validationStatus).color, fontSize: 12.5, fontWeight: 600 }}>
                {VALIDATION_STATUS_LABELS[primary?.validationStatus] || "—"}
              </span>
            </div>
          </div>
        )}
      </div>

      {measurements.length > 0 && (
        <>
          <button
            onClick={() => setShowEvidence((v) => !v)}
            className="w-full flex items-center justify-center gap-1.5 py-2.5"
            style={{ borderTop: `1px solid ${C.line}` }}
          >
            <Info size={12} color={C.inkSoft} />
            <span style={{ ...fontBody, color: C.inkSoft, fontSize: 11.5 }}>¿Cómo se obtiene esta medición?</span>
          </button>
          {showEvidence && primary && (
            <div className="p-3 pt-0">
              <MeasurementEvidenceCard
                measurement={primary}
                validationProfile={{ variable: primary.variable, validationStatus: primary.validationStatus }}
                references={[]}
              />
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ---------- AssessmentReport ---------- */
// Componente reutilizable. No tiene entrada visible en Sidebar/BottomNav
// (igual que /science) — se llega vía la vista "informe_evaluacion" en
// App, más abajo. No se ha tocado el screen "informe" existente.

function AssessmentReport({ assessmentHistory = [], healthData = [] }) {
  const result = generateAssessmentResult(assessmentHistory, { healthData });
  const { summary } = result;
  const incomplete = result.testsCompleted < result.testsTotal;

  const measurementsByTest = {};
  for (const m of result.measurements) {
    (measurementsByTest[m.testId] ||= []).push(m);
  }
  const latestByTestId = {};
  for (const entry of assessmentHistory) {
    if (!latestByTestId[entry.testId]) latestByTestId[entry.testId] = entry;
  }

  const captureQualities = result.measurements.map((m) => m.captureQuality).filter((v) => v != null);
  const avgCaptureQuality = captureQualities.length
    ? +(captureQualities.reduce((a, b) => a + b, 0) / captureQualities.length).toFixed(2)
    : null;

  return (
    <div className="space-y-4">
      {/* 1. Resumen de evaluación */}
      <div className="rounded-2xl p-5" style={{ background: C.ink }}>
        <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 12 }}>Informe de evaluación</div>
        <div style={{ ...fontDisplay, color: "#fff", fontSize: 17, fontWeight: 600 }} className="mt-1">
          {incomplete ? "Evaluación incompleta" : "Evaluación completa"}
        </div>
        <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 12.5 }} className="mt-1">
          {result.testsCompleted} de {result.testsTotal} pruebas realizadas · protocolo {result.protocolVersion}
        </div>
        <div className="grid grid-cols-3 gap-2 mt-4">
          <div>
            <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 10.5 }}>Demo</div>
            <DataValue value={summary.demoMeasurements} unit="" size={18} color="#fff" />
          </div>
          <div>
            <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 10.5 }}>Experimental</div>
            <DataValue value={summary.researchMeasurements} unit="" size={18} color="#fff" />
          </div>
          <div>
            <div style={{ ...fontBody, color: "#9AA5AC", fontSize: 10.5 }}>Validado</div>
            <DataValue value={summary.validatedMeasurements} unit="" size={18} color="#fff" />
          </div>
        </div>
      </div>

      {/* 2. Pruebas realizadas */}
      <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }} className="p-4 pb-2">Pruebas realizadas</div>
        {TEST_DEFINITIONS.map((t, i) => {
          const status = getTestReportStatus(t.id, latestByTestId);
          const color = status === "completed" ? C.teal : status === "in_progress" ? C.amber : status === "error" ? C.coral : C.inkFaint;
          return (
            <div key={t.id} className="flex items-center justify-between px-4 py-2.5" style={{ borderTop: i > 0 ? `1px solid ${C.line}` : "none" }}>
              <span style={{ ...fontBody, color: C.text, fontSize: 13 }}>{t.name}</span>
              <span style={{ ...fontMono, color, fontSize: 10, fontWeight: 600 }} className="uppercase tracking-wide">
                {REPORT_TEST_STATUS_LABELS[status]}
              </span>
            </div>
          );
        })}
      </div>

      {/* 3. Mediciones */}
      <div>
        <div style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }} className="mb-2.5 px-1">Mediciones</div>
        <div className="space-y-2.5">
          {result.testsCompleted === 0 ? (
            <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
              <span style={{ ...fontBody, color: C.inkFaint, fontSize: 12.5 }}>Todavía no hay pruebas completadas.</span>
            </div>
          ) : (
            TEST_DEFINITIONS.filter((t) => measurementsByTest[t.id]).map((t) => (
              <TestResultCard
                key={t.id}
                test={t}
                measurements={measurementsByTest[t.id] || []}
                status={getTestReportStatus(t.id, latestByTestId)}
              />
            ))
          )}
        </div>
      </div>

      {/* 4. Calidad de captura */}
      <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }} className="mb-2">Calidad de captura</div>
        <div className="flex items-center justify-between">
          <span style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5 }}>Media de todas las mediciones</span>
          <span style={{ ...fontBody, color: C.text, fontSize: 12.5 }}>
            {avgCaptureQuality != null ? `${Math.round(avgCaptureQuality * 100)}%` : "No disponible"}
          </span>
        </div>
      </div>

      {/* 5. Evidencia científica */}
      <div className="rounded-2xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }} className="mb-2">Evidencia científica</div>
        <p style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5, lineHeight: 1.5 }}>
          {summary.measurementsWithExternalEvidence > 0
            ? `${summary.measurementsWithExternalEvidence} de ${result.measurements.length} mediciones tienen evidencia científica externa asociada.`
            : "No hay evidencia externa asociada todavía."}
        </p>
        <p style={{ ...fontBody, color: C.inkSoft, fontSize: 12.5, lineHeight: 1.5 }} className="mt-1.5">
          {summary.measurementsWithKinesisValidation > 0
            ? `${summary.measurementsWithKinesisValidation} mediciones cuentan con validación propia de Kinesis.`
            : "Kinesis todavía no ha validado ninguna medición frente a un método de referencia."}
        </p>
      </div>

      {/* 6. Datos de salud */}
      <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div style={{ ...fontDisplay, color: C.text, fontSize: 14, fontWeight: 600 }} className="p-4 pb-2">Datos de salud</div>
        {result.healthData.length === 0 ? (
          <div className="px-4 pb-4">
            <span style={{ ...fontBody, color: C.inkFaint, fontSize: 12.5 }}>Sin datos de salud registrados.</span>
          </div>
        ) : (
          result.healthData.map((h, i) => (
            <div key={h.id} className="flex items-center justify-between px-4 py-2.5" style={{ borderTop: i > 0 ? `1px solid ${C.line}` : "none" }}>
              <div>
                <div style={{ ...fontBody, color: C.text, fontSize: 13 }}>{HEALTH_DATA_TYPE_LABELS[h.type] || h.type}</div>
                <div style={{ ...fontBody, color: C.inkFaint, fontSize: 11 }}>Fuente: {HEALTH_DATA_SOURCE_LABELS[h.source] || h.source}</div>
              </div>
              <DataValue value={h.value} unit={h.unit} size={14} />
            </div>
          ))
        )}
      </div>

      {/* 7. Limitaciones */}
      <div className="rounded-lg p-3" style={{ background: C.amberSoft }}>
        <p style={{ ...fontBody, color: C.amber, fontSize: 11.5, lineHeight: 1.6 }}>
          Este informe no constituye un diagnóstico, una valoración de riesgo ni una recomendación clínica.
          Las mediciones "Demostración" son simuladas; las "Medición experimental" proceden de estimación de
          pose real, pero Kinesis todavía no ha validado ninguna frente a un método de referencia.
        </p>
      </div>
    </div>
  );
}

/* ============================================================
   COMPONENTES DE CAPTURA REAL — Sit-to-Stand
   ============================================================
   RealCameraCapture, PoseDetectionOverlay y CaptureQualityIndicator
   son reutilizables tal como pide el ticket; hoy solo los usa
   RealSitToStandFlow, pero no están acoplados a Sit-to-Stand
   específicamente. */

// Cámara real: getUserMedia (solo vídeo, sin audio), limpieza completa
// de tracks al desmontar o al desactivarse. No graba ni sube nada.
function RealCameraCapture({ videoRef, active, onReady, onError, facingMode = "user" }) {
  useEffect(() => {
    if (!active) return undefined;
    let stream = null;
    let cancelled = false;
    (async () => {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Este navegador (o este iframe) no expone acceso a la cámara.");
        }
        // Si el iframe que embebe este artifact no tiene permiso de
        // cámara concedido por la página anfitriona (atributo
        // allow="camera"), el navegador puede bloquear el acceso sin
        // ni siquiera mostrar el prompt — y a veces sin rechazar la
        // promesa. Por eso hay timeout: preferimos un error claro a un
        // spinner colgado para siempre.
        const getUserMediaPromise = navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingMode } }, audio: false,
        });
        let timedOut = false;
        let timeoutId;
        const timeoutPromise = new Promise((_, reject) => {
          timeoutId = setTimeout(() => {
            timedOut = true;
            reject(new Error("Sin respuesta tras 8s — probablemente el iframe no tiene permiso de cámara (Permissions Policy)."));
          }, 8000);
        });
        // Si getUserMedia "pierde" la carrera contra el timeout pero
        // resuelve más tarde (ya con el error mostrado o el componente
        // desmontado), no dejamos ese stream encendido sin control.
        getUserMediaPromise
          .then((lateStream) => {
            if (timedOut || cancelled) lateStream.getTracks().forEach((t) => t.stop());
          })
          .catch(() => {});
        try {
          stream = await Promise.race([getUserMediaPromise, timeoutPromise]);
        } finally {
          clearTimeout(timeoutId); // evita un timer huérfano cuando getUserMedia gana la carrera
        }
        if (cancelled) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
        }
        onReady?.();
      } catch (err) {
        console.error("Fallo al acceder a la cámara:", err);
        onError?.(err);
      }
    })();
    return () => {
      cancelled = true;
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (videoRef.current) videoRef.current.srcObject = null;
    };
  }, [active, facingMode]);

  return (
    <video
      ref={videoRef}
      playsInline
      muted
      style={{ width: "100%", height: "100%", objectFit: "cover", transform: facingMode === "user" ? "scaleX(-1)" : "none" }}
    />
  );
}

// Líneas del esqueleto (hombro-cadera-rodilla-tobillo) sobre canvas.
// Lee de un ref (no de props/estado) y corre su propio rAF — así no
// provoca un render de React por cada frame de vídeo.
const POSE_OVERLAY_CONNECTIONS = [
  [11, 12], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28],
];

function PoseDetectionOverlay({ landmarksRef }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    let raf;
    const draw = () => {
      const canvas = canvasRef.current;
      if (canvas) {
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (canvas.width !== w) canvas.width = w;
        if (canvas.height !== h) canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const lm = landmarksRef.current;
        if (lm) {
          ctx.strokeStyle = C.teal;
          ctx.lineWidth = 2;
          POSE_OVERLAY_CONNECTIONS.forEach(([a, b]) => {
            const pa = lm[a], pb = lm[b];
            if (pa && pb) {
              ctx.beginPath();
              ctx.moveTo((1 - pa.x) * canvas.width, pa.y * canvas.height);
              ctx.lineTo((1 - pb.x) * canvas.width, pb.y * canvas.height);
              ctx.stroke();
            }
          });
          [11, 12, 23, 24, 25, 26, 27, 28].forEach((i) => {
            const p = lm[i];
            if (p) {
              ctx.fillStyle = C.teal;
              ctx.beginPath();
              ctx.arc((1 - p.x) * canvas.width, p.y * canvas.height, 4, 0, Math.PI * 2);
              ctx.fill();
            }
          });
        }
      }
      raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, [landmarksRef]);

  return <canvas ref={canvasRef} style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }} />;
}

// Barras simples por repetición — reutiliza DataValue, sin componente
// de gráfico nuevo. "REP 1 ━━━━━" equivalente visual.

  const max = Math.max(...reps.map((r) => r.cycleTime), 0.1);
  return (
    <div className="space-y-2">

        <div key={r.repetition} className="flex items-center gap-2">

          </div>
          <DataValue value={r.cycleTime} unit="s" size={13} />
        </div>
      ))}
    </div>
  );
}
