:root {
  --bg: #0A0A0F;
  --surface: #14141C;
  --card: #1A1A24;
  --border: #262633;
  --orange: #FF6B1A;
  --text: #F5F5F7;
  --muted: #8B8B99;
}
* { box-sizing: border-box; }
.sw-root { display: flex; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }
.sw-spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes signal { 0%,100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }

/* Sidebar */
.sw-sidebar { width: 232px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
.sw-brand { display: flex; align-items: center; gap: 10px; padding: 8px 8px 20px; }
.sw-brand-mark { display: flex; align-items: flex-end; gap: 3px; height: 22px; }
.sw-bar { width: 4px; background: var(--orange); border-radius: 2px; animation: signal 1.2s ease-in-out infinite; }
.b1 { height: 10px; } .b2 { height: 20px; animation-delay: 0.2s; } .b3 { height: 14px; animation-delay: 0.4s; }
.sw-brand-name { font-weight: 700; font-size: 15px; letter-spacing: 0.3px; }
.sw-brand-sub { font-size: 11px; color: var(--muted); }
.sw-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.sw-navitem { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: none; border: none; color: var(--muted); font-size: 13.5px; font-weight: 500; cursor: pointer; text-align: left; transition: all 0.15s; }
.sw-navitem:hover { background: rgba(255,255,255,0.04); color: var(--text); }
.sw-navitem.active { background: rgba(255,107,26,0.12); color: var(--orange); }
.sw-live { display: flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: 1px; color: var(--muted); padding: 10px 12px; }
.sw-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #34D399; animation: pulse 1.6s ease-in-out infinite; }
.sw-bottomnav { display: none; }

/* Main */
.sw-main { flex: 1; padding: 28px 32px 80px; max-width: 1200px; }
.sw-view { animation: fadeUp 0.35s ease both; }
.sw-loading { display: flex; align-items: center; gap: 8px; color: var(--muted); padding-top: 60px; justify-content: center; }
.sw-viewhead { margin-bottom: 22px; }
.sw-viewhead h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
.sw-muted { color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; }

.sw-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
.sw-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
.sw-grid-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; margin-bottom: 18px; }
.sw-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }

.sw-kpi-label { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
.sw-kpi-num { font-size: 30px; font-weight: 700; color: var(--orange); font-family: 'JetBrains Mono', monospace; margin-bottom: 4px; }

.sw-panel { margin-bottom: 18px; }
.sw-panel-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
.sw-panel-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sw-link { background: none; border: none; color: var(--orange); font-size: 12.5px; cursor: pointer; font-weight: 600; }

.sw-bestlist { display: flex; flex-direction: column; gap: 12px; }
.sw-bestitem { display: flex; align-items: center; gap: 10px; }
.sw-bestrank { width: 20px; height: 20px; border-radius: 6px; background: rgba(255,107,26,0.15); color: var(--orange); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sw-bestthumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
.sw-postthumb { border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sw-bestitle { font-size: 13px; font-weight: 500; margin-bottom: 2px; }

.sw-postgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.sw-postcard { padding: 0; overflow: hidden; cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
.sw-postcard:hover { transform: translateY(-2px); border-color: var(--orange); }
.sw-postcard-img { height: 130px; position: relative; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.02); }
.sw-postcard-net { position: absolute; top: 8px; right: 8px; background: rgba(10,10,15,0.7); border-radius: 6px; padding: 4px; backdrop-filter: blur(4px); }
.sw-postcard-body { padding: 12px; }
.sw-postcard-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
.sw-postcard-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.sw-pill { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }

/* Metrics */
.sw-metric { position: relative; overflow: hidden; }
.sw-metric-label { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.sw-metric-num { font-size: 26px; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; color: var(--orange); }

/* Calendar */
.sw-view-full { max-width: none; }
.sw-calhead { display: flex; align-items: center; justify-content: space-between; }
.sw-calnav { display: flex; align-items: center; gap: 10px; }
.sw-calmonth { font-size: 14px; font-weight: 600; min-width: 150px; text-align: center; text-transform: capitalize; }
.sw-iconbtn { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px; cursor: pointer; display: flex; }
.sw-iconbtn:hover { border-color: var(--orange); }
.sw-iconbtn.sm { padding: 5px; }
.sw-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 16px 0 8px; font-size: 11.5px; color: var(--muted); text-align: center; }
.sw-calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.sw-calcell { min-height: 108px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px; cursor: pointer; transition: border-color 0.15s; }
.sw-calcell.empty { background: none; border: none; cursor: default; }
.sw-calcell.empty-day { background: #101016; }
.sw-calcell.today { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange) inset; }
.sw-calcell.complete { border-color: rgba(255,107,26,0.6); }
.sw-calnum { font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
.sw-calcell.today .sw-calnum { color: var(--orange); }
.sw-calposts { display: flex; flex-direction: column; gap: 4px; }
.sw-calpost { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.03); border-radius: 6px; padding: 2px 4px; }
.sw-caltitle { font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw-calpub { color: #34D399; margin-left: auto; }
.sw-calmore { font-size: 10px; color: var(--muted); padding-left: 4px; }

/* Drawer */
.sw-drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: flex-end; z-index: 50; animation: fadeUp 0.2s ease both; }
.sw-drawer { width: 380px; max-width: 92vw; background: var(--surface); height: 100vh; border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; }
.sw-drawer-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
.sw-drawer-title { font-size: 16px; font-weight: 700; text-transform: capitalize; margin-bottom: 2px; }
.sw-drawer-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.sw-drawer-item { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
.sw-drawer-item img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
.sw-drawer-iteminfo { flex: 1; min-width: 0; }
.sw-empty { padding: 20px 0; display: block; text-align: center; }

.sw-form { display: flex; flex-direction: column; gap: 6px; }
.sw-form label { font-size: 11.5px; color: var(--muted); margin-top: 10px; font-weight: 600; }
.sw-form input, .sw-form select { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 13.5px; }
.sw-segrow { display: flex; flex-wrap: wrap; gap: 6px; }
.sw-seg { background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 7px 10px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.sw-seg.active { border-color: var(--orange); color: var(--orange); background: rgba(255,107,26,0.1); }
.sw-formrow { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.sw-formrow.tight { margin-top: 10px; }

.sw-btn-primary { background: var(--orange); color: #0A0A0F; border: none; border-radius: 10px; padding: 10px 16px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sw-btn-primary:disabled { opacity: 0.6; cursor: default; }
.sw-btn-ghost { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
.sw-btn-ghost.sm { padding: 6px 10px; font-size: 12px; }
.sw-btn-ghost.active { border-color: #00C2FF; color: #00C2FF; }
.sw-fullw { width: 100%; justify-content: center; }

/* Ideas */
.sw-ideainput { display: flex; gap: 8px; }
.sw-ideainput input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 13.5px; }
.sw-ideainput select { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; color: var(--text); font-size: 13px; }
.sw-ideagrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 16px; }
.sw-ideacard { position: relative; }
.sw-ideacard p { font-size: 13.5px; margin: 10px 0 0; line-height: 1.5; }
.sw-ideadel { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--muted); }
.sw-tag { font-size: 10.5px; font-weight: 700; color: var(--orange); background: rgba(255,107,26,0.12); padding: 3px 8px; border-radius: 20px; }
.sw-tag.alt { color: var(--muted); background: rgba(255,255,255,0.06); }

/* Scripts */
.sw-error { color: #F87171; font-size: 12.5px; margin-top: 10px; }
.sw-scriptdraft { border-color: var(--orange); }
.sw-scripttags { display: flex; gap: 6px; }
.sw-scriptblock { margin-bottom: 12px; }
.sw-scriptblock b { font-size: 11.5px; color: var(--orange); text-transform: uppercase; letter-spacing: 0.5px; }
.sw-scriptblock p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.5; }
.sw-scriptblock ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; line-height: 1.6; }
.sw-scriptlib { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
.sw-scriptcard { position: relative; display: flex; flex-direction: column; gap: 8px; }
.sw-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Carousel preview */
.sw-carousel-preview { display: flex; justify-content: center; }
.sw-slide { width: 320px; height: 400px; border-radius: 18px; border: 2px solid; padding: 22px; display: flex; flex-direction: column; }
.sw-slide-role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }
.sw-slide-text { flex: 1; background: none; border: none; resize: none; font-size: 17px; font-weight: 600; line-height: 1.4; outline: none; font-family: inherit; }
.sw-slide-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.sw-slide-dots { display: flex; gap: 5px; }
.sw-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; }
.sw-dot.active { background: var(--orange); width: 16px; border-radius: 4px; }

/* Mobile */
@media (max-width: 860px) {
  .sw-grid-3, .sw-grid-2, .sw-grid-4 { grid-template-columns: 1fr; }
  .sw-sidebar { display: none; }
  .sw-main { padding: 18px 14px 90px; }
  .sw-bottomnav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); z-index: 40; }
  .sw-bnitem { flex: 1; background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 2px 8px; font-size: 9.5px; }
  .sw-bnitem.active { color: var(--orange); }
  .sw-calgrid { grid-template-columns: repeat(7, minmax(38px, 1fr)); gap: 4px; }
  .sw-calcell { min-height: 64px; padding: 4px; }
  .sw-calpost span { display: none; }
  .sw-weekdays { font-size: 9px; }
  .sw-drawer { width: 100vw; }
  .sw-slide { width: 100%; }
}
